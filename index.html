{id:1,t:"Muhasebenin Dünyası",sub:"Tanım, işlevler, araçlar, bilgi akışı, kullanıcılar",min:25,html:`
<div class="core"><b>Çekirdek</b>Her varlığın bir kaynağı vardır; bu yüzden <b>Varlıklar = Kaynaklar</b>. Muhasebe, bu eşitliği etkileyen (ama asla bozmayan) parayla ölçülebilen mali olayları kaydeden, sınıflandıran, özetleyen ve yorumlayan sistemdir. Dersin bütün konuları bu cümlenin sonucudur.</div>
<h3>İşletme nedir, kaça ayrılır?</h3>
<p><b>İşletme</b>, insan gereksinimlerini karşılamak üzere mal ve hizmet üretiminde bulunan ekonomik ve teknik birimlerdir. İki türü vardır:</p>
<ul><li><b>Ticari işletme:</b> amacı <b>kâr</b> etmektir.</li><li><b>Toplumsal işletme:</b> toplumun mal veya hizmet gereksinimlerini <b>kâr amacı gütmeksizin</b> karşılar. Örnekler: sağlık kurumları, eğitim kurumları, kamu yararına çalışan vakıf ve dernekler.</li></ul>
<div class="tip"><b>Sınavda nasıl sorulur</b>Örnek verip "hangisi toplumsal işletmedir?" diye sorar. Anahtar: <u>kâr amacı gütmeme</u>. Anonim veya limited şirket ticari işletmedir.</div>
<h3>İşletme fonksiyonları (7)</h3>
<p>Tedarik · Üretim · Pazarlama · Finansman · <b>Muhasebe</b> · Yönetim · İnsan Kaynakları Yönetimi. Muhasebe bunlardan yalnızca biridir; ama diğer altı fonksiyonun yarattığı bütün finansal olayları kaydeder. Bu yüzden "işletmenin dili" diye anılır.</p>
<h3>Muhasebenin iki tanımı</h3>
<div class="tw"><table><tr><th>Tanım</th><th>Anahtar sözcükler</th></tr>
<tr><td><b>Sistem tanımı:</b> İşletmede ortaya çıkan finansal olayları sistematik olarak kaydeden, bunları <b>zamanlı, ilgili, güvenilir ve karşılaştırılabilir</b> bilgilere dönüştürerek <b>karar vericilere sunan</b> bir sistemdir.</td><td>zamanlı · ilgili · güvenilir · karşılaştırılabilir · karar verici</td></tr>
<tr><td><b>Teknik tanımı:</b> İşletmede ortaya çıkan mali olayları <b>tarih sırasına göre kaydeden, sınıflandıran, raporlayan (özetleyen)</b> ve bu bilgileri <b>analiz ederek yorumlayan</b> teknikler bütünüdür.</td><td>tarih sırası · kaydet · sınıflandır · raporla · analiz ve yorum</td></tr></table></div>
<h3>Bilgi nasıl akar? (en önemli şema)</h3>
<pre class="eq">OLAY  →  BELGE  →  YEVMİYE  →  BÜYÜK DEFTER  →  MİZAN  →  FİNANSAL TABLOLAR  →  ANALİZ
(satış) (fatura)  (tarih sırası) (hesap hesap)   (kontrol)  (bilanço, gelir t.)  (yorum)</pre>
<p>Bu şemayı bildiğinde dersin sırasını bilirsin: önce olayın belgesi, sonra yevmiyeye kayıt, sonra hesaplara aktarma, sonra kontrol (mizan), sonra tablolar.</p>
<h3>İşlev ve araç eşleştirmesi (en sık soru)</h3>
<div class="tw"><table><tr><th>İşlev</th><th>Araç</th><th>Ne yapar?</th></tr>
<tr><td><b>Kaydetme</b></td><td><b>Yevmiye Defteri</b></td><td>Olayı tarih sırasıyla yazar</td></tr>
<tr><td><b>Sınıflandırma</b></td><td><b>Defter-i Kebir (Büyük Defter)</b></td><td>Aynı tür olayları hesap başlığı altında toplar</td></tr>
<tr><td><b>Raporlama (özetleme)</b></td><td><b>Temel mali tablolar:</b> Bilanço (Finansal Durum Tablosu), Gelir Tablosu</td><td>Durumu ve dönem sonucunu özetler</td></tr>
<tr><td><b>Analiz ve yorum</b></td><td><b>Finansal analiz teknikleri</b></td><td>Tablo kalemlerini yorumlar</td></tr></table></div>
<p>Slayt 11'e göre <b>birinci işlev</b>: finansal nitelikli işlemlerin tanımlanıp kaydedilmesi, sınıflandırılması ve özetlenmesi. <b>İkinci işlev</b>: finansal tablolarda özetlenen durumun analiz edilip yorumlanarak ilgili taraflara iletilmesi.</p>
<div class="trap"><b>Tuzak</b>"Sınıflandırma = Yevmiye" yanlıştır. Yevmiye <u>kaydeder</u>, kebir <u>sınıflandırır</u>. Bir de iki tanımı karıştırma: "karar vericilere sunan sistem" ile "teknikler bütünü" ayrı cümlelerdir.</div>
<h3>Finansal analiz</h3>
<p><b>Tanım:</b> finansal tablolardaki <b>kalemler arasındaki ilişkilerin</b> ve <b>zaman içindeki eğilimlerin</b> incelenmesi. İki amacı vardır: (1) işletmeyi <b>değerlendirmek</b>: mali yapısı, kredibilitesi, faaliyet sonuçları; güçlü ve zayıf yönleri. (2) <b>Geleceğe yönelik kararlarda</b> bilgi desteği sağlamak.</p>
<h3>Bilgiyi kim, neden kullanır?</h3>
<div class="tw"><table><tr><th>Kullanıcı</th><th>Neye bakar?</th></tr>
<tr><td>İşletme yönetimi</td><td>Yönetim yeterliliği, planlama</td></tr>
<tr><td>Sahipler ve ortaklar</td><td>Dağıtılabilir kâr, temettü</td></tr>
<tr><td>Potansiyel ortaklar</td><td>Hisse senedini alma, elde tutma, satma kararı</td></tr>
<tr><td>Borç verenler (verecekler)</td><td>Verilen fonlar emniyette mi, kredibilite</td></tr>
<tr><td>Tedarikçiler</td><td>Vadeli satışta alacağın ödenme gücü</td></tr>
<tr><td>Çalışanlar</td><td>İşletme ücret ve diğer menfaatleri sağlayabilecek güçte mi</td></tr>
<tr><td>Devlet</td><td>Vergi politikası, ulusal gelir istatistikleri, yasal düzenleme</td></tr>
<tr><td>Ekonomiyi değerlendirmek isteyenler</td><td>Ekonominin durumu ve gelişimi</td></tr></table></div>
<p><b>Muhasebe dalları (4):</b> Genel (Finansal) Muhasebe, Şirketler Muhasebesi, Maliyet Muhasebesi, Yönetim Muhasebesi. Bu ders <b>Genel (Finansal) Muhasebe</b>dir.</p>
<div class="tip"><b>Ek bilgi (slayt dışı)</b>Defter tutma yükümlülüğünün yasal dayanakları genelde Vergi Usul Kanunu ve Türk Ticaret Kanunu'dur; slayt bunları "mevzuat hükümleri (yasa, yönetmelik, tebliğ)" başlığı altında toplar.</div>`,
recall:[["Kaydetme, sınıflandırma, raporlama, analiz hangi araçlarla yapılır?","Yevmiye · Defter-i Kebir · Temel mali tablolar (bilanço, gelir tablosu) · Finansal analiz teknikleri."],["Finansal analizin iki amacı?","İşletmeyi değerlendirmek; geleceğe yönelik kararlarda bilgi desteği sağlamak."],["Toplumsal işletme ile ticari işletme farkı?","Ticari: amaç kâr. Toplumsal: kâr amacı gütmeden toplumun gereksinimini karşılar."],["Bilgi akışını baştan sona say.","Olay, belge, yevmiye, büyük defter, mizan, finansal tablolar, analiz."],["İki tanımı ayırt edici sözcüklerle söyle.","Sistem: zamanlı, ilgili, güvenilir, karşılaştırılabilir, karar verici. Teknikler bütünü: tarih sırasıyla kaydet, sınıflandır, raporla, analiz et ve yorumla."]]},

{id:2,t:"Faydalı Bilginin Nitelikleri",sub:"Temel 2, destekleyici 4 (TMS/TFRS Kavramsal Çerçeve)",min:15,html:`
<div class="core"><b>Çekirdek</b>Finansal bilginin "iyi" sayılması için <b>2 temel</b> ve <b>4 destekleyici</b> niteliği vardır. Sınavda temel olanı destekleyici, destekleyici olanı temel diye sorarlar.</div>
<pre class="eq">TEMEL (2)                         DESTEKLEYİCİ (4)
├─ İhtiyaca uygunluk              ├─ Karşılaştırılabilirlik
└─ Gerçeğe uygun sunum            ├─ Doğrulanabilirlik
                                  ├─ Zamanında sunum
                                  └─ Anlaşılabilirlik</pre>
<h3>Temel nitelikler</h3>
<div class="tw"><table><tr><th>Özellik</th><th>Ne demek?</th><th>Alt şartları</th></tr>
<tr><td><b>İhtiyaca uygunluk</b></td><td>Bilgi, kullanıcıların <b>kararlarını etkileme gücüne</b> sahiptir.</td><td><b>Tahminlerde kullanılabilmeli</b> (tahmin değeri) ve <b>teyit edici</b> olmalı (geçmiş beklentiyi doğrular ya da düzeltir).</td></tr>
<tr><td><b>Gerçeğe uygun sunum</b></td><td>Bilgi, anlatmak istediği olayı doğru yansıtır.</td><td><b>Tam</b> sunum, <b>tarafsız</b> sunum, <b>hatasız</b> sunum.</td></tr></table></div>
<div class="tip"><b>Terim çevirisi</b>İhtiyaca uygunluk: "bu bilgi karar verdirir mi?" Gerçeğe uygun sunum: "gerçeği eksiksiz, yanlı olmadan, yanlışsız anlatıyor mu?"</div>
<h3>Destekleyici nitelikler (ek açıklama)</h3>
<ul><li><b>Karşılaştırılabilirlik:</b> Bilginin diğer dönemlerle ve diğer işletmelerle kıyaslanabilmesi. (Muhasebe kavramlarından <b>tutarlılık</b> bunu sağlar.)</li><li><b>Doğrulanabilirlik:</b> Bilginin gerçeğe uygun sunulduğuna dair güven; bağımsız kişiler aynı sonuca ulaşabilir.</li><li><b>Zamanında sunum:</b> Bilginin karar vericiye kararını etkileyebilecek zamanda ulaşması.</li><li><b>Anlaşılabilirlik:</b> Bilginin açık ve özlü sınıflandırılıp sunulması.</li></ul>
<p><b>Sınav ipucu:</b> Slayt yalnızca isimleri sayar; sınavda tanım sorulursa yukarıdaki sade karşılıklar yeterlidir.</p>
<div class="trap"><b>Tuzak</b>"Tahmin ve teyit" gerçeğe uygun sunumun değil, <u>ihtiyaca uygunluğun</u> parçasıdır. "Tam, tarafsız, hatasız" ise gerçeğe uygun sunumun şartlarıdır. İhtiyaca uygunluk temel nitelik, karşılaştırılabilirlik destekleyicidir.</div>`,
recall:[["Temel 2 ve destekleyici 4 niteliği say.","Temel: ihtiyaca uygunluk, gerçeğe uygun sunum. Destekleyici: karşılaştırılabilirlik, doğrulanabilirlik, zamanında sunum, anlaşılabilirlik."],["Gerçeğe uygun sunumun 3 şartı?","Tam, tarafsız, hatasız."],["Tahmin ve teyit değeri hangi niteliğin parçası?","İhtiyaca uygunluk."]]},

{id:3,t:"Dayanaklar ve Tablo Setleri",sub:"Dört dayanak, THP ve TMS karşılaştırması",min:15,html:`
<div class="core"><b>Çekirdek</b>Finansal muhasebe dört dayanak üzerinde durur. Aynı tablolar Türkiye'de iki ayrı adla anılır: Tekdüzen Hesap Planı (THP) ve Türkiye Muhasebe Standartları (TMS). Hangi tablo hangi sette, hangi adla?</div>
<h3>Finansal muhasebeyi biçimlendiren 4 temel</h3>
<ol><li><b>Muhasebenin temel kavramları</b> (12 kavram: sosyal sorumluluk, kişilik, süreklilik vb.)</li><li><b>Genel kabul görmüş muhasebe ilkeleri</b> (bilanço ve gelir tablosu ilkeleri)</li><li><b>Türkiye Muhasebe Standartları – Uluslararası Muhasebe Standartları</b></li><li><b>Mevzuat hükümleri</b> (yasa, yönetmelik, tebliğ)</li></ol>
<h3>THP ile TMS karşılaştırması</h3>
<div class="tw"><table><tr><th></th><th>Tekdüzen Hesap Planı (THP)</th><th>TMS/TFRS</th></tr>
<tr><td>Bilanço adı</td><td><b>Bilanço</b></td><td><b>Finansal Durum Tablosu</b></td></tr>
<tr><td>Gelir tablosu adı</td><td><b>Gelir Tablosu</b></td><td><b>Kapsamlı Gelir Tablosu</b></td></tr>
<tr><td>Temel tablolar</td><td>Bilanço + Gelir tablosu</td><td>Finansal durum, kapsamlı gelir, <b>nakit akış</b>, özkaynak değişim tabloları + <b>dipnotlar</b></td></tr>
<tr><td>Ek tablolar</td><td><b>Fon akım, nakit akım, özkaynak değişim, satışların maliyeti, kâr dağıtım</b></td><td>(ek tablo ayrımı yok)</td></tr>
<tr><td>Format</td><td>Standart (tekdüze)</td><td>Standart format <b>yok</b>; asgari kalemler tanımlı</td></tr></table></div>
<h3>Tablo kimlik kartları</h3>
<div class="tw"><table><tr><th>Tablo</th><th>Neyi gösterir?</th><th>Zaman boyutu</th></tr>
<tr><td>Bilanço / Finansal durum tablosu</td><td>Varlıklar ve kaynaklar</td><td>Belli bir <b>tarih</b></td></tr>
<tr><td>Gelir tablosu / Kapsamlı gelir tablosu</td><td>Gelir, gider, kâr, zarar</td><td>Belli bir <b>dönem</b></td></tr>
<tr><td>Nakit akım / akış tablosu</td><td>Nakit giriş ve çıkışları</td><td>Dönem</td></tr>
<tr><td>Özkaynak değişim tablosu</td><td>Özkaynak kalemlerindeki değişimler</td><td>Dönem</td></tr>
<tr><td>Dipnotlar</td><td>Önemli muhasebe politikalarının özeti ve açıklamalar</td><td>-</td></tr></table></div>
<div class="trap"><b>Tuzak</b>THP'de <b>"akım"</b> (fon akım, nakit akım), TMS'de <b>"akış"</b> (nakit akış). Gelir tablosu THP'de temel tablodur, ek tablo <u>değildir</u>. Kâr dağıtım tablosu TMS tablo setinde sayılmaz.</div>
<div class="tip"><b>Akademik not · sınavda hocanın anlatımını yaz</b>Hoca THP'nin ek mali tablolarını <b>5</b> sayar (fon akım, nakit akım, özkaynak değişim, satışların maliyeti, kâr dağıtım). Bazı kaynaklar listeye <i>net işletme sermayesi değişim tablosunu</i> da ekleyip 6 sayar.</div>`,
recall:[["THP'nin 5 ek mali tablosu?","Fon akım, nakit akım, özkaynak değişim, satışların maliyeti, kâr dağıtım tablosu."],["TMS'de bilanço ve gelir tablosunun adı?","Finansal Durum Tablosu; Kapsamlı Gelir Tablosu."],["Muhasebenin 4 temel dayanağı?","Kavramlar, ilkeler, standartlar (TMS/UMS), mevzuat."]]},

{id:4,t:"12 Muhasebe Kavramı",sub:"Anahtar kelime, mini vaka, ayırıcı cümleler",min:40,html:`
<div class="core"><b>Çekirdek</b>Önce <b>sırayı</b>, sonra her kavramın <b>anahtar kelimesini</b> öğren. Sınav, kitap cümlesini ters yüz eder ya da bir olay anlatıp kavramı sorar. Anahtar kelimeyi bilen çeldiriciyi tanır.</div>
<h3>Sıra hikâyesi</h3>
<p><i>Toplum</i> (1) içinde bir <i>kişi</i> (2) yaşar; bu kişi <i>ölmez</i> (3). Hayatını <i>yıllara böler</i> (4), her şeyi <i>parayla ölçer</i> (5), aldığı malı <i>aldığı fiyattan</i> yazar (6). Yazdığı her şeyin <i>belgesi</i> vardır (7). Defterini <i>her yıl aynı usulle</i> tutar (8), <i>hiçbir şeyi saklamaz</i> (9). Ama <i>temkinlidir</i> (10), <i>önemliyi küçükten ayırır</i> (11), <i>görünüşe değil gerçeğe bakar</i> (12).</p>
<h3>Her kavramın içi</h3>
<div class="kv"><b>1 · Sosyal Sorumluluk</b><span>Muhasebe organizasyonunda, uygulamalarda ve tabloların düzenlenmesinde belli kişi ve gruplar değil <b>tüm toplumun çıkarı</b> gözetilir; bilgi üretiminde <b>gerçeğe uygun, tarafsız ve dürüst</b> davranılır. "Patronum öyle istiyor" bahanesi geçmez.</span></div>
<div class="kv"><b>2 · Kişilik</b><span>İşletme; sahip veya sahiplerinden, yöneticilerinden, personelinden ve diğer ilgililerden <b>ayrı bir kişiliğe</b> sahiptir ve <b>bu kişilik adına</b> yürütülür. Sahibin ev kirası işletme gideri olamaz.</span></div>
<div class="kv"><b>3 · İşletmenin Sürekliliği</b><span>İşletme faaliyetlerini <b>bir süreye bağlı olmaksızın</b> sürdürecektir; sahip ya da hissedarların yaşam süreleriyle bağlı değildir. <b>Maliyet esasının temelini oluşturur</b>. Kapanacak işletmede varlıklar tasfiye değeriyle izlenirdi; kapanmayacağı için edinme maliyeti kullanılır.</span></div>
<div class="kv"><b>4 · Dönemsellik</b><span>Sınırsız kabul edilen ömür <b>belli dönemlere bölünür</b>; her dönemin sonucu diğerlerinden bağımsız saptanır. Gerekleri: (a) gelir ve giderlerin <b>tahakkuk esasına</b> göre muhasebeleştirilmesi, (b) hasılat, gelir ve kârların <b>aynı döneme ait</b> maliyet, gider ve zararlarla karşılaştırılması. Gider ödendiği değil <u>ait olduğu</u> döneme yazılır.</span></div>
<div class="kv"><b>5 · Parayla Ölçülme</b><span><b>Para ile ölçülebilen</b> iktisadi olay ve işlemler ortak ölçü olan <b>para birimiyle</b> yansıtılır. Muhasebe işlemleri <b>ulusal para</b> cinsinden yürütülür. Çalışan memnuniyeti gibi ölçülemeyen şeyler kayda girmez.</span></div>
<div class="kv"><b>6 · Maliyet Esası</b><span>Varlık ve hizmetler <b>elde etme (edinme) maliyetiyle</b> kaydedilir. <b>Para mevcudu, alacaklar</b> ve maliyeti belirlenmesi mümkün/uygun olmayan diğer kalemler <u>hariçtir</u>. Piyasa değeri yükselse de kayıt maliyetle sürer.</span></div>
<div class="kv"><b>7 · Tarafsızlık ve Belgelendirme</b><span>Kayıtlar gerçek durumu yansıtan, usulüne uygun düzenlenmiş <b>objektif belgelere</b> dayanır; kayıtlara esas yöntemler seçilirken <b>tarafsız ve önyargısız</b> davranılır.</span></div>
<div class="kv"><b>8 · Tutarlılık</b><span>Seçilen muhasebe politikaları <b>birbirini izleyen dönemlerde değiştirilmeden</b> uygulanır. Amaç: mali durumun, faaliyet sonuçlarının ve yorumların <b>karşılaştırılabilir</b> olması.</span></div>
<div class="tip"><b>Akademik not · sınavda hocanın anlatımını yaz</b>Hoca tutarlılığı "değiştirilmeden uygulanması" diye tanımlar. Standartlara göre geçerli bir nedenle politika değiştirilebilir; ancak değişiklik ve parasal etkisi dipnotlarda açıklanmak zorundadır.</div>
<div class="kv"><b>9 · Tam Açıklama</b><span>Mali tablolar, kullanıcıların doğru karar vermesine yardımcı olacak ölçüde <b>yeterli, açık ve anlaşılır</b> olmalıdır.</span></div>
<div class="kv"><b>10 · İhtiyatlılık</b><span><b>Temkinli</b> davranılır; işletmenin karşılaşabileceği riskler göz önüne alınır. Sonuç: muhtemel <b>gider ve zararlar için karşılık ayrılır</b>; muhtemel <b>gelir ve kârlar için gerçekleşme dönemine kadar muhasebe işlemi yapılmaz</b>. Slayt örnekleri: şüpheli alacak karşılığı, değeri düşen mallar için karşılık, hisse senedi değer düşüklüğü karşılığı, kıdem tazminatı karşılığı, yedek ayrılması.</span></div>
<div class="kv"><b>11 · Önemlilik</b><span>Bir kalemin veya olayın <b>nispi ağırlığı ve değeri</b>, tablolara dayanarak yapılacak değerlemeleri veya kararları etkileyebilecek düzeydeyse önemlidir. <b>Önemli kalemlerin tablolarda yer alması zorunludur.</b></span></div>
<div class="kv"><b>12 · Özün Önceliği</b><span>İşlemlerin muhasebeye yansıtılmasında ve değerlendirilmesinde <b>biçimlerinden çok özlerinin</b> esas alınması. Hukuki görünüş ≠ ekonomik gerçek.</span></div>
<h3>Mini vaka antrenmanı: olay → kavram</h3>
<div class="tw"><table><tr><th>Olay</th><th>Kavram</th></tr>
<tr><td>Sahibin çocuğunun okul ücreti işletme kasasından ödenip gider yazılıyor.</td><td><b>Kişilik</b></td></tr>
<tr><td>Sahibin ölümüne rağmen işletme kayıtlarını sürdürüyor.</td><td><b>Süreklilik</b></td></tr>
<tr><td>Aralık kirası Ocak'ta ödenmesine rağmen Aralık gideri yazılıyor.</td><td><b>Dönemsellik</b></td></tr>
<tr><td>Değeri 10.000 TL'ye alınan demirbaş, piyasa fiyatı yüksek olsa da 10.000 TL ile izleniyor.</td><td><b>Maliyet esası</b></td></tr>
<tr><td>Her yıl farklı stok değerleme yöntemi kullanılıyor.</td><td><b>Tutarlılık</b> ihlali</td></tr>
<tr><td>Tahsil edilemeyeceği öngörülen alacak için karşılık ayrılıyor.</td><td><b>İhtiyatlılık</b></td></tr>
<tr><td>Henüz gerçekleşmemiş bir kâr gelir yazılıyor.</td><td><b>İhtiyatlılık</b> ihlali</td></tr>
<tr><td>Tablolar kullanıcıya karar verdirecek kadar açık ve anlaşılır değil.</td><td><b>Tam açıklama</b></td></tr>
<tr><td>Kaydın dayanağı olacak belge yok.</td><td><b>Tarafsızlık ve belgelendirme</b></td></tr>
<tr><td>Hukuken satış görünümlü ama riskleri hâlâ işletmede kalan işlem, ekonomik gerçeğe göre kaydediliyor.</td><td><b>Özün önceliği</b></td></tr>
<tr><td>Tutarı karar vermeyi etkileyebilecek büyüklükteki kalem tabloda yer alıyor.</td><td><b>Önemlilik</b></td></tr>
<tr><td>Çalışan memnuniyeti hesap olarak kaydedilemiyor.</td><td><b>Parayla ölçülme</b></td></tr>
<tr><td>Yöneticiler değil tüm toplum için dürüst bilgi üretiliyor.</td><td><b>Sosyal sorumluluk</b></td></tr></table></div>
<h3>Soru kökünden kavrama giden anahtar sözcük tablosu</h3>
<div class="tw"><table><tr><th>Soruda geçen kelime</th><th>Kavram</th></tr>
<tr><td>tüm toplum, dürüst, tarafsız bilgi</td><td>Sosyal sorumluluk</td></tr>
<tr><td>sahipten ayrı, işletme adına</td><td>Kişilik</td></tr>
<tr><td>süreye bağlı olmaksızın, maliyet esasının temeli</td><td>Süreklilik</td></tr>
<tr><td>dönemlere bölünme, tahakkuk, aynı dönemin gider ve maliyetleri</td><td>Dönemsellik</td></tr>
<tr><td>ortak ölçü, ulusal para</td><td>Parayla ölçülme</td></tr>
<tr><td>elde etme maliyeti, para mevcudu ve alacaklar hariç</td><td>Maliyet esası</td></tr>
<tr><td>objektif belge, önyargısız yöntem</td><td>Tarafsızlık ve belgelendirme</td></tr>
<tr><td>değiştirilmeden, birbirini izleyen dönemler</td><td>Tutarlılık</td></tr>
<tr><td>yeterli, açık, anlaşılır</td><td>Tam açıklama</td></tr>
<tr><td>temkinli, karşılık, gerçekleşene kadar işlem yapılmaz</td><td>İhtiyatlılık</td></tr>
<tr><td>nispi ağırlık, kararları etkileyebilecek düzey</td><td>Önemlilik</td></tr>
<tr><td>biçimden çok öz</td><td>Özün önceliği</td></tr></table></div>
<h3>Benzer kavramları ayıran tek cümleler</h3>
<div class="tw"><table><tr><th>İkili</th><th>Ayırıcı</th></tr>
<tr><td>Süreklilik ↔ Dönemsellik</td><td>Süreklilik ömrü <b>sınırsız</b> sayar; dönemsellik o ömrü <b>dilimler</b>.</td></tr>
<tr><td>Tutarlılık ↔ Karşılaştırılabilirlik</td><td>Tutarlılık <b>kavram</b>; karşılaştırılabilirlik <b>nitelik/amaç</b>.</td></tr>
<tr><td>Tam açıklama ↔ Önemlilik</td><td>Tam açıklama <b>yeterlilik</b>; önemlilik <b>karar üzerindeki etki</b>.</td></tr>
<tr><td>Tarafsızlık-belgelendirme ↔ Sosyal sorumluluk</td><td>Birincisi <b>kayıt-belge</b>; ikincisi <b>tüm toplum, dürüstlük</b>.</td></tr>
<tr><td>Kişilik ↔ Özün önceliği</td><td>Kişilik <b>kimin adına</b>; özün önceliği <b>biçim mi öz mü</b>.</td></tr>
<tr><td>Maliyet esası ↔ İhtiyatlılık</td><td>Maliyet <b>nasıl değerlenir</b>; ihtiyatlılık <b>gider-gelir ayrımında temkin</b>.</td></tr></table></div>
<div class="trap"><b>Tuzak</b>"Maliyet esası tüm varlıklara uygulanır" yanlıştır: <u>para mevcudu ve alacaklar hariçtir</u>. İhtiyatlılığın tersi sorulursa: "muhtemel kârı hemen gelir yazmak". "Muhasebe sistemi kavramları" listesinde karşılaştırılabilirlik <u>yoktur</u>; o bir niteliktir.</div>`,
recall:[["12 kavramı sırayla say.","Sosyal sorumluluk, kişilik, süreklilik, dönemsellik, parayla ölçülme, maliyet esası, tarafsızlık ve belgelendirme, tutarlılık, tam açıklama, ihtiyatlılık, önemlilik, özün önceliği."],["Maliyet esasının temeli hangi kavram, dışındaki kalemler hangisi?","İşletmenin sürekliliği. Dışında: para mevcudu ve alacaklar."],["İhtiyatlılığın ezber cümlesi?","Gideri hemen yaz, geliri gerçekleşince yaz."],["Dönemsellik'in iki gereği?","Gelir-giderlerin tahakkuk esasıyla kaydı; gelirlerin aynı döneme ait gider ve maliyetlerle karşılaştırılması."],["Tutarlılığın amacı nedir?","Mali durum, faaliyet sonuçları ve yorumların karşılaştırılabilir olması."]]},

{id:5,t:"Bilanço I: Kavram, Eşitlik, Gruplar",sub:"An fotoğrafı, aktif-pasif, 100-599, düzenleme biçimleri",min:40,html:`
<div class="core"><b>Çekirdek</b>Bilanço, işletmenin <b>belli bir tarihte</b> sahip olduğu varlıkları ve bunların hangi kaynaklarla sağlandığını gösterir. Bilanço bir <u>an</u>, gelir tablosu bir <u>dönemdir</u>.</div>
<h3>Temel eşitlik</h3>
<div class="tw"><table><tr><th>Sol (AKTİF)</th><th>=</th><th>Sağ (PASİF)</th></tr>
<tr><td>Varlıklar</td><td>=</td><td>Kaynaklar</td></tr>
<tr><td>Dönen varlıklar + Duran varlıklar</td><td>=</td><td>KVYK + UVYK + Sermaye</td></tr>
<tr><td>Mevcutlar + Alacaklar</td><td>=</td><td>Borçlar + Sermaye</td></tr>
<tr><td><b>Varlıklar − Borçlar</b></td><td>=</td><td><b>Sermaye</b></td></tr></table></div>
<div class="core"><b>Hesaplama sorularının tamamı bunlardır</b>Özkaynak = Aktif − Yabancı kaynaklar (KVYK + UVYK). Duran varlık = Aktif − Dönen varlık. Dönem kârı/zararı = Özkaynak − Sermaye (yedek ve geçmiş yıl kâr/zararı yoksa; varsa onlar da düşülür). Dönem kârı <b>pasifte, özkaynak içindedir</b>; dönem zararı özkaynak içinde eksi kalemdir.</div>
<h3>Aktif ve pasif ne anlatır?</h3>
<ul><li><b>Varlık (aktif):</b> geçmiş olaylar sonucunda ortaya çıkan, halen işletmenin <b>kontrolünde</b> olan ve gelecekte işletmeye <b>ekonomik yarar sağlaması beklenen</b> değerler. Mevcut ve alacakların toplamıdır.</li><li><b>Kaynaklar (pasif):</b> varlıkların <b>nereden</b> sağlandığı. Yabancı kaynaklar ve özkaynaklardan oluşur.</li><li><b>Yabancı kaynaklar (borçlar):</b> <b>üçüncü kişilerin</b> işletme varlıkları üzerindeki hakları.</li><li><b>Sermaye / özkaynak:</b> <b>işletme sahiplerinin</b> varlıklar üzerindeki hakkı; ortakların kuruluşta veya sonradan artırımla tahsis ettiği değerler.</li></ul>
<p><b>Sıralama kuralı:</b> aktif <b>likidite esasıyla</b> (en likitten en az likite; paraya dönüşüm hızı); pasif <b>kaynağın sağlandığı yer ve geri ödeme süresine</b> göre: en kısa vadeli KVYK'dan başlar, UVYK ile sürer, süresiz kaynak olan özkaynakla biter.</p>
<h3>Düzenleme biçimleri</h3>
<div class="tw"><table><tr><th>Ölçüt</th><th>Tür</th><th>Özellik</th></tr>
<tr><td rowspan="2">Biçim</td><td><b>Hesap tipi</b></td><td>Aktif solda, pasif sağda <b>yan yana</b> (Tablo 1.1)</td></tr>
<tr><td><b>Rapor tipi</b></td><td>Aktif ve pasif <b>alt alta</b>; birden çok yılı yan yana (cari yıl / önceki yıl) gösterir, <b>analize daha uygundur</b> (Tablo 1.2)</td></tr>
<tr><td rowspan="2">Kapsam</td><td><b>Özet bilanço</b></td><td>Yalnız hesap <b>grup tutarları</b></td></tr>
<tr><td><b>Ayrıntılı bilanço</b></td><td>Gruplar + her gruptaki <b>hesap kalemleri</b></td></tr></table></div>
<h3>Bilançonun hesap tipi gösterimi (Tablo 1.1)</h3>
<pre class="eq">AKTİF                                  PASİF
I. DÖNEN VARLIKLAR        xxx          III. KISA VADELİ YABANCI KAYNAKLAR   xxx
  Hazır Değerler                          Mali Borçlar
  Menkul Kıymetler                        Ticari Borçlar
  Ticari Alacaklar                        Ödenecek Vergi ve Yükümlülükler
  Stoklar                                 Borç ve Gider Karşılıkları
  Diğer Dönen Varlıklar                IV. UZUN VADELİ YABANCI KAYNAKLAR    xxx
II. DURAN VARLIKLAR       xxx            Mali Borçlar
  Mali Duran Varlıklar                V. ÖZKAYNAKLAR                        xxx
  Maddi Duran Varlıklar                  Ödenmiş Sermaye
  Birikmiş Amortismanlar (−)             Sermaye Yedekleri
                                         Kâr Yedekleri
                                         Dönem Net Kârı
AKTİF TOPLAMI            xxxx          PASİF TOPLAMI                         xxxx</pre>
<p><b>Bilançoda bulunması gerekenler (slayt 33):</b> düzenlendiği <b>tarih ve işletme adı</b>, "bilanço" sözcüğü, raporlamada esas alınan <b>para birimi</b>, sayısal bilgilerin <b>kesinlik derecesi</b>; dipnotlarda uygulanan <b>değerleme ölçüleri ve amortisman yöntemleri</b>; belli bir düzen içinde ve <b>önceki dönemle karşılaştırmalı</b> sunum.</p>
<h3>Bölümler ve hesap aralıkları</h3>
<div class="tw"><table><tr><th>Bölüm</th><th>Aralık</th><th>Anlam ve örnekler</th></tr>
<tr><td><b>Dönen varlıklar</b></td><td class="n">100-199</td><td>Bir yıl veya işletmenin normal faaliyet dönemi içinde paraya çevrilebilecek, tahsil edilebilecek, satılabilecek, kullanılabilecek değerler. Hazır değerler, menkul kıymetler (geçici yatırım), <b>vadesi 1 yıldan kısa</b> ticari alacaklar, <b>stoklar</b>, gelecek aylara ait giderler ve gelir tahakkukları, diğer dönen varlıklar.</td></tr>
<tr><td><b>Duran varlıklar</b></td><td class="n">200-299</td><td>Normal şartlarda 1 yıl içinde elden çıkarılması düşünülmeyen veya <b>yararı 1 yılda tükenmeyen</b> varlıklar; <b>vadesi 1 yıldan uzun</b> alacaklar. Ticari alacaklar, diğer alacaklar, finansal duran varlıklar, <b>maddi</b> duran varlıklar, <b>maddi olmayan</b> duran varlıklar, gelecek yıllara ait giderler ve gelir tahakkukları, diğer duran varlıklar.</td></tr>
<tr><td><b>KVYK</b></td><td class="n">300-399</td><td>1 yıl veya normal faaliyet dönemi içinde <b>vadesi gelen (ödenecek)</b> borçlar. Ödenmeleri dönen varlık kullanımı ya da başka bir kısa vadeli borç yaratması beklenir. Faaliyet ve finansman faaliyetlerinden doğar: ödenecek vergiler, <b>alınan avanslar</b>, <b>gelecek aylara ait gelirler</b>, ticari borçlar, diğer borçlar.</td></tr>
<tr><td><b>UVYK</b></td><td class="n">400-499</td><td>Bir yıl veya normal faaliyet dönemi içinde <b>vadesi gelmemiş</b> borçlar; <b>1 yıldan sonra</b> ödenecek, kredi kurumlarından, sermaye piyasasından ve üçüncü kişilerden sağlanan 1 yıldan fazla vadeli borçlar.</td></tr>
<tr><td><b>Özkaynaklar</b></td><td class="n">500-599</td><td>Sahip veya ortakların sıfatıyla işletme varlıkları üzerindeki hakları: <b>ödenmiş sermaye</b> + işletmede bırakılan kârlar + <b>dönem net kârı/zararı</b>. Kredi verenler için güven unsuru.</td></tr></table></div>
<p>Slayt 46'ya göre yabancı kaynak kullanımı işletmenin varlıklarında değişim yaratır; yabancı kaynaklar varlıkları finanse etmek için kullanılır.</p>
<div class="ex"><b>Aynı alacak, farklı vade</b>Vadesi 8 ay olan senetli alacak dönen varlıktır (Alacak Senetleri). Vadesi 3 yıl olan aynı alacak duran varlıktır. Aynı borç da vade kısaysa KVYK, uzunsa UVYK'dır. Sınırı "1 yıl veya normal faaliyet dönemi" çizer.</div>
<h3>Bilanço nasıl düzenlenir? (6 adım)</h3>
<ol><li>Her hesabı sınıfla: aktif mi pasif mi?</li><li>Aktifleri dönen / duran olarak ayır (vade ve kullanım amacına göre).</li><li>Pasifleri KVYK / UVYK / özkaynak olarak ayır (vadeye göre).</li><li>Aktifleri likiditeye göre, pasifleri vade ve kaynağa göre sırala.</li><li>İki tarafın toplamını al. Düzenleyici (−) hesaplar (257 Birikmiş Amortismanlar, 103 Verilen Çekler, 501 Ödenmemiş Sermaye) toplama eklenmez, ait olduğu gruptan düşülür.</li><li>Eşit çıkmıyorsa fark dönem sonucudur: pasif eksikse dönem net kârı, aktif eksikse dönem net zararı. Zarar sermayeden düşülmez; özkaynak içinde eksi (−) kalem olarak yazılır. Kuruluş bilançosunda fark kâr değil sermayedir.</li></ol>
<div class="trap"><b>Tuzak</b>"Bilanço dönem sonucunu gösterir" yanlış (an). "Hesap tipi = alt alta" yanlış (alt alta rapor tipidir). "Özet bilanço kalemleri de gösterir" yanlış (ayrıntılı gösterir). "Alınan avanslar her zaman UVYK" yanlış (genellikle KVYK: 340; vadesi bir yıldan uzunsa UVYK: 440). "Pasif de likiditeye göre sıralanır" yanlış. "Özkaynak her zaman sermayeye eşittir" yanlış.</div>`,
recall:[["Bilançoyu 3 biçimde yaz.","Aktif = Pasif · Varlıklar = Kaynaklar · Dönen + Duran = KVYK + UVYK + Sermaye (Varlıklar − Borçlar = Sermaye)."],["Beş aralığı söyle.","100-199 dönen · 200-299 duran · 300-399 KVYK · 400-499 UVYK · 500-599 özkaynak."],["Rapor tipi bilanço analizde neden tercih edilir?","Birden fazla yılın bilançosunu yan yana göstererek karşılaştırmaya elverişli olduğu için."],["Aktif ve pasif neye göre sıralanır?","Aktif: likidite. Pasif: kaynağın sağlandığı yer ve geri ödeme süresi."],["Varlığın tanımındaki üç unsur?","Geçmiş olaylardan doğma, işletmenin kontrolünde olma, gelecekte ekonomik yarar beklenmesi."]]},

{id:6,t:"Bilanço II: Finansman ve TMS",sub:"Kim neyi finanse etmeli, özkaynak dağılımı, finansal durum tablosu",min:30,html:`
<div class="core"><b>Çekirdek</b>Uzun ömürlü varlık, uzun vadeli kaynakla finanse edilir. Kısa vadeli borçla duran varlık alırsan borcu ödemek için dönen varlık yetmez: <b>net çalışma sermayesi noksanı</b> doğar.</div>
<h3>Finansman ilkeleri</h3>
<ol><li><b>Duran varlıkların esas finansman yeri özkaynaklardır.</b> Özkaynaklar yetmezse özkaynakla birlikte uzun vadeli yabancı kaynaklar da kullanılır.</li><li><b>KVYK duran varlık finansmanına katılmamalıdır.</b> Aksi hâlde KVYK dönen varlıklardan büyük çıkar ve <b>net çalışma sermayesi noksanı</b> oluşur.</li><li><b>Özkaynak ağırlıklı</b> işletme alacaklılar açısından nispeten <b>güvenlidir</b>, çünkü varlıklar üzerinde ortakların hakkı çok daha fazladır. <b>Yabancı kaynak ağırlıklı</b> işletmenin riski yüksektir.</li><li>Borçla finansman politikasının altında yatan etken: <b>daha az özkaynak sağlanarak yüksek kârlılık</b> elde etmek, böylece <b>hisse başına kârın yüksek</b> olmasını sağlamak.</li><li>Borçla finansmanın riskleri: faaliyetlerin aksaması, yabancı kaynakların payının çok olmasından dolayı <b>yeni kaynak bulunamaması</b>, <b>faiz giderlerinin özkaynak ağırlıklı işletmelere göre daha yüksek olması</b>.</li></ol>
<div class="ex"><b>Sayısal örnek: net çalışma sermayesi</b>Dönen varlıklar 120.000, KVYK 80.000 ise net çalışma sermayesi = 120.000 − 80.000 = <b>40.000 (fazla)</b>. Dönen varlıklar 70.000, KVYK 90.000 ise = −20.000 → <b>20.000 noksan</b>.</div>
<h3>Özkaynağın iç dağılımı</h3>
<p class="sub">Bu tablo finansal güç açısından <b>ideal büyüklük sırasıdır</b>, bilançodaki yazılış sırası değildir. Bilançoda sıra: 50 Ödenmiş Sermaye, 52 Sermaye Yedekleri, 54 Kâr Yedekleri, 57 Geçmiş Yıllar Kârları, 58 Geçmiş Yıllar Zararları (−), 59 Dönem Net Kârı (Zararı).</p>
<div class="tw"><table><tr><th>Sıra</th><th>Kalem</th><th>Neden?</th></tr>
<tr><td class="n">1</td><td><b>Otofinansman</b> (kâr yedekleri + geçmiş yıllar kârları + dönem net kârı)</td><td>İşletmenin kendi faaliyetleriyle yarattığı değer; güvenin önemli göstergesi</td></tr>
<tr><td class="n">2</td><td><b>Ödenmiş sermaye</b></td><td>Ortakların tahsis ettiği büyüklük</td></tr>
<tr><td class="n">3</td><td><b>Sermaye yedekleri</b></td><td>Gerçek kâr yanında görüntü (fiktif) büyüklükler de içerir</td></tr>
<tr><td class="n">Son</td><td><b>Zarar kalemleri</b> (dönem net zararı, geçmiş yıllar zararları)</td><td>Hiç olmaması, varsa en sonda yer alması beklenir</td></tr></table></div>
<p>Slayt 47'ye göre özkaynak ağırlıklı çalışan bir işletme ilk bakışta güvenli bir izlenim verir; bu izlenimin olumlu olması için özkaynakların <b>kendi içindeki dağılımı</b> da önemlidir.</p>
<h3>TMS'ye göre bilanço: Finansal Durum Tablosu</h3>
<ul><li>Bilançonun adı <b>Finansal Durum Tablosu</b> olarak değiştirilmiştir ve tam finansal tablo seti içindedir.</li><li>TMS'de bilginin <b>önemi</b> vurgulanmıştır; önemli bilgilerin gerçeğe uygun sunulması istenir. Bu nedenle <b>standart format verilmemiş</b>, finansal tablolarda ve dipnotlarında bulunması gereken <b>asgari bilgiler</b> ve tabloların yapısı belirlenmiştir.</li><li>Hesap gruplarının hangi sıra ve biçimde düzenleneceği <b>işletmelere bırakılmıştır</b>.</li></ul>
<p><b>Asgari kalemler (TMS):</b> maddi duran varlıklar · yatırım amaçlı gayrimenkuller · maddi olmayan duran varlıklar · finansal varlıklar · özkaynak yöntemine göre izlenen yatırımlar · canlı varlıklar · stoklar · ticari ve diğer alacaklar · satış amaçlı elde tutulan duran varlıklar ve ilgili yükümlülükler (TFRS 5) · nakit ve nakit benzerleri · ticari ve diğer borçlar · karşılıklar · finansal borçlar · dönem vergisi ve ertelenmiş vergi varlık ve borçları (TMS 12) · kontrol gücü olmayan paylar (azınlık payları) · ana ortaklığa ait sermaye ve yedekler.</p>
<div class="trap"><b>Tuzak</b>"KVYK ile duran varlık finanse etmek net çalışma sermayesi fazlası yaratır" yanlış (noksan). "Yabancı kaynak ağırlıklı işletme alacaklılar için daha güvenlidir" yanlış. "Faiz giderleri özkaynak ağırlıklı işletmede yüksektir" yanlış. "TMS tek tip bilanço formatı zorunlu kılar" yanlış. "Geçmiş yıl kârları özkaynakta istenmez" yanlış (otofinansmandır).</div>`,
recall:[["KVYK ile duran varlık alınırsa ne olur?","Net çalışma sermayesi azalır; duran varlıklar devamlı sermayeyi (özkaynak + UVYK) aşarsa KVYK dönen varlıklardan büyük çıkar ve net çalışma sermayesi noksanı oluşur."],["Özkaynağın ideal büyüklük sırası?","Otofinansman > ödenmiş sermaye > sermaye yedekleri; zarar kalemleri hiç yok ya da en sonda."],["TMS'de bilanço formatı?","Standart format yok; asgari kalemler tanımlı, sıra ve biçim işletmeye bırakılmış."],["Borçla finansman neden tercih edilir?","Daha az özkaynakla yüksek kârlılık ve yüksek hisse başına kâr için."]]},

{id:7,t:"Gelir Tablosu",sub:"Kâr kademeleri, sayısal örnek, TMS kapsamlı gelir tablosu",min:35,html:`
<div class="core"><b>Çekirdek</b>Gelir tablosu, <b>belli bir dönemde</b> elde edilen tüm gelirlerle aynı dönemde katlanılan tüm giderleri ve sonuçta oluşan <b>dönem net kârını/zararını</b> gösterir. Kâr tek parça değil, adım adım kademelenir.</div>
<h3>Doğası</h3>
<ul><li><b>Dönemsellik kavramı:</b> normal dönem <b>1 yıl (1 Ocak-31 Aralık)</b>; ara faaliyet dönemleri 1, 3 veya 6 ay olabilir. <b>BIST şirketleri için ara faaliyet dönemi 3 aydır.</b></li><li>Her faaliyet dönemi kendi içinde değerlendirilir; geçmiş dönemlerle ve benzer işletmelerle karşılaştırılabilir.</li><li><b>Adları:</b> Gelir Tablosu = Finansal Performans Tablosu = Kâr veya Zarar Tablosu = TDMS Gelir Tablosu; <b>TMS'de Kapsamlı Gelir Tablosu</b>.</li><li>Düzenlenirken genel kabul görmüş muhasebe kavram ve ilkelerindeki esaslara göre hareket edilir.</li></ul>
<h3>Temel tanımlar</h3>
<div class="tw"><table><tr><th>Kavram</th><th>Tanım</th></tr>
<tr><td><b>Gelir</b></td><td>Muhasebe döneminde faaliyetler sonucu ortaya çıkan ve özkaynaklarda <b>artış</b> yaratan (hissedarların yarattığı fonlar <u>dışındaki</u>) değer girişleri</td></tr>
<tr><td><b>Gider</b></td><td>Özkaynaklarda <b>azalış</b> yaratan değer çıkışları ve varlık tükenişleri; <b>sermaye azaltımı ve temettü ödemeleri hariç</b></td></tr>
<tr><td><b>Kâr</b></td><td>Belli bir dönemde elde edilen gelirlerin, aynı dönemde bunları elde etmek için katlanılan giderleri <b>aşan kısmı</b></td></tr>
<tr><td><b>Zarar</b></td><td>Belli bir dönemde katlanılan giderlerin aynı dönemde elde edilen gelirleri <b>aşan kısmı</b></td></tr>
<tr><td><b>Özkaynak</b></td><td>Aktif toplamı − yabancı kaynaklar toplamı</td></tr></table></div>
<p><b>Çıkarım:</b> ortakların sermaye artırımı gelir değildir; temettü dağıtımı gider değildir. İkisi de dönem kârını etkilemez.</p>
<h3>Gelir tablosunda bulunması gerekenler (6)</h3>
<ol><li>Ait olduğu işletme ve kapsadığı dönem</li><li>Gelir kaynakları, satışlar ve işletmenin esas faaliyetinin maliyeti</li><li>Hesap dönemine ait faaliyet kârı veya zararı</li><li>Faaliyet dışı gelir ve giderler</li><li>Hesap dönemine ait kâr veya zarar</li><li>Ödenecek gelir vergisi (kurumlar için kurumlar vergisi)</li></ol>
<h3>Kâr kademeleri (THP özet gelir tablosu, Tablo 1.4)</h3>
<pre class="eq">A. Brüt Satışlar
B. Satış İndirimleri (−)            iadeler, iskontolar, diğer indirimler
C. NET SATIŞLAR                      = A − B
D. Satışların Maliyeti (−)
   BRÜT SATIŞ KÂRI / ZARARI          = C − D
E. Faaliyet Giderleri (−)            AR-GE · pazarlama-satış-dağıtım · genel yönetim
   FAALİYET KÂRI / ZARARI            = Brüt kâr − E
F. Diğer Faaliyetlerden Olağan Gelir ve Kârlar (+)
G. Diğer Faaliyetlerden Olağan Gider ve Zararlar (−)
H. Finansman Giderleri (−)
   OLAĞAN KÂR / ZARAR                = Faaliyet kârı + F − G − H
I. Olağan Dışı Gelir ve Kârlar (+)
J. Olağan Dışı Gider ve Zararlar (−)
   DÖNEM KÂRI / ZARARI               = Olağan kâr + I − J
K. Dönem Kârı Vergi ve Diğer Yasal Yükümlülük Karşılıkları (−)
   DÖNEM NET KÂRI / ZARARI           = Dönem kârı − K</pre>
<h3>Ayrıntılı gelir tablosu (Tablo 1.5)</h3>
<div class="tw"><table><tr><th>Kalem</th><th>İçeriği</th></tr>
<tr><td>Brüt satışlar</td><td>Yurt içi satışlar, yurt dışı satışlar, diğer gelirler</td></tr>
<tr><td>Satış indirimleri (−)</td><td>Satıştan iadeler, satış iskontoları, diğer indirimler</td></tr>
<tr><td>Satışların maliyeti (−)</td><td>Satılan mamuller, satılan ticari mallar, satılan hizmet, diğer satışların maliyeti</td></tr>
<tr><td>Faaliyet giderleri (−)</td><td>Araştırma ve geliştirme, pazarlama-satış-dağıtım, genel yönetim giderleri</td></tr>
<tr><td>Diğer faaliyet gelir ve kârları</td><td>İştiraklerden ve bağlı ortaklıklardan temettü gelirleri, faiz gelirleri, komisyon gelirleri, konusu kalmayan karşılıklar, menkul kıymet satış kârları, kambiyo kârları, reeskont faiz gelirleri, diğer</td></tr>
<tr><td>Diğer faaliyet gider ve zararları (−)</td><td>Komisyon giderleri, karşılık giderleri, menkul kıymet satış zararları, kambiyo zararları, reeskont faiz giderleri, diğer</td></tr>
<tr><td>Finansman giderleri (−)</td><td>Kısa vadeli ve uzun vadeli borçlanma giderleri</td></tr>
<tr><td>Olağan dışı gelir/gider</td><td>Önceki dönem gelir ve kârları/gider ve zararları, çalışmayan kısım gider ve zararları, diğer</td></tr></table></div>
<h3>Sayısal örnek: baştan sona</h3>
<div class="tw"><table><tr><th>Kalem</th><th class="n">TL</th></tr>
<tr><td>Brüt satışlar</td><td class="n">600.000</td></tr><tr><td>Satıştan iadeler (−)</td><td class="n">20.000</td></tr><tr><td>Satış iskontoları (−)</td><td class="n">10.000</td></tr>
<tr class="tot"><td>Net satışlar</td><td class="n">570.000</td></tr>
<tr><td>Satışların maliyeti (−)</td><td class="n">380.000</td></tr>
<tr class="tot"><td>Brüt satış kârı</td><td class="n">190.000</td></tr>
<tr><td>Faaliyet giderleri (−)</td><td class="n">90.000</td></tr>
<tr class="tot"><td>Faaliyet kârı</td><td class="n">100.000</td></tr>
<tr><td>Diğer faaliyetlerden olağan gelir ve kârlar (+)</td><td class="n">15.000</td></tr><tr><td>Diğer faaliyetlerden olağan gider ve zararlar (−)</td><td class="n">5.000</td></tr><tr><td>Finansman giderleri (−)</td><td class="n">20.000</td></tr>
<tr class="tot"><td>Olağan kâr</td><td class="n">90.000</td></tr>
<tr><td>Olağan dışı gelir (+) 12.000, olağan dışı gider (−) 7.000</td><td class="n">+5.000</td></tr>
<tr class="tot"><td>Dönem kârı</td><td class="n">95.000</td></tr>
<tr><td>Vergi ve yasal yükümlülük karşılıkları (−) %20 varsayımıyla</td><td class="n">19.000</td></tr>
<tr class="tot"><td>Dönem net kârı</td><td class="n">76.000</td></tr></table></div>
<h3>TMS: Kapsamlı Gelir Tablosu (3 bölüm)</h3><div class="tip"><b>Akademik not · sınavda hocanın anlatımını yaz</b>Hoca tabloyu <b>3 bölüm</b> sayar: sürdürülen faaliyetler, durdurulan faaliyetler, diğer kapsamlı gelirler (ilk ikisi dönem kârı/zararı bölümü). TMS 1'in kendi dili tabloyu iki bölüm olarak tarif eder: kâr veya zarar bölümü ve diğer kapsamlı gelir bölümü. İkisi aynı yapıyı farklı sayar.</div>
<ol><li><b>Sürdürülen faaliyetler</b></li><li><b>Durdurulan faaliyetler</b></li><li><b>Diğer kapsamlı gelirler</b></li></ol>
<p>İlk iki bölüm birlikte <b>dönem kârı/zararı</b> bölümü olarak ifade edilir. TMS biçimi: brüt esas faaliyet gelirleri (brüt hasılat) − indirimler = net esas faaliyet gelirleri (net hasılat); satışların maliyeti; brüt kâr; faaliyet giderleri; faaliyet kârı; diğer faaliyetlerden gelir/gider; finansman giderleri; özkaynak yöntemiyle değerlenen iştirak kâr/zarar payları; sürdürülen faaliyetler dönem kârı; vergi (vergi giderini oluşturan kalemler: yasal vergi karşılığı +, ertelenmiş vergi gider etkisi +, ertelenmiş vergi gelir etkisi −; toplam vergi kârdan düşülür); durdurulan faaliyetlerden kâr/zarar; dönem net kârı; ana ortaklık payı ve azınlık payı.</p>
<p><b>Diğer kapsamlı gelirler:</b> yeniden değerleme farklılıkları · yabancı para birimi dönüştürme farkları · satışa hazır menkul kıymet gerçekleşmemiş kazanç ve kayıpları (TFRS 9 sonrası adı: gerçeğe uygun değer farkı diğer kapsamlı gelire yansıtılan finansal varlıkların kazanç ve kayıpları) · türev ürünlerin gerçekleşmemiş kazanç ve kayıpları · yeniden sınıflama düzeltme farkı. <b>Kapsamlı kâr = Dönem net kârı ± diğer gelir ve giderler.</b></p>
<div class="trap"><b>Tuzak</b>Brüt kâr <u>net satıştan</u> hesaplanır (brüt satıştan değil). Faaliyet kârı <b>finansman gideri öncesidir</b>. Satış indirimleri faaliyet gideri değildir. BIST ara dönemi 3 ay, 6 değil. "Gelir tablosu belli bir tarihteki durumu gösterir" yanlış. Olağan dışı kalemler olağan kârın <u>altında</u>, dönem kârının <u>üstünde</u> eklenir.</div>`,
recall:[["Kâr kademelerini sırayla say.","Net satış, brüt kâr, faaliyet kârı, olağan kâr, dönem kârı, dönem net kârı."],["Gelir ve gider tanımında hangi iki kalem dışarıda?","Sermaye artırımı gelir değildir; sermaye azaltımı ve temettü ödemesi gider değildir."],["TMS gelir tablosunun 3 bölümü?","Sürdürülen faaliyetler, durdurulan faaliyetler, diğer kapsamlı gelirler."],["Brüt kâr ve olağan kâr formülü?","Brüt kâr = net satış − satışların maliyeti. Olağan kâr = faaliyet kârı + diğer gelir − diğer gider − finansman gideri."]]},

{id:8,t:"Eşitlik ve İşlemlerin Etkisi",sub:"Çelik Ticaret, A İşletmesi, 12 işlem etkisi, hesaplama sorularının çözümü",min:45,html:`
<div class="core"><b>Çekirdek</b>Her olay eşitliği <u>bozmadan</u> değiştirir. Bilançoyu bir film gibi izle: her işlemde iki taraf da değişir ve eşitlik yeniden kurulur. Eşitlik yöntemi, hesap ve yevmiye öğrenmenin sezgisel temelidir.</div>
<h3>İşlemin eşitliğe dört etkisi</h3>
<div class="tw"><table><tr><th>Tür</th><th>Etki</th><th>Örnek</th></tr>
<tr><td>Aktif ↔ aktif</td><td>Toplam <b>değişmez</b></td><td>Peşin demirbaş alımı, bankaya yatırma, alacak tahsili</td></tr>
<tr><td>Pasif ↔ pasif</td><td>Toplam değişmez</td><td>Borç senediyle satıcı borcunu kapatma</td></tr>
<tr><td>Aktif ↑ + pasif ↑</td><td>İki toplam <b>artar</b></td><td>Vadeli mal alımı, sermaye koyma, kredi çekme</td></tr>
<tr><td>Aktif ↓ + pasif ↓</td><td>İki toplam <b>azalır</b></td><td>Borç ödeme, kredi ödeme</td></tr></table></div>
<p>Maliyetinin üstünde satış, aktifi artırır ve pasifte <b>dönem kârını</b> artırır: iki toplam birlikte büyür. Maliyetinin altında satış ise zarardır.</p>
<h3>12 işlemin etkisi (hızlı tablo)</h3>
<div class="tw"><table><tr><th>İşlem</th><th>Değişen kalemler</th><th>Toplamlar</th></tr>
<tr><td>Nakit sermaye konulması</td><td>Kasa ↑, Sermaye ↑</td><td>Aktif ↑ Pasif ↑</td></tr>
<tr><td>Peşin ticari mal alımı</td><td>Ticari mal ↑, Kasa ↓</td><td>Değişmez</td></tr>
<tr><td>Vadeli ticari mal alımı</td><td>Ticari mal ↑, Satıcılar ↑</td><td>Aktif ↑ Pasif ↑</td></tr>
<tr><td>Peşin demirbaş alımı</td><td>Demirbaş ↑, Kasa ↓</td><td>Değişmez</td></tr>
<tr><td>Satıcılara nakit ödeme</td><td>Satıcılar ↓, Kasa ↓</td><td>Aktif ↓ Pasif ↓</td></tr>
<tr><td>Alıcılardan tahsilat</td><td>Kasa ↑, Alıcılar ↓</td><td>Değişmez</td></tr>
<tr><td>Bankaya para yatırma</td><td>Bankalar ↑, Kasa ↓</td><td>Değişmez</td></tr>
<tr><td>Banka kredisi çekme</td><td>Bankalar ↑, Banka kredisi ↑</td><td>Aktif ↑ Pasif ↑</td></tr>
<tr><td>Kredi geri ödeme</td><td>Banka kredisi ↓, Bankalar ↓</td><td>Aktif ↓ Pasif ↓</td></tr>
<tr><td>Satıcı borcunu senede bağlama</td><td>Satıcılar ↓, Borç senetleri ↑</td><td>Pasif ↔ pasif</td></tr>
<tr><td>Kârla (maliyetin üstünde) vadeli satış</td><td>Alıcılar ↑ (satış bedeli), Ticari mal ↓ (maliyet), Kâr ↑</td><td>Aktif ↑ Pasif ↑ (kâr kadar)</td></tr>
<tr><td>Gider ödeme</td><td>Kasa ↓, Dönem sonucu ↓ (gider)</td><td>Aktif ↓ Pasif ↓</td></tr></table></div>
<h3>Hocanın örneği 1: Çelik Ticaret</h3>
<div class="tw"><table><tr><th>Olay</th><th class="n">Kasa</th><th class="n">Tic. Mal</th><th class="n">Alıcılar</th><th class="n">Demirbaş</th><th class="n">Satıcılar</th><th class="n">Sermaye</th><th class="n">Kâr</th></tr>
<tr><td>1 · Sermaye 100.000</td><td class="n">100.000</td><td class="n"></td><td class="n"></td><td class="n"></td><td class="n"></td><td class="n">100.000</td><td class="n"></td></tr>
<tr><td>2 · Peşin demirbaş 20.000</td><td class="n">80.000</td><td class="n"></td><td class="n"></td><td class="n">20.000</td><td class="n"></td><td class="n">100.000</td><td class="n"></td></tr>
<tr><td>3 · 50.000'lik mal, yarısı peşin</td><td class="n">55.000</td><td class="n">50.000</td><td class="n"></td><td class="n">20.000</td><td class="n">25.000</td><td class="n">100.000</td><td class="n"></td></tr>
<tr><td>4 · Satıcıya 15.000 ödeme</td><td class="n">40.000</td><td class="n">50.000</td><td class="n"></td><td class="n">20.000</td><td class="n">10.000</td><td class="n">100.000</td><td class="n"></td></tr>
<tr><td>5 · Maliyeti 30.000 mal 38.000'e satıldı (20.000 peşin)</td><td class="n">60.000</td><td class="n">20.000</td><td class="n">18.000</td><td class="n">20.000</td><td class="n">10.000</td><td class="n">100.000</td><td class="n"><b>8.000</b></td></tr>
<tr class="tot"><td>Kontrol</td><td class="n" colspan="4">Aktif = 118.000</td><td class="n" colspan="3">Pasif = 118.000</td></tr></table></div>
<div class="tip"><b>Sınavlık not</b>Satışta iki şey olur: mal <b>maliyetiyle</b> stoktan çıkar (30.000), bedel <b>satış fiyatıyla</b> gelir (38.000). Aradaki <b>8.000 kârdır</b>.</div>
<h3>Hocanın örneği 2: A İşletmesi</h3>
<div class="tw"><table><tr><th>#</th><th>Olay</th><th>Eşitlik: Kasa + Alıcılar + Tic. Mal + Demirbaş = Satıcılar + Sermaye + Kâr</th></tr>
<tr><td>1</td><td>50.000 nakit sermaye</td><td class="mono">50.000 = 50.000</td></tr>
<tr><td>2</td><td>6.000 peşin demirbaş</td><td class="mono">44.000 + 6.000 = 50.000</td></tr>
<tr><td>3</td><td>25.000 vadeli mal</td><td class="mono">44.000 + 25.000 + 6.000 = 25.000 + 50.000</td></tr>
<tr><td>4</td><td>20.000'lik mal 28.000'e vadeli satıldı</td><td class="mono">44.000 + 28.000 + 5.000 + 6.000 = 25.000 + 50.000 + 8.000</td></tr>
<tr><td>5</td><td>Alıcılardan 10.000 tahsil</td><td class="mono">54.000 + 18.000 + 5.000 + 6.000 = 25.000 + 50.000 + 8.000</td></tr>
<tr><td>6</td><td>Satıcılara 14.000 ödeme</td><td class="mono">40.000 + 18.000 + 5.000 + 6.000 = 11.000 + 50.000 + 8.000 → 69.000 = 69.000</td></tr></table></div>
<h3>Hocanın dört hesaplama sorusu</h3>
<ol>
<li><b>Dönen 35.000; YK 40.000; dönem kârı 5.000; pasif toplamı 80.000. Duran? Özkaynak?</b><br>Aktif = Pasif = 80.000 → <b>Duran = 80.000 − 35.000 = 45.000</b>; <b>Özkaynak = 80.000 − 40.000 = 40.000</b> (içinde 5.000 kâr; sermaye 35.000).</li>
<li><b>Sermaye 65.000; borç 33.000; dönen 50.000; duran 50.000. Kâr/zarar?</b><br>Aktif 100.000; pasif 33.000 + 65.000 + K → <b>K = 2.000 kâr</b>.</li>
<li><b>YK 85.000; sermaye 115.000; aktif 200.000; dönen 125.000.</b><br><b>Duran = 75.000</b>; 85.000 + 115.000 = 200.000 → <b>kâr da zarar da yok</b>.</li>
<li><b>Dönen 68.000; duran 82.000; KVYK 45.000; UVYK 17.000; sermaye 95.000.</b><br>Aktif 150.000; YK 62.000 → <b>Özkaynak 88.000</b>; 88.000 − 95.000 = <b>7.000 zarar</b>.</li></ol>
<p><b>5. soru: bilanço düzenle.</b> Sermaye 100.000, satıcılar 30.000, kasa 30.000, alıcılar 20.000, alacak senetleri 30.000, bankalar 50.000, banka kredileri (UV) 20.000, borç senetleri 30.000, ticari mallar 60.000.</p>
<div class="tw"><table><tr><th>AKTİF</th><th class="n"></th><th>PASİF</th><th class="n"></th></tr>
<tr><td><b>I. Dönen Varlıklar</b></td><td class="n"><b>190.000</b></td><td><b>III. KVYK</b></td><td class="n"><b>60.000</b></td></tr>
<tr><td>Kasa 30.000 · Bankalar 50.000 · Alıcılar 20.000 · Alacak Senetleri 30.000 · Ticari Mallar 60.000</td><td></td><td>Satıcılar 30.000 · Borç Senetleri 30.000</td><td></td></tr>
<tr><td><b>II. Duran Varlıklar</b></td><td class="n">0</td><td><b>IV. UVYK</b> (Banka Kredileri)</td><td class="n"><b>20.000</b></td></tr>
<tr><td></td><td></td><td><b>V. Özkaynaklar</b> (Sermaye 100.000 + <b>Dönem Net Kârı 10.000</b>)</td><td class="n"><b>110.000</b></td></tr>
<tr class="tot"><td>AKTİF TOPLAMI</td><td class="n">190.000</td><td>PASİF TOPLAMI</td><td class="n">190.000</td></tr></table></div>
<h3>Ek çözümlü örnekler</h3>
<div class="ex"><b>Örnek A</b>Aktif 150.000, KVYK 40.000, UVYK 30.000. Özkaynak = 150.000 − 70.000 = <b>80.000</b>. Sermaye 70.000 ise dönem sonucu = 80.000 − 70.000 = <b>10.000 kâr</b>.</div>
<div class="ex"><b>Örnek B</b>Sermaye 60.000, borç 30.000, dönem zararı 5.000. Kaynaklar = 30.000 + 60.000 − 5.000 = <b>85.000 = aktif toplamı</b>.</div>
<div class="ex"><b>Örnek C</b>Maliyeti 40.000 olan mal 55.000'e peşin satılırsa: Kasa +55.000, Ticari mal −40.000 → aktif <b>+15.000</b>; pasifte kâr +15.000.</div>
<div class="trap"><b>Tuzak</b>Satışta maliyeti unutmak (bilanço eşitliği bozulur). Dönem zararını sermayeye eklemek (zarar eksiltir). "Özkaynak = sermaye" varsaymak. Satıcıya borç ödemesinin yalnız bir tarafı etkilediğini sanmak.</div>`,
recall:[["Vadeli mal alımı eşitliği nasıl etkiler?","Mal (aktif) artar, satıcılar (pasif) artar: iki toplam birlikte artar."],["Çelik Ticaret'te 8.000 kâr nasıl doğdu?","38.000 satış − 30.000 maliyet. Stok 30.000 azalır, kasa+alıcı 38.000 artar."],["Özkaynak ile sermaye ne zaman farklıdır?","Dönem kârı/zararı ve yedekler olduğunda: Özkaynak = Sermaye ± dönem sonucu."],["Aktif 150, YK 70, sermaye 70 ise sonuç?","Özkaynak 80, sonuç 80 − 70 = 10 kâr."]]},

{id:9,t:"Hesaplar ve Çift Taraflı Kayıt",sub:"Borç = sol, alacak = sağ; kuralları türetmek, bakiye",min:35,html:`
<div class="core"><b>Çekirdek</b>Eşitliği korumak için her olay <b>en az iki kalemi</b> etkiler: çift taraflı kayıt. <b>Borç = sol, alacak = sağ</b>: günlük dildeki "borçlandım" ile ilgisi yoktur. Kuralı ezberleme, eşitlikten türet.</div>
<h3>Hesap nedir?</h3>
<p>Finansal olaylar <b>hesap</b> denilen çizelgeler üzerinde çift taraflı kayıt esasıyla izlenir. <b>Hesap</b>, aynı tür bilgileri aynı başlık altında toplayan, yani <b>sınıflandıran</b> çizelgedir. Hesaplar, temel muhasebe eşitliğini oluşturan varlık ve kaynakların ayrıntısını izler. Hesapların yer aldığı defter <b>Defter-i Kebir (Büyük Defter)</b>. <b>Yardımcı hesaplar</b>, bir ana hesabın <b>detayını</b> yardımcı defterlerde izler (örnek: Alıcılar ana hesabı; müşteri müşteri yardımcı hesap).</p>
<p><b>Çift taraflı kayıt:</b> işletmedeki değer akımları daima karşılıklıdır. Varlıklarda bir değişim olduğunda ya kaynaklarda aynı yönde ve tutarda bir değişim olur ya da bir başka varlıkta ters yönlü değişim gerçekleşir. Bu yüzden finansal olayların kaydı en az iki değere yapılır.</p>
<pre class="eq">          ........ H E S A B I
   BORÇ (sol)       |       ALACAK (sağ)
  ------------------+--------------------
   borç tutarlar    |    alacak tutarlar</pre>
<h3>Kuralları türet</h3>
<p>Bilanço: <b>Aktif (sol) = Pasif (sağ)</b>.</p>
<ol><li>Aktif bilançoda <b>solda</b> → artışı <b>sola = BORÇ</b>, azalışı sağa = alacak.</li><li>Pasif bilançoda <b>sağda</b> → artışı <b>sağa = ALACAK</b>, azalışı sola = borç.</li><li>Gelir özkaynağı <b>artırır</b>; özkaynak pasiftir; pasif artışı alacak → <b>gelir artışı ALACAK</b>.</li><li>Gider özkaynağı <b>azaltır</b>; pasif azalışı borç → <b>gider artışı BORÇ</b>.</li></ol>
<div class="tw"><table><tr><th>Hesap grubu</th><th>Artış</th><th>Azalış</th><th>Normal bakiye</th></tr>
<tr><td><b>Aktif (varlık)</b></td><td><b>Borç</b></td><td>Alacak</td><td>Borç</td></tr>
<tr><td><b>Pasif (kaynak)</b></td><td><b>Alacak</b></td><td>Borç</td><td>Alacak</td></tr>
<tr><td><b>Gider</b></td><td><b>Borç</b></td><td>Alacak</td><td>Borç</td></tr>
<tr><td><b>Gelir</b></td><td><b>Alacak</b></td><td>Borç</td><td>Alacak</td></tr></table></div>
<p>Hocanın "hesapların genel çalışma şekilleri" görseli birebir bu tablodur: aktif <b>+ sol / − sağ</b>; pasif <b>− sol / + sağ</b>; gider <b>+ sol / − sağ</b>; gelir <b>− sol / + sağ</b>.</p>
<h3>Bakiye</h3>
<ul><li>Borç toplamı = alacak toplamı → <b>kapalı hesap</b></li><li>Borç toplamı &gt; alacak toplamı → <b>borç bakiyesi</b></li><li>Borç toplamı &lt; alacak toplamı → <b>alacak bakiyesi</b></li></ul>
<p>Bakiye = büyük toplam − küçük toplam; büyük olan tarafa yazılır. <b>Kasa gibi aktif bir hesap alacak bakiyesi veremez</b> (olmayan parayı ödeyemezsin). Pasif hesap borç bakiyesi verirse bir hata ya da tersine bir durum vardır. Aktif hesaplar borç bakiyesi verir <i>ya da kapanır</i> (bakiye vermez). Büyük defterde hesap kapatılırken bakiye iki tarafı eşitlemek için küçük tarafa yazılır; mizanda ise büyük tarafın kalan sütununda gösterilir.</p>
<div class="ex"><b>Kasa hesabı örneği</b>Borç: 60.000 (sermaye) + 4.000 (satış) + 10.000 (tahsilat) = 74.000. Alacak: 8.000 + 30.000 + 12.000 + 3.000 = 53.000. Bakiye = 74.000 − 53.000 = <b>21.000 borç bakiyesi</b> (AZ İşletmesi).</div>
<h3>Her olayda üç soru</h3>
<ol><li>Hangi hesaplar etkilendi?</li><li>Her biri aktif mi, pasif mi, gelir mi, gider mi?</li><li>Artış mı azalış mı? Yukarıdaki tabloya göre borç mu alacak mı?</li></ol>
<p>Sonra <b>toplam borç = toplam alacak</b> kontrolü yap.</p>
<div class="ex"><b>Üç sorunun uygulaması</b>"6.000 TL genel yönetim gideri nakit ödendi." (1) Genel Yönetim Giderleri ve Kasa. (2) Gider ve aktif. (3) Gider artıyor → borç; kasa azalıyor → alacak. Kayıt: Genel Yönetim Giderleri 6.000 B / Kasa 6.000 A.</div>
<div class="tip"><b>Düzenleyici (−) hesaplar (slayt dışı)</b>Kural tersine çalışır: Birikmiş Amortismanlar (−) aktifte durur ama pasif gibi çalışır; Dönem Net Zararı (−) pasifte durur ama aktif gibi çalışır. Sınavda "(−)" görürsen işareti tersle.</div>
<div class="trap"><b>Tuzak</b>"Pasifte azalış alacaktır" yanlış (azalış borçtur). "Kasa alacak bakiyesi verir" yanlış. "Borç = borçlanmak" yanlış, borç sol taraftır. Gider ve gelir hesaplarının bakiyelerini yön olarak karıştırmak.</div>`,
recall:[["Gider artışı neden borç?","Gider özkaynağı azaltır; özkaynak pasiftir; pasifte azalış borçtur."],["Satıcılar: 40.000 alacak bakiyesi + 15.000 vadeli alım − 25.000 ödeme = ?","40 + 15 − 25 = 30.000 alacak bakiyesi."],["Hangi hesap grupları alacak bakiyesi verir?","Pasif hesaplar ve gelir hesapları."],["Üç soruyu say.","Hangi hesaplar? Hangi türden? Artış mı azalış mı, bu yüzden borç mu alacak mı?"]]},

{id:10,t:"Yevmiye, Büyük Defter, Fişler",sub:"Yazım düzeni, madde türleri, belgeler, tahsil-tediye-mahsup",min:35,html:`
<div class="core"><b>Çekirdek</b>Olay önce <b>yevmiye defterine</b> (tarih sırasıyla) kaydedilir, sonra büyük defterde hesaplara <b>aktarılır</b>. Finansal olayları doğrudan hesaplar üzerinde izlemek kontrolü zorlaştırır ve olayların tarih sırasıyla izlenme olanağını ortadan kaldırır.</div>
<h3>Yevmiye maddesi</h3>
<pre class="eq">Mad. No | AÇIKLAMA                            |  BORÇ  | ALACAK
1       | Borçlu hesap  (satır başından)       | tutar  |
        |      Alacaklı hesap (içeriden)       |        | tutar
        | .....Tarih.....  Açıklama .....      |        |</pre>
<p><b>Borçlu hesap veya hesaplar önce ve satır başından başlanarak, alacaklı hesaplar daha sonra ve biraz içeriden başlanarak yazılır.</b> Tutarlar aynı düzen içinde karşılarında yer alır (borç sütununa borç, alacak sütununa alacak). Yevmiye maddesi = finansal olayların tarih sırasıyla yevmiye defterine usulüne uygun kaydedilme biçimi.</p>
<h3>Madde türleri</h3>
<div class="tw"><table><tr><th>Tür</th><th>Tanım</th><th>Örnek</th></tr>
<tr><td><b>Basit</b></td><td>Borçta ve alacakta <b>birer</b> hesap</td><td>Kasa / Sermaye</td></tr>
<tr><td><b>Bileşik</b></td><td><b>Bir hesabın karşısında birden fazla</b> hesap</td><td>Ticari Mallar / Kasa + Satıcılar<br>Kasa + Alıcılar / Yurt İçi Satışlar</td></tr>
<tr><td><b>Karma</b></td><td><b>Hem borçta hem alacakta</b> birden fazla hesap</td><td>Kasa + Bankalar / Alıcılar + Alacak Senetleri</td></tr></table></div>
<h3>Büyük defter (Defter-i Kebir)</h3>
<p>Her hesap sayfasında solda <b>Borç</b>, sağda <b>Alacak</b> bölümü; her biri <i>Yevmiye (tarih, no) – Açıklama – Tutar</i> sütunlarını taşır; sayfa dolunca <i>Nakli Yekûn / Toplam</i> yazılır. Yevmiyedeki maddeler hesaplara aktarılırken borçlu hesabın borç tarafına, alacaklı hesabın alacak tarafına yazılır.</p>
<h3>Belgeler (fiş değildir)</h3>
<ul><li><b>Fatura</b></li><li><b>Perakende Satış Vesikaları</b></li><li><b>Gider Pusulası</b></li><li><b>Müstahsil Makbuzu</b></li><li><b>Serbest Meslek Makbuzu</b></li><li><b>Ücret Bordrosu</b></li><li>Diğer evrak ve vesikalar</li></ul>
<h3>Muhasebe fişleri: kasaya bak</h3>
<div class="tw"><table><tr><th>Fiş</th><th>Ne zaman?</th><th>Kural</th></tr>
<tr><td><b>Kasa tahsil fişi</b></td><td>İşletmenin kasasına giren paraların hangi işlemlerden kaynaklandığını gösterir</td><td>Kasa <b>borçlu</b></td></tr>
<tr><td><b>Kasa tediye (ödeme) fişi</b></td><td>İşletmenin kasasından çıkan paraların hangi işlemlerden kaynaklandığını gösterir; kasa hesabı <b>alacaklı</b> olduğu durumda kullanılır</td><td>Kasa <b>alacaklı</b></td></tr>
<tr><td><b>Mahsup fişi</b></td><td>Kasa para giriş çıkışını ilgilendirmeyen, nakit olmayan mali nitelikli olaylar için; <b>kasa hesabı kullanılmaz</b></td><td>Kasa <b>yok</b></td></tr></table></div>
<div class="tw"><table><tr><th>İşlem</th><th>Fiş</th><th>Neden?</th></tr>
<tr><td>Ortak nakit sermaye koyar</td><td>Tahsil</td><td>Kasa borçlu</td></tr>
<tr><td>Alıcıdan nakit tahsilat</td><td>Tahsil</td><td>Kasa borçlu</td></tr>
<tr><td>Satıcıya nakit ödeme</td><td>Tediye</td><td>Kasa alacaklı</td></tr>
<tr><td>Peşin demirbaş alımı</td><td>Tediye</td><td>Kasa alacaklı</td></tr>
<tr><td>Bankaya nakit yatırma</td><td>Tediye</td><td>Bankalar B / Kasa A</td></tr>
<tr><td>Bankadan nakit çekme</td><td>Tahsil</td><td>Kasa B / Bankalar A</td></tr>
<tr><td>Vadeli mal alımı veya satışı</td><td>Mahsup</td><td>Kasa yok</td></tr>
<tr><td>Banka havalesiyle tahsilat veya ödeme</td><td>Mahsup</td><td>Kasa yok</td></tr>
<tr><td>Kısmen peşin, kısmen vadeli işlem</td><td>Peşin kısım için kasa tahsil/tediye; vadeli kısım için mahsup</td><td>Parçalı işlem</td></tr></table></div>
<div class="tip"><b>Akademik not · sınavda hocanın anlatımını yaz</b>Hoca "mahsup fişlerinde kasa hesabı kullanılmaz" der; bu yüzden karma işlem iki fişe bölünür. Uygulamada karma işlem tek bileşik madde olarak da kaydedilebilir; o zaman tek mahsup fişi kesilir ve kasa da o fişte yer alır.</div>
<div class="trap"><b>Tuzak</b>Fiş ≠ belge (fatura belgedir, kasa tediye fişi fiştir). "Bankaya para yatırma → tahsil" yanlış (kasa çıkıyor, tediye). "Karma madde: bir hesabın karşısında çok hesap" yanlış (o bileşiktir). Yevmiye tarih sırasıdır; büyük defter hesap sırasıdır.</div>`,
recall:[["Üç madde türünü örnekle.","Basit: Kasa/Sermaye. Bileşik: Tic. Mallar/Kasa+Satıcılar. Karma: Kasa+Bankalar/Alıcılar+Alacak Senetleri."],["Mahsup fişinde kasa neden yok?","Mahsup, kasa para girişi-çıkışı olmayan nakit dışı olaylar içindir."],["Yevmiyede borç-alacak yazım düzeni?","Borç önce, satır başından; alacak sonra, içeriden."],["Belgeleri say.","Fatura, perakende satış vesikası, gider pusulası, müstahsil makbuzu, serbest meslek makbuzu, ücret bordrosu."]]},

{id:11,t:"Mizan ve Dönemsel Süreç",sub:"İki kontrol, üç mizan, mizan hazırlama, 10 adım",min:35,html:`
<div class="core"><b>Çekirdek</b>Mizan, muhasebe kayıtlarının doğru işlenip işlenmediğini kontrol etmek ve mali bilgileri değerlendirmek amacıyla belirli aralıklarla düzenlenen; <b>bütün hesapların borç-alacak tutarlarını ve bakiyelerini</b> bünyesinde toplayan çizelgedir. Mizan bir mali tablo değil, kontrol aracıdır; temel mali tablolar bilanço ve gelir tablosudur.</div>
<h3>Şablon ve iki kontrol</h3>
<p>Sütunlar: Sıra No – Hesap İsmi – <b>TUTAR (Borç | Alacak)</b> – <b>KALAN (Borç | Alacak)</b>. Son satır TOPLAM.</p>
<ol><li><b>Tutar sütunları</b>: borç toplamı = alacak toplamı (çift taraflı kayıt kontrolü).</li><li><b>Kalan sütunları</b>: borç toplamı = alacak toplamı.</li></ol>
<h3>Mizan çeşitleri</h3>
<div class="tw"><table><tr><th>Mizan</th><th>Ne zaman?</th></tr>
<tr><td><b>Aylık (geçici) mizan</b></td><td><b>Her ay sonu</b></td></tr>
<tr><td><b>Genel geçici mizan</b></td><td><b>Aralık ayında</b></td></tr>
<tr><td><b>Kesin mizan</b></td><td>Dönem sonunda, <b>envanter işlemlerinden ve gelir-gider hesapları kapatıldıktan sonra</b></td></tr></table></div>
<div class="tip"><b>Akademik not · sınavda hocanın anlatımını yaz</b>Hoca genel geçici mizanı "Aralık ayında düzenlenen" diye tanımlar. Kesin mizan da 31 Aralık tarihli olduğu için ayırt edici ölçü şudur: genel geçici mizan <b>envanterden önce</b>, kesin mizan <b>envanter ve kapatmadan sonra</b>.</div>
<h3>Mizan nasıl hazırlanır? (AZ İşletmesi)</h3>
<div class="tw ledger"><table><tr><th>Hesap</th><th class="n">Borç tutar</th><th class="n">Alacak tutar</th><th class="n">Kalan borç</th><th class="n">Kalan alacak</th></tr>
<tr><td>Kasa</td><td class="n">74.000</td><td class="n">53.000</td><td class="n">21.000</td><td class="n"></td></tr>
<tr><td>Bankalar</td><td class="n">12.000</td><td class="n">5.000</td><td class="n">7.000</td><td class="n"></td></tr>
<tr><td>Alıcılar</td><td class="n">31.000</td><td class="n">10.000</td><td class="n">21.000</td><td class="n"></td></tr>
<tr><td>Ticari Mallar</td><td class="n">45.000</td><td class="n">26.000</td><td class="n">19.000</td><td class="n"></td></tr>
<tr><td>Demirbaşlar</td><td class="n">8.000</td><td class="n"></td><td class="n">8.000</td><td class="n"></td></tr>
<tr><td>Satıcılar</td><td class="n">5.000</td><td class="n">15.000</td><td class="n"></td><td class="n">10.000</td></tr>
<tr><td>Sermaye</td><td class="n"></td><td class="n">60.000</td><td class="n"></td><td class="n">60.000</td></tr>
<tr><td>Yurt İçi Satışlar</td><td class="n"></td><td class="n">35.000</td><td class="n"></td><td class="n">35.000</td></tr>
<tr><td>Satılan Ticari Mallar Maliyeti</td><td class="n">26.000</td><td class="n"></td><td class="n">26.000</td><td class="n"></td></tr>
<tr><td>Genel Yönetim Giderleri</td><td class="n">3.000</td><td class="n"></td><td class="n">3.000</td><td class="n"></td></tr>
<tr class="tot"><td>TOPLAM</td><td class="n">204.000</td><td class="n">204.000</td><td class="n">105.000</td><td class="n">105.000</td></tr></table></div>
<div class="tip"><b>Mizan ≠ bilanço</b>Mizan gelir ve gider hesaplarını da ayrı ayrı içerir; bilanço yalnız varlık ve kaynak hesaplarını. AZ'da mizan kalan toplamı 105.000, bilanço toplamı 76.000'dir. Fark: gider hesapları (26.000 + 3.000 = 29.000) bilançoya girmez; bilançoda gelir-gider farkı olan net kâr (6.000) pasifte yer alır. Kontrol: 76.000 + 29.000 = 105.000.</div>
<h3>Mizanın yakalayamadığı hatalar (ek bilgi)</h3>
<ul><li>Yanlış hesaba yazılan doğru tutar (denge bozulmaz)</li><li>Kaydın hiç yapılmaması</li><li>Aynı kaydın iki kez yapılması</li><li>Borç ve alacak tarafında aynı tutarlı hata</li></ul>
<p>Dolayısıyla "mizan denk çıkarsa kayıtlar kesinlikle doğrudur" yanlıştır; yalnızca <b>aritmetik denge</b> sağlanmıştır.</p>
<h3>Muhasebede dönemsel süreç (10 adım)</h3>
<ol><li><b>Açılış kaydı</b></li><li><b>Dönem içi işlemler</b></li><li><b>(Genel) geçici mizan</b></li><li><b>Dönem sonu (envanter) işlemleri</b></li><li><b>Maliyet, gelir ve gider hesaplarının kapatılması</b></li><li><b>Kârın netleştirilmesi</b></li><li><b>Kesin mizanın düzenlenmesi</b></li><li><b>Bilanço ve gelir tablosunun düzenlenmesi</b></li><li><b>Kapanış kaydı</b></li><li><b>Bilançonun envanter defterine yazılması</b></li></ol>
<div class="tip"><b>Akademik not · sınavda hocanın anlatımını yaz</b>Hocanın sırası: kesin mizan → bilanço ve gelir tablosu → kapanış → envanter defteri. Akademik olarak gelir tablosu, gelir-gider hesapları kapatılmadan önceki (690'a devir aşamasındaki) bilgilerden hazırlanır; kesin mizanda bu hesaplar artık sıfırdır. Bazı kitaplar son adımı "kapanış kaydı" olarak verir.</div>
<p><b>Ezber cümlesi:</b> <i>Açıl, işle, geçici bak, envanterle, kapat, netleştir, kesin bak, tablola, kapan, envantere yaz.</i></p>
<div class="trap"><b>Tuzak</b>"Aylık geçici mizan dönem sonunda, envanterden sonra düzenlenir" yanlış (o kesin mizandır). Mizan tutar toplamı ile kalan toplamını karıştırma: AZ'da tutar 204.000, kalan 105.000; KALE'de tutar 235.000, kalan 122.000. Mizan kalan toplamını bilanço toplamıyla karıştırma.</div>`,
recall:[["Mizanın iki kontrolü?","Tutar sütunları borç = alacak; kalan sütunları borç = alacak."],["Geçici mizan ile kesin mizan farkı?","Geçici: ay/Aralık sonunda, gelir-gider hesapları açık. Kesin: envanter ve kapatmadan sonra."],["Kapanış kaydı hangi adımlardan sonra?","Kesin mizan, bilanço ve gelir tablosu düzenlendikten sonra."],["Mizan kalan toplamı neden bilanço toplamından büyük?","Gider (ve gelir) hesapları mizanda ayrı ayrı durur; bilançoya yalnız net kâr geçer."]]},

{id:12,t:"Kayıt Kalıpları Kütüphanesi",sub:"Sınavda çıkan standart yevmiye maddeleri",min:35,html:`

<div class="trap"><b>Tuzak</b>300 ile 400 aynı addadır (Banka Kredileri) ama vade farkıyla gruplar ayrılır. 120 Alıcılar dönen, 220 Alıcılar duran. 600 satış, 621 maliyet, 632 gider. 190 Devreden KDV ile 191 İndirilecek KDV karışır: ay içi alış KDV'si 191'dir. Parantez içindeki (−) işareti hesabın düzenleyici (ters çalışan) olduğunu gösterir.</div>`,

{id:14,t:"Ek Konular: KDV, İade, Amortisman, Kapanış",sub:"Slayt dışı; sınavda çıkabilecek komşu konular",min:30,html:`
<div class="trap"><b>Dikkat</b>Bu parça hocanın slaytlarında yok. Slayttan kapsam dışı olduğunu doğruladıysan atla. Vize sorularında KDV'li kayıt, iade veya amortisman çıkarsa hazırlıklı olman için ekledim; oranlar ve yöntemler soruda verilir.</div>
<h3>KDV'li alış ve satış</h3>
<p>KDV, işletmenin kendi gideri değildir; vergi dairesi adına toplanır ve öder. <b>Alışta ödenen KDV</b> (indirilecek) dönen varlık gibi izlenir: <b>191 İndirilecek KDV</b> (borç). <b>Satışta alınan KDV</b> (hesaplanan) bir borçtur: <b>391 Hesaplanan KDV</b> (alacak, KVYK).</p>
<div class="ex"><b>Alış</b>10.000 TL + %20 KDV vadeli mal alımı: Ticari Mallar 10.000 + İndirilecek KDV 2.000 / Satıcılar 12.000.</div>
<div class="ex"><b>Satış</b>10.000 TL + %20 KDV vadeli satış: Alıcılar 12.000 / Yurt İçi Satışlar 10.000 + Hesaplanan KDV 2.000. Maliyet kaydı: STMM / Ticari Mallar ayrıca yapılır.</div>
<div class="ex"><b>Mahsup</b>Her ay sonunda (KDV aylık beyan edilir) hesaplanan KDV 2.000, indirilecek KDV 2.000 ise: Hesaplanan KDV 2.000 / İndirilecek KDV 2.000. Fark varsa: indirilecek fazlaysa Devreden KDV (190), hesaplanan fazlaysa Ödenecek Vergi ve Fonlar (360).</div>
<h3>İadeler</h3>
<div class="tw"><table><tr><th>Olay</th><th>Borç</th><th>Alacak</th></tr>
<tr><td>Alış iadesi (satıcıya mal geri verilir, vadeli alışta)</td><td>Satıcılar</td><td>Ticari Mallar</td></tr>
<tr><td>Satış iadesi (müşteri mal geri verir, tutar)</td><td>Satıştan İadeler (610)</td><td>Alıcılar</td></tr>
<tr><td>Satış iadesinde malın stoğa dönmesi (maliyet)</td><td>Ticari Mallar</td><td>Satılan Ticari Mallar Maliyeti</td></tr></table></div>
<p>Yukarıdaki iade kayıtları KDV'siz gösterimdir. KDV'li iadede KDV de düzeltilir: alış iadesinde <b>İndirilecek KDV (191) alacaklandırılır</b>, satış iadesinde <b>Hesaplanan KDV (391) borçlandırılır</b>.</p>
<div class="trap"><b>Dikkat: iki yaklaşım var</b>Birçok ders kitabı yukarıdaki kaydı öğretir. Vergi uygulamasında (GİB) ise iade faturasını kim düzenlerse KDV'yi o hesaplar: satış iadesinde <b>191 İndirilecek KDV borçlanır</b>, alış iadesinde <b>391 Hesaplanan KDV alacaklanır</b>. Hocanın derste hangisini kullandığına dikkat et; sınavda onunkini yaz.</div>
<h3>Amortisman (duran varlığın yıpranma gideri)</h3>
<p>Amortisman, duran varlığın yararının dönemlere dağıtılmasıdır; gider yazılır, <b>birikmiş amortismanlar (257)</b> ise aktifte düzenleyici (eksi) hesap olarak izlenir.</p>
<div class="ex"><b>Örnek</b>10.000 TL'lik demirbaşın faydalı ömrü 5 yıl (yıllık %20, normal amortisman). Yıllık gider 2.000: Genel Yönetim Giderleri 2.000 / Birikmiş Amortismanlar 2.000. Bilançoda: Demirbaşlar 10.000 − Birikmiş Amortismanlar 2.000 = <b>net 8.000</b> (maddi duran varlıklar altında).</div>
<h3>Dönem sonu: kapatma ve netleştirme</h3>
<p>Slaytta süreç adı olarak geçen adımların kayıt biçimi (ek bilgi): gelir hesapları borçlandırılıp, gider hesapları alacaklandırılarak <b>690 Dönem Kârı veya Zararı</b> hesabında toplanır; sonuç kâr ise bu hesap borçlanıp (THP'nin tam akışında 690 → 691 vergi karşılığı → 692 Dönem Net Kârı veya Zararı üzerinden; burada vergi yok sayıldığı için kısaltılmıştır) <b>590 Dönem Net Kârı</b> alacaklandırılır (zararsa 591 Dönem Net Zararı borçlanır). Tekdüzen Hesap Planı'nda vergi karşılığı varsa sonuç önce 692 Dönem Net Kârı veya Zararı hesabına aktarılır, oradan 590'a geçer; aşağıdaki örnek vergisiz sadeleştirilmiştir.</p>
<div class="ex"><b>KALE örneği</b>Satışlar 40.000: Yurt İçi Satışlar 40.000 / 690 Dönem Kârı veya Zararı 40.000. Giderler: 690 Dönem Kârı veya Zararı 36.000 / STMM 30.000 + Genel Yönetim Giderleri 6.000. Sonuç: 690 hesapta alacak 40.000, borç 36.000 → <b>4.000 kâr</b>: 690 Dönem Kârı veya Zararı 4.000 / 590 Dönem Net Kârı 4.000.</div>
<div class="trap"><b>Tuzak</b>İndirilecek KDV (191) ile hesaplanan KDV'yi (391) tersine yazmak. Satış iadesini doğrudan satışlardan düşmek yerine 610 hesabını unutmak. Birikmiş amortismanı pasifte göstermek (aktifte eksi kalemdir).</div>`,
recall:[["KDV'li mal alışı kaydı?","Ticari Mallar B + İndirilecek KDV B / Satıcılar A (KDV dâhil toplam)."],["KDV'li satış kaydı?","Alıcılar B (KDV dâhil) / Yurt İçi Satışlar A + Hesaplanan KDV A."],["Amortisman kaydı?","Gider (ör. Genel Yönetim Giderleri) B / Birikmiş Amortismanlar A."]]},

{id:15,t:"Hesaplama Atlası",sub:"10 soru tipi, 10 algoritma, sınav yönetimi",min:35,html:`
<div class="core"><b>Çekirdek</b>Vize soruları çoğu zaman on tipe indirgenir. Her tip için adımları bir algoritma gibi uygula; hesaplamayı acele etme, birimleri ve işaretleri yaz.</div>
<h3>Tip 1: Bilanço eşitliğinde bilinmeyeni bulma</h3>
<p><b>Adımlar:</b> (1) Aktif toplamını bul (dönen + duran). (2) Pasif toplamını yaz (KVYK + UVYK + sermaye + dönem sonucu). (3) Bilinmeyeni çek. <i>Örnek:</i> Dönen 35.000, YK 40.000, pasif 80.000 → duran 45.000, özkaynak 40.000.</p>
<h3>Tip 2: Dönem kârı veya zararı</h3>
<p>Dönem sonucu = Özkaynak − Sermaye (yedek ve geçmiş yıl sonucu yoksa), özkaynak = Aktif − YK. Pozitif kâr, negatif zarar. <i>Örnek:</i> Aktif 150, YK 62, sermaye 95 → özkaynak 88, sonuç −7 (zarar).</p>
<h3>Tip 3: Hesap bakiyesi</h3>
<p>Borç ve alacak toplamlarını ayrı topla; büyükten küçüğü çıkar; fark büyük taraftadır. Aktif hesapta artış borç; pasifte alacak.</p>
<h3>Tip 4: Yevmiye maddesi bulma</h3>
<p>(1) Hesapları sırala. (2) Her biri hangi grup? (3) Artış/azalış? (4) Borç = alacak mı? (5) Satışsa maliyet kaydı var mı?</p>
<h3>Tip 5: Mizan toplamı</h3>
<p>Tutar sütunu toplamı = yevmiye madde tutarları toplamı. Kalan sütunu toplamı (genel geçici mizan, düzenleyici hesap yokken) = aktif hesaplar + gider hesapları = dönem kârı eklenmemiş pasif hesaplar + gelir hesapları.</p>
<h3>Tip 6: Gelir tablosu kademeleri</h3>
<p>Net satış = brüt − indirimler. Brüt kâr = net − maliyet. Faaliyet kârı = brüt − faaliyet gideri. Olağan kâr = faaliyet kârı + diğer gelir − diğer gider − finansman. Dönem kârı = olağan kâr ± olağan dışı. Net kâr = dönem kârı − vergi.</p>
<h3>Tip 7: Bilanço düzenleme</h3>
<p>Hesapları sınıfla, dönen-duran-KVYK-UVYK-özkaynak olarak yerleştir, topla, farkı dönem kârı yap.</p>
<h3>Tip 8: İşlemin etkisi</h3>
<p>Aktif↔aktif, pasif↔pasif, ikisi artar, ikisi azalır sınıflaması. Kâr oluşuyorsa pasif tarafı değişir.</p>
<h3>Tip 9: Fiş türü</h3>
<p>Kasaya bak: giriş tahsil, çıkış tediye, yok mahsup.</p>
<h3>Tip 10: Kavram soruları</h3>
<p>Soru kökündeki anahtar kelimeyi bul. "Değildir/yanlıştır" köklerinde önce doğru olanları ele; geriye kalan cevap.</p>
<h3>Çeldirici tipleri</h3>
<div class="tw"><table><tr><th>Çeldirici</th><th>Örnek</th><th>Karşı önlem</th></tr>
<tr><td>Ters çevirme</td><td>"Pasifte azalış alacaktır"</td><td>Kuralı türetip yeniden yaz</td></tr>
<tr><td>Hesap sonucunun bir aşamasını verme</td><td>Brüt kâr yerine faaliyet kârı</td><td>Sorunun hangi kademeyi istediğine bak</td></tr>
<tr><td>Eksik kalem</td><td>Maliyeti unutulmuş satış</td><td>Her satışta iki kayıt</td></tr>
<tr><td>Benzer kavram</td><td>Süreklilik / dönemsellik</td><td>Ayırıcı cümleler tablosu</td></tr>
<tr><td>Fazla genelleme</td><td>"Tüm varlıklar maliyetle"</td><td>İstisnayı ara</td></tr>
<tr><td>Doğru ama soruya cevap değil</td><td>Doğru bilgi, başka konu</td><td>Soru kökünü iki kez oku</td></tr></table></div>
<h3>Sınav yönetimi</h3>
<ul><li>Kolayları önce çöz; hesaplamayı ikinci tura bırak.</li><li>Hesaplamada ara sonuçları kâğıda yaz; eşitlikle kontrol et (aktif = pasif).</li><li>"Değildir" köklerini daire içine al.</li><li>Emin değilsen en az iki şıkkı ele; ele geçirdiğin şıkları çiz.</li><li>Son 5 dakika boş bırakma; bilgiye dayalı tahmin yap.</li></ul>
<div class="trap"><b>Tuzak</b>Hesaplamada yarım kalan sonuç: soru "özkaynak" diyorsa sermayeyi değil toplamı ver; "dönem kârı" diyorsa net kârı mı brüt kârı mı olduğuna bak.</div>`,
recall:[["Dönem kârı nasıl bulunur?","Özkaynak − sermaye; özkaynak = aktif − yabancı kaynaklar."],["Mizan kalan toplamı neyle ilişkili?","Aktif hesaplar + gider hesapları = dönem kârı eklenmemiş pasif + gelir hesapları (genel geçici mizan)."],["Fiş türü kuralı?","Kasa girerse tahsil, çıkarsa tediye, yoksa mahsup."]]},

{id:16,t:"Son Tuzak Kataloğu",sub:"Sınavdan önce 15 dakikada oku",min:20,html:`
<div class="core"><b>Çekirdek</b>Sınavda çeldirici, doğru cümlenin bir kelimesini değiştirir. Bu satırlar o kelimeleri toplar.</div>
<h3>Kavramlar ve tanımlar</h3>
<ol>
<li>Muhasebe: <b>kaydetme–sınıflandırma–raporlama–analiz</b>. Yevmiye kaydeder, kebir sınıflandırır.</li>
<li>Temel nitelik: <b>ihtiyaca uygunluk + gerçeğe uygun sunum</b>; gerisi destekleyici.</li>
<li>Tahmin ve teyit <b>ihtiyaca uygunluğun</b>; tam, tarafsız, hatasız <b>gerçeğe uygun sunumun</b> parçasıdır.</li>
<li><b>Süreklilik → maliyet esasının temeli.</b> Dönemsellik sürekliliği <u>böler</u>.</li>
<li><b>Maliyet esası:</b> para mevcudu ve alacaklar <u>hariç</u>.</li>
<li><b>İhtiyatlılık:</b> gider ve zarar için karşılık, gelir ve kâr için bekle.</li>
<li><b>Tutarlılık:</b> politika değiştirme → karşılaştırılabilirlik.</li>
<li><b>Kişilik:</b> işletme ≠ sahip. <b>Özün önceliği:</b> biçim ≠ öz.</li>
<li><b>Karşılaştırılabilirlik</b> kavram değil, niteliktir.</li>
<li><b>Toplumsal işletme:</b> kâr amacı yok. <b>Ticari:</b> kâr var.</li>
</ol>
<h3>Bilanço</h3>
<ol start="11">
<li><b>Bilanço = an; gelir tablosu = dönem.</b></li>
<li><b>Hesap tipi yan yana; rapor tipi alt alta (analize uygun).</b> Özet = grup tutarı; ayrıntılı = kalemler.</li>
<li><b>Aktif: likidite; pasif: kaynak ve geri ödeme süresi.</b></li>
<li><b>100-199 dönen · 200-299 duran · 300-399 KVYK · 400-499 UVYK · 500-599 özkaynak.</b></li>
<li>Vadesi 1 yıldan <u>kısa</u> alacak dönen; <u>uzun</u> alacak duran. Vadesi kısa borç KVYK, uzun borç UVYK.</li>
<li>Gelecek aylara ait gelirler <b>KVYK</b> (380). Alınan avanslar genellikle <b>KVYK</b> (340); vadesi bir yıldan uzunsa UVYK (440).</li>
<li><b>KVYK ile duran varlık finansmanı → net çalışma sermayesi noksanı.</b></li>
<li><b>Özkaynak ağırlıklı = güvenli.</b> Borçla finansman: daha az özkaynakla yüksek kârlılık.</li>
<li><b>Özkaynağın ideal büyüklük sırası:</b> otofinansman &gt; ödenmiş sermaye &gt; sermaye yedekleri; zararlar sonda. (Bilançodaki yazılış sırası ise 50 → 52 → 54 → 57 → 58 → 59.)</li>
<li><b>TMS:</b> bilanço = finansal durum tablosu; gelir tablosu = kapsamlı gelir tablosu (3 bölüm). Standart format yok.</li>
<li>THP "akım", TMS "akış".</li>
<li>Zarar: <u>özkaynak içinde, eksi</u> kalem.</li>
</ol>
<h3>Gelir tablosu</h3>
<ol start="21">
<li><b>Brüt kâr = net satış − satışların maliyeti.</b></li>
<li>Faaliyet kârı finansman gideri öncesi.</li>
<li>Gider tanımında <b>temettü ve sermaye azaltımı hariç</b>; sermaye artırımı gelir değil.</li>
<li><b>BIST ara dönem 3 ay.</b></li>
</ol>
<h3>Hesap, yevmiye, fiş, mizan</h3>
<ol start="25">
<li><b>Gider artışı borç, gelir artışı alacak, aktif artışı borç, pasif artışı alacak.</b></li>
<li><b>Borç = sol, alacak = sağ.</b></li>
<li>Kasa alacak bakiyesi vermez.</li>
<li><b>Karma madde:</b> iki tarafta da çok hesap; bileşik: bir tarafta çok.</li>
<li>Yevmiyede borç satır başı, alacak içeriden.</li>
<li><b>Kasa girerse tahsil, çıkarsa tediye, yoksa mahsup.</b> Bankaya yatırma = tediye.</li>
<li>Fatura, bordro, gider pusulası <b>belge</b>; tahsil, tediye, mahsup <b>fiş</b>.</li>
<li>Satışta <b>iki kayıt</b> (sürekli envanter yönteminde): bedel ve maliyet (STMM). Aralıklı envanterde maliyet kaydı dönem sonunda yapılır.</li>
<li><b>Mizan:</b> tutar ve kalan sütunları ayrı ayrı denk.</li>
<li>Geçici mizan kalan toplamı bilanço toplamından <b>büyük</b> olabilir (gelir-gider hesapları açık).</li>
<li>Aylık geçici mizan <b>her ay sonu</b>; genel geçici <b>Aralık</b>; kesin <b>envanter ve kapatmadan sonra</b>.</li>
<li><b>Dönemsel süreç:</b> geçici mizan → envanter → kapatma → netleştirme → kesin mizan → tablolar → kapanış kaydı.</li>
<li>Mizan denk çıkması kayıtların kesin doğru olduğunu göstermez.</li>
<li>Aktif toplamı her zaman pasif toplamına eşittir.</li>
<li>Özkaynak ≠ sermaye (kâr/zarar/yedek farkı).</li>
<li>"Hangisi YANLIŞTIR/DEĞİLDİR" köklerinde önce doğrularını ele.</li>
</ol>`,
recall:[["Bilanço ile gelir tablosu tek cümlede?","Bilanço bir tarihteki durumu, gelir tablosu bir dönemin sonucunu gösterir."],["Kasa, tahsil, tediye, mahsup?","Kasa girerse tahsil, çıkarsa tediye, hiç yoksa mahsup."],["Brüt kâr formülü?","Net satışlar − satışların maliyeti."]]}
