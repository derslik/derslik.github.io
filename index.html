  if(keep){var el=root.querySelector('[data-bind="'+keep[0]+'"]'+(keep[1]!==null?'[data-i="'+keep[1]+'"]':''));if(el)el.focus();}
}

/* ---------- Uygulama, çevrimdışı, yedek ---------- */
function pwaInfo(t){var e=document.getElementById("pwainfo");if(e)e.textContent=t;}
function offlineDl(){
  if(!PWA.ok||!window.caches){toast("Bu tarayıcıda çevrimdışı indirme yok.");return;}
  var suf=(window.Cine&&Cine.sonek)?Cine.sonek():"";
  var ys=(window.Cine&&Cine.yedek)?Cine.yedek():"";
  var m=window["AUDIO_MANIFEST"+suf]||window.AUDIO_MANIFEST||{},urls=[],seen={},pk=window["AUDIO_PACK"+suf]||window["AUDIO_PACK"+ys]||window.AUDIO_PACK||{};
  var paketsiz=!window["AUDIO_PACK"+suf];  /* Gemini sesleri tek tek dosyadır: kart ve soru kayıtları da indirilir */
  Object.keys(m).forEach(function(k){if(paketsiz||/^(\d+-\d+[a-z]*|match|test)$/.test(k))urls.push(m[k]);});
  Object.keys(pk).forEach(function(k){seen[pk[k][0]]=1;});Object.keys(seen).forEach(function(n){urls.push(n);});
  if(!urls.length){pwaInfo("İndirilecek ses bulunamadı.");return;}
  var done=0,fail=0,i=0;
  pwaInfo("İndiriliyor: 0 / "+urls.length);
  caches.open("mv-ses").then(function(c){
    function next(){
      if(i>=urls.length)return;var u=urls[i++];
      return c.match(u).then(function(h){return h||c.add(u);}).catch(function(){fail++;}).then(function(){done++;pwaInfo("İndiriliyor: "+done+" / "+urls.length);return next();});
    }
    return Promise.all([next(),next(),next()]);
  }).then(function(){pwaInfo(fail?("Tamamlandı, "+fail+" dosya indirilemedi; bağlantı varken tekrar dene."):"Tüm sesler cihazına indirildi; internet olmadan da çalışır.");});
}
function backupDl(){
  try{
    var blob=new Blob([JSON.stringify({app:CO.id,tarih:new Date().toISOString(),s:S})],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="muhasebe-ilerleme-"+today()+".json";document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},3000);pwaInfo("Yedek dosyası indirildi.");
  }catch(e){pwaInfo("Yedek indirilemedi.");}
}
function restoreFrom(file){
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);if(!d||d.app!==CO.id||!d.s)throw new Error("biçim");
      var base=def();for(var k in d.s)base[k]=d.s[k];
      S=base;save();toast("İlerleme yedekten geri yüklendi.");render();
    }catch(e){pwaInfo("Bu dosya geçerli bir yedek değil.");}
  };
  rd.readAsText(file);
}
/* ---------- sinema köprüsü ---------- */
window.CineAPI={
  onFinish:function(lid){S.done[lid]=true;S.lastDone=lid;unlockCards(lid);touch();save();toast("Parça tamamlandı. Kartlar tekrar listene eklendi.");},
  onClose:function(){render();},
  toast:toast
};

/* ---------- olaylar ---------- */
root.addEventListener("click",function(e){
  var x=e.target.closest("[data-act]");if(!x)return;
  var act=x.getAttribute("data-act"),d=x.dataset;
  if(act==="go"){if(d.v==="test"&&T.test&&T.test.done)T.test=null;go(d.v);}
  else if(act==="lesson"){e.preventDefault();S.view="ders";T.lesson=parseInt(d.id,10);T.scroll=true;save();render();}
  else if(act==="cine"){Cine.open(parseInt(d.id,10));}
  else if(act==="pwa-install"){if(PWA.prompt){PWA.prompt.prompt();PWA.prompt.userChoice.then(function(){PWA.prompt=null;render();});}}
  else if(act==="offline-dl"){offlineDl();}
  else if(act==="backup"){backupDl();}
  else if(act==="lesson-test"){var lids=lessonQIds(parseInt(d.id,10));if(lids.length){T.test=null;startTest(shuffle(lids),"alistirma");}}
  else if(act==="dtab"){T.dtab=d.t;render();}
  else if(act==="atab"){T.atab=d.t;render();}
  else if(act==="mm-all"){Array.prototype.forEach.call(document.querySelectorAll(".mm details"),function(el,i){if(i===0)return;el.open=d.o==="1";});}
  else if(act==="done"){var id=parseInt(d.id,10);S.done[id]=true;S.lastDone=id;unlockCards(id);touch();save();toast("Parça tamamlandı. Kartlar tekrar listene eklendi.");render();}
  else if(act==="say"){if(window.Cine&&Cine.say)Cine.say(d.t,d.k);}
  else if(act==="rv-start"){startRv(false);render();}
  else if(act==="rv-all"){startRv(true);render();}
  else if(act==="rv-show"){T.rv.shown=true;render();}
  else if(act==="rv-yes"){rvGrade(true);}
  else if(act==="rv-no"){rvGrade(false);}
  else if(act==="rv-end"){T.rv=null;render();}
  else if(act==="at-open"){T.at={k:d.k,step:0,rows:newRows(),fb:null};T.scroll=true;render();}
  else if(act==="at-back"){T.at=null;T.scroll=true;render();}
  else if(act==="at-add"){if(T.at.rows.length<5){T.at.rows.push({a:"",s:"A",v:""});render();}}
  else if(act==="at-side"){T.at.rows[+d.i].s=d.s;render();}
  else if(act==="at-check"){atCheck();touch();render();}
  else if(act==="at-show"){var st=AT[T.at.k].steps[T.at.step][1];T.at.rows=st.map(function(l){return {a:l[0],s:l[1],v:String(l[2])};});T.at.fb={t:"ok",m:"<b>Cevap:</b> "+entryText(st)};render();}
  else if(act==="at-next"){T.at.step++;T.at.rows=newRows();T.at.fb=null;T.scroll=true;render();}
  else if(act==="cl-start"){startCl();render();}
  else if(act==="cl-pick"){var c=T.cl,it=CLASSIFY[c.order[c.i]],g=parseInt(d.g,10);if(c.fb)return;c.fb={ok:g===it[1]};if(c.fb.ok)c.ok++;else c.wrong.push(it);touch();render();}
  else if(act==="cl-next"){T.cl.i++;T.cl.fb=null;render();}
  else if(act==="rf-start"){startRf();render();}
  else if(act==="rf-pick"){var r=T.rf,q=r.qs[r.i];if(r.fb)return;r.fb={ok:rfAns(q)===d.s};if(r.fb.ok)r.ok++;touch();render();}
  else if(act==="rf-next"){T.rf.i++;T.rf.fb=null;render();}
  else if(act==="cfg-mode"){T.cfg.mode=d.m;render();}
  else if(act==="cfg-cat"){T.cfg.cat=parseInt(d.c,10);if(T.cfg.cat>=0)T.cfg.lesson=-1;render();}
  else if(act==="test-go"){var lsn=T.cfg.lesson===undefined?-1:T.cfg.lesson;var ids=Q.map(function(q,i){return i;}).filter(function(i){return (T.cfg.cat<0||Q[i].c===T.cfg.cat)&&(lsn<0||inLesson(i,lsn));});if(!ids.length){toast("Bu seçimde soru yok.");return;}startTest(shuffle(ids),T.cfg.mode);}
  else if(act==="test-quick"){startTest(shuffle(Q.map(function(q,i){return i;})).slice(0,20),T.cfg.mode);}
  else if(act==="test-fresh"){startTest(null,T.cfg.mode,window.genFresh(12));}
  else if(act==="plan-test"){T.cfg.cat=parseInt(d.c,10);if(d.m)T.cfg.mode=d.m;S.view="test";T.test=null;T.scroll=true;save();render();}
  else if(act==="test-wrong"){var w=Object.keys(S.wrong).map(Number).filter(function(i){return Q[i];});if(!w.length){toast("Hata defterin boş.");return;}T.test=null;startTest(shuffle(w),"alistirma");}
  else if(act==="test-new"){T.test=null;T.scroll=true;render();}
  else if(act==="test-strike"){e.stopPropagation();var it2=T.test.qs[T.test.i],o=parseInt(d.o,10),ix=it2.struck.indexOf(o);if(ix>=0)it2.struck.splice(ix,1);else it2.struck.push(o);render();}
  else if(act==="test-pick"){var t=T.test,it3=t.qs[t.i];if(t.mode==="alistirma"&&it3.pick!==null)return;it3.pick=parseInt(d.o,10);if(t.mode==="alistirma")touch();render();}
  else if(act==="test-jump"){T.test.i=parseInt(d.i,10);render();}
  else if(act==="test-next"){T.test.i++;T.scroll=true;render();}
  else if(act==="test-prev"){T.test.i--;T.scroll=true;render();}
  else if(act==="test-finish"){finishTest();}
});
root.addEventListener("input",function(e){
  var b=e.target.getAttribute&&e.target.getAttribute("data-bind");
  if(b==="v"&&T.at){T.at.rows[+e.target.getAttribute("data-i")].v=e.target.value;}
  else if(b==="gq"){T.gq=e.target.value;var gl=document.getElementById("glist");if(gl)gl.innerHTML=glossHtml(T.gq);}
});
root.addEventListener("change",function(e){var b=e.target.getAttribute&&e.target.getAttribute("data-bind");if(b==="a"&&T.at){T.at.rows[+e.target.getAttribute("data-i")].a=e.target.value;}else if(b==="cfglesson"){T.cfg.lesson=parseInt(e.target.value,10);if(T.cfg.lesson>=0)T.cfg.cat=-1;render();}
  else if(e.target.id==="restoreFile"&&e.target.files&&e.target.files[0]){restoreFrom(e.target.files[0]);}});
document.addEventListener("keydown",function(e){
  if(document.getElementById("cine"))return;
  var tag=(e.target.tagName||"").toLowerCase();
  if((e.key==="Enter"||e.key===" ")&&e.target.getAttribute&&(e.target.getAttribute("data-act")==="test-pick"||e.target.getAttribute("data-act")==="lesson"||e.target.getAttribute("data-act")==="cine")){e.preventDefault();e.target.click();return;}
  var t=T.test;if(S.view!=="test"||!t||t.done)return;
  if(tag==="input"||tag==="select")return;
  var k=e.key.toLowerCase(),idx="abcde".indexOf(k);
  if(idx>=0&&k.length===1){var it=t.qs[t.i];if(t.mode==="alistirma"&&it.pick!==null)return;it.pick=it.order[idx];if(t.mode==="alistirma")touch();render();}
  else if(e.key==="ArrowRight"&&t.i<t.qs.length-1){t.i++;render();}
  else if(e.key==="ArrowLeft"&&t.i>0){t.i--;render();}
});

syncInit();
if(PWA.ok){try{navigator.serviceWorker.register("sw.js").catch(function(){});}catch(e){}}
})();
