<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#2B2822"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Derslik"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Derslik</title>
<meta name="claude:viewport-fit-sides" content="cover">


<link rel="stylesheet" href="fonts/yazi.css">
<style>
/* Düzen: solda dar ders rayı, ortada okuma alanı; telefonda alt sekme çubuğu.
   Palet: beyaz zemin, sıcak grafit yazı, çok hafif altın vurgu. Yalnız açık tema. */
:root{
  color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface2:#F6F5F1; --ink:#26231D; --muted:#756F63; --line:#E8E4DA;
  --btn:#2B2822; --on-btn:#FFFFFF; --gold:#B08A3E; --gold-soft:#F8F2E2; --gold-line:#E4D3A8; --gold-ink:#6F5421;
  --ok:#2E7D5B; --ok-soft:#E6F3EC; --bad:#A8404F; --bad-soft:#F9E8EA; --info:#6A7380; --info-soft:#F2F3F5;
  --shadow:0 1px 2px rgba(38,35,29,.05),0 8px 24px rgba(38,35,29,.05);
  --fd:'Fraunces',Georgia,'Times New Roman',serif; --fb:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif; --fm:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  --r:14px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.62}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible,[role=button]:focus-visible{outline:3px solid var(--gold-line);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--fd);font-weight:600;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:clamp(1.6rem,4vw,2.1rem)} h2{font-size:1.4rem} h3{font-size:1.1rem;margin:1.5rem 0 .5rem}
p{margin:.55rem 0} ul,ol{margin:.5rem 0;padding-left:1.25rem} li{margin:.28rem 0}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:312px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:8px;padding:26px 22px;background:var(--surface2);border-right:1px solid var(--line);overflow-y:auto}
.brandbox{display:flex;gap:14px;align-items:center;background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:18px;padding:18px 16px;margin-bottom:20px}
.bmark{width:50px;height:50px;border-radius:50%;background:var(--btn);display:grid;place-items:center;flex:none}
.bmark svg{width:26px;height:26px}
.brandbox b{display:block;font-family:var(--fd);font-weight:600;font-size:1.32rem;line-height:1.15}
.brandbox small{display:block;color:var(--muted);font-size:.86rem;margin-top:3px;white-space:nowrap}
/* arama kutusu kaydırırken üstte kalır */
.ssticky{position:sticky;top:0;z-index:5;background:var(--surface,#fff);padding-top:4px}
mark{background:var(--gold-soft);color:var(--ink);border-radius:3px;padding:0 2px}
.brandbox .cd{display:block;margin-top:9px;font-size:.88rem;color:var(--gold-ink)}
.mbrand{display:none;margin-bottom:18px}
.wrap{max-width:1140px;margin:0 auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:14px;background:none;border:0;border-radius:12px;padding:12px 14px;text-align:left;font-weight:600;font-size:1.02rem;color:var(--muted)}
.nav button svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--gold),0 1px 2px rgba(38,35,29,.06)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:.84rem;color:var(--muted)}
.cd{font-family:var(--fm);font-variant-numeric:tabular-nums;color:var(--ink);font-size:.95rem}
.main{padding:42px clamp(20px,4.2vw,64px) 84px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.top h1{position:relative}
.eyebrow{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px}
.sub{color:var(--muted);margin:.3rem 0 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.card+.card{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))} .g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--btn);color:var(--on-btn);border:1px solid var(--btn);border-radius:10px;padding:10px 18px;font-weight:600;min-height:44px}
.btn:hover{background:#3d3a32} .btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)} .btn.ghost:hover{background:var(--surface2);border-color:var(--gold-line)}
.btn.gold{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink)} .btn.gold:hover{background:#f3e8c9}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:.88rem;font-weight:600;color:var(--muted)}
.chip:hover{border-color:var(--gold-line);color:var(--ink)}
.chip[aria-pressed="true"],.chip[aria-selected="true"]{background:var(--gold-soft);color:var(--ink);border-color:var(--gold)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.gold{background:var(--gold-soft);color:var(--gold-ink)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.mute{background:var(--surface2);color:var(--muted)}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:99px}
.bar.ok>i{background:var(--ok)}
.stat b{display:block;font-family:var(--fd);font-weight:600;font-size:1.8rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.86rem}
.plan{display:grid;gap:10px}
.plan .it{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.plan .tag{font-family:var(--fd);font-weight:600;color:var(--gold);min-width:5.4rem}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px}
.lcard{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;width:100%;min-height:92px}
.lcard:hover{border-color:var(--gold-line);background:var(--gold-soft)}
.no{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-weight:600;border:1.5px solid var(--line);color:var(--muted)}
.no.done{background:var(--ok);border-color:var(--ok);color:#fff}
.lcard b{display:block;font-family:var(--fd);font-weight:600;font-size:1.02rem}
.lcard small{color:var(--muted)}
.read{max-width:74ch}
.read h3{border-top:1px solid var(--line);padding-top:1.1rem}
.read>h3:first-child{border-top:0;padding-top:0}
.core,.trap,.tip,.ex{border-radius:12px;padding:12px 16px;margin:14px 0;border:1px solid}
.core{background:var(--gold-soft);border-color:var(--gold-line)}
.core>b:first-child,.trap>b:first-child,.tip>b:first-child,.ex>b:first-child{display:block;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;margin-bottom:3px}
.core>b:first-child{color:var(--gold-ink)}
.trap{background:var(--bad-soft);border-color:#EBC5CA} .trap>b:first-child{color:var(--bad)}
.tip{background:var(--info-soft);border-color:#DADDE2} .tip>b:first-child{color:var(--info)}
.ex{background:var(--ok-soft);border-color:#BFE0CE} .ex>b:first-child{color:var(--ok)}
.tw{overflow-x:auto;margin:12px 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--surface2);font-weight:700;white-space:nowrap} tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--fm);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:700;background:var(--surface2)}
pre.eq{font-family:var(--fm);font-size:.86rem;background:var(--surface2);border-radius:12px;padding:12px 14px;overflow-x:auto;margin:12px 0;line-height:1.55}
.kv{display:grid;grid-template-columns:minmax(0,13rem) minmax(0,1fr);gap:4px 16px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv>b{font-family:var(--fd);font-weight:600}
.recall details,details.qa{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:8px 0}
.recall summary,details.qa>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
.recall summary::before{content:"?";display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--gold-soft);color:var(--gold-ink);font-weight:700;flex:none}
.recall details[open] summary::before{content:"✓";background:var(--ok-soft);color:var(--ok)}
.recall details>div{padding:0 16px 14px 50px}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;padding:28px}
.flash .f{font-family:var(--fd);font-size:1.3rem;font-weight:500}
.flash .b{font-size:1.05rem;border-top:1px dashed var(--line);padding-top:14px;text-align:left}
.boxes{display:flex;gap:6px}.boxes i{width:22px;height:5px;border-radius:3px;background:var(--surface2)}.boxes i.on{background:var(--gold)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:.72rem;font-weight:700;padding:0;color:var(--muted)}
.dots button.cur{border-color:var(--gold);color:var(--ink);background:var(--gold-soft)}
.dots button.ans{background:var(--surface2);color:var(--ink)} .dots button.right{background:var(--ok);border-color:var(--ok);color:#fff} .dots button.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.qtext{font-size:1.1rem;line-height:1.55;margin:6px 0 16px}
.opts{display:grid;gap:9px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;width:100%;cursor:pointer}
.opt:hover:not([aria-disabled="true"]){border-color:var(--gold-line);background:var(--gold-soft)}
.opt .l{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface2);font-size:.9rem}
.opt.sel{border-color:var(--gold);background:var(--gold-soft)} .opt.sel .l{background:var(--gold);color:#fff}
.opt.struck .t{text-decoration:line-through;opacity:.45}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .l{background:var(--bad);color:#fff}
.opt .x{border:0;background:none;color:var(--muted);font-size:.8rem;padding:2px 6px;border-radius:6px}
.opt .x:hover{background:var(--surface2)}
.expl{margin-top:14px}
.timer{font-family:var(--fm);font-weight:500;background:var(--surface2);border-radius:8px;padding:4px 10px}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.score{font-family:var(--fd);font-weight:600;font-size:3.2rem;line-height:1}
.cats{display:grid;gap:10px}
.cats .c{display:grid;grid-template-columns:minmax(0,13rem) 1fr auto;gap:12px;align-items:center;font-size:.92rem}
.build{display:grid;gap:8px;margin:14px 0}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto 128px;gap:8px;align-items:center}
.brow select,.brow input,.search{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px;width:100%}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:9px 14px;font-weight:700;min-height:42px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold-soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--gold)}
.seg button+button{border-left:1.5px solid var(--line)}
.fb{border-radius:12px;padding:12px 16px;margin:12px 0;border:1px solid}
.fb.ok{background:var(--ok-soft);border-color:#BFE0CE} .fb.bad{background:var(--bad-soft);border-color:#EBC5CA} .fb.hint{background:var(--info-soft);border-color:#DADDE2}
.ledger{font-size:.88rem}
.side-note{font-size:.8rem;color:var(--muted)}
.tabbar{display:none}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--btn);color:var(--on-btn);padding:10px 18px;border-radius:999px;font-weight:600;box-shadow:var(--shadow);z-index:200}
.subnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.watch{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;border:1px solid var(--gold-line);background:var(--gold-soft);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;cursor:pointer;transition:border-color .2s,box-shadow .2s}
.watch:hover{border-color:var(--gold);box-shadow:0 4px 18px rgba(176,138,62,.18)}
.watch:hover .pl{transform:scale(1.06)}
.watch .pl{transition:transform .2s}
.watch .pl{width:46px;height:46px;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center;font-size:1.1rem;padding-left:3px}
.watch b{font-family:var(--fd);font-weight:600;display:block}
.spk{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;padding:0;flex:none;vertical-align:middle}
.spk svg{width:16px;height:16px;fill:var(--muted)} .spk:hover{border-color:var(--gold)}
/* zihin haritası */
.mm,.mm ul{list-style:none;margin:0;padding:0}
.mm ul{margin-left:14px;padding-left:18px;border-left:1.5px solid var(--gold-line)}
.mm li{position:relative;padding:3px 0 3px 14px}
.mm li::before{content:"";position:absolute;left:0;top:19px;width:12px;border-top:1.5px solid var(--gold-line)}
.mm>li{padding-left:0}.mm>li::before{display:none}
.mm details>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;max-width:100%}
.mm details>summary::-webkit-details-marker{display:none}
.mm details>summary::after{content:"▾";color:var(--muted);font-size:.8rem;flex:none}
.mm details:not([open])>summary::after{content:"▸"}
.mm .d0>details>summary{background:var(--gold-soft);border-color:var(--gold);font-family:var(--fd);font-size:1.1rem;padding:8px 16px}
.mm .d1>details>summary{border-color:var(--gold-line);font-family:var(--fd)}
.mm .leaf{display:inline-block;padding:3px 10px;border-radius:8px;background:var(--surface2);font-size:.92rem}
.mm .go{margin-left:6px;font-size:.76rem;font-weight:700;color:var(--gold-ink);background:var(--surface);border:1px solid var(--gold-line);border-radius:999px;padding:1px 10px}
.term{padding:12px 0;border-bottom:1px solid var(--line)} .term:last-child{border-bottom:0}
.term b{font-family:var(--fd);font-weight:600}
.drill-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.big{font-family:var(--fd);font-weight:500;font-size:1.5rem;text-align:center;padding:18px 8px}
.day{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)} .day:last-child{border-bottom:0}
.day.today{background:var(--gold-soft);border-radius:10px;padding:10px 12px;border-bottom:0}
.day .dn{font-family:var(--fd);font-weight:600;min-width:3.6rem;color:var(--gold-ink)}
.syncnote{font-size:.78rem;color:var(--muted)}
/* ---------- sinema ---------- */
.cine{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:hidden}
.ctop{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:960px;width:100%;margin:0 auto}
.ctitle{min-width:0}.ctop .row{flex-wrap:nowrap;flex:none}
.ctitle b{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.ctitle span{font-family:var(--fd);font-weight:600}
.cb{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;min-height:38px}
.cb:hover{border-color:var(--gold-line);background:var(--gold-soft)}
.cb.big{width:58px;height:58px;padding:0;background:var(--btn);color:#fff;border-color:var(--btn);font-size:1.1rem}
.cb.big:disabled{opacity:.35}
.cb.sm{padding:3px 10px;min-height:30px;font-size:.84rem}
.cb.on{background:var(--gold-soft);border-color:var(--gold)}
.csegs{display:flex;gap:4px;max-width:960px;width:100%;margin:10px auto 0}
.cseg{flex:1;height:4px;border-radius:3px;background:var(--surface2);position:relative;overflow:hidden}
.cseg.on{background:var(--gold)}
.cseg.cur::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:var(--gold)}
.cset{max-width:960px;width:100%;margin:10px auto 0;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--surface2)}
.cset select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);margin-left:6px;max-width:260px}
.cnote{font-size:.8rem;color:var(--muted);margin:0;flex-basis:100%}
.cstage{flex:1;min-height:0;overflow-y:auto;max-width:960px;width:100%;margin:0 auto;display:flex;flex-direction:column;padding:14px 0}
.cstage>.sc{margin:auto 0}
.sc{width:100%}
.ctitle span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.sc-h{font-size:1.35rem;margin:0 0 16px;text-align:center}
.rv{opacity:0;transform:translateY(18px) scale(.97);transition:opacity .5s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.34,1.56,.64,1),box-shadow .5s ease,background-color .5s ease}
.rv.on{opacity:1;transform:none}
/* canlılık: sahne girişi, son açılan öğenin vurgusu, sahne arkasında yavaş gezinen ışık */
.cstage>.sc{animation:scenein .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes scenein{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
.cine::before{content:"";position:absolute;width:62vmax;height:62vmax;left:-12vmax;top:-18vmax;border-radius:50%;background:radial-gradient(circle,rgba(176,138,62,.10),rgba(176,138,62,0) 62%);animation:drift 18s ease-in-out infinite alternate;pointer-events:none;z-index:0}
.cine>*{position:relative;z-index:1}
@keyframes drift{0%{transform:translate(0,0)}50%{transform:translate(48vw,22vh)}100%{transform:translate(18vw,52vh)}}

.aq{font-family:var(--fd);font-weight:500;font-size:1.5rem;line-height:1.35;margin:6px 0 18px}
