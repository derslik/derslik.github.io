 fl("Bilgi nasıl akar?",["Olay","Belge","Yevmiye","Büyük defter","Mizan","Finansal tablolar","Analiz"],"Önce bir olay olur, örneğin bir satış. Olayın belgesi düzenlenir, mesela fatura. Sonra olay yevmiye defterine tarih sırasıyla yazılır. Ardından büyük defterde hesaplara aktarılır. Mizan ile kayıtların dengesi kontrol edilir. Sonra bilanço ve gelir tablosu hazırlanır ve en sonda tablolar analiz edilip yorumlanır. Bu sırayı aklında tut, dersin haritası bu."),
 li("İşletme",["Ticari işletme: amaç kâr","Toplumsal işletme: kâr amacı yok. Hastane, okul, vakıf, dernek","7 fonksiyon: tedarik, üretim, pazarlama, finansman, muhasebe, yönetim, insan kaynakları"],"İşletme, insan gereksinimlerini karşılamak için mal ve hizmet üreten birimdir. Ticari işletmenin amacı kârdır. Toplumsal işletme ise kâr amacı gütmeden toplumun gereksinimini karşılar; sağlık kurumları, eğitim kurumları, vakıf ve dernekler gibi. İşletmenin yedi fonksiyonu vardır: tedarik, üretim, pazarlama, finansman, muhasebe, yönetim ve insan kaynakları yönetimi."),
 df("Muhasebe: sistem tanımı","İşletmede ortaya çıkan finansal olayları sistematik olarak kaydeden, bunları zamanlı, ilgili, güvenilir ve karşılaştırılabilir bilgilere dönüştürerek karar vericilere sunan bir sistemdir.","Muhasebenin birinci tanımı onu bir sistem olarak ele alır. Finansal olayları sistemli biçimde kaydeder ve bu olayları zamanlı, ilgili, güvenilir ve karşılaştırılabilir bilgiye dönüştürerek karar vericilere sunar.",["zamanlı","ilgili","güvenilir","karşılaştırılabilir","karar verici"]),
 df("Muhasebe: teknikler bütünü","Mali olayları tarih sırasına göre kaydeden, sınıflandıran, raporlayan ve bu bilgileri analiz ederek yorumlayan teknikler bütünüdür.","İkinci tanım muhasebeyi teknikler bütünü olarak anlatır. Olayları tarih sırasına göre kaydeder, sınıflandırır, raporlar ve sonunda analiz ederek yorumlar. Sınavda hangi tanımın hangi anahtar kelimelerle geldiğine dikkat et.",["tarih sırası","kaydet","sınıflandır","raporla","analiz ve yorum"]),
 mt("İşlevi araçla eşleştir",[["Kaydetme","Yevmiye defteri"],["Sınıflandırma","Defter-i kebir"],["Raporlama","Bilanço ve gelir tablosu"],["Analiz ve yorum","Finansal analiz teknikleri"]],"Şimdi sıra sende. Muhasebenin dört işlevini, onu yerine getiren araçla eşleştir. Önce soldan bir kutuya, sonra sağdan karşılığına dokun."),
 mc("Sınıflandırma işlevi hangi araçla yapılır?",["Yevmiye defteri","Defter-i kebir","Bilanço","Mizan"],1,"Doğru cevap defter-i kebir. Yevmiye olayları tarih sırasıyla kaydeder, kebir ise aynı türden olayları hesap başlığı altında toplayarak sınıflandırır. Sınavın en sevdiği tuzak bu.","Sınıflandırma işlevi hangi araçla yapılır?"),
 li("Finansal analiz ve kullanıcılar",["Tanım: tablo kalemleri arasındaki ilişkilerin ve zaman içindeki eğilimlerin incelenmesi","Amaç 1: işletmeyi değerlendirmek","Amaç 2: geleceğe yönelik kararlara bilgi desteği","Kullanıcılar: yönetim, ortaklar, borç verenler, tedarikçiler, çalışanlar, devlet","4 dal: genel, şirketler, maliyet, yönetim muhasebesi"],"Finansal analiz, tablo kalemleri arasındaki ilişkilerin ve zaman içindeki eğilimlerin incelenmesidir. İki amacı vardır: işletmeyi değerlendirmek ve geleceğe yönelik kararlara bilgi desteği sağlamak. Bilgiyi yönetim, ortaklar, borç verenler, tedarikçiler, çalışanlar ve devlet kullanır. Muhasebenin dört dalı vardır: genel, şirketler, maliyet ve yönetim muhasebesi."),
 ak("Bilgi akışını baştan sona say.","Olay, belge, yevmiye, büyük defter, mizan, finansal tablolar, analiz.","Şimdi dur ve düşün. Muhasebe bilgisinin akışını, olaydan analize kadar sırayla kendi kendine söyle. Hazır olunca cevabı göster.","Doğru sıra şöyle: olay, belge, yevmiye, büyük defter, mizan, finansal tablolar ve analiz. Birinci parça tamam.")
],

2:[
 ti("Faydalı Finansal Bilgi","Temel iki, destekleyici dört","Finansal bilginin iyi sayılması için iki temel ve dört destekleyici niteliği vardır. Sınavda temel olanı destekleyici, destekleyici olanı temel diye sorarlar. Bu parçayı bitirince hiçbir karışıklık kalmayacak."),
 cp("Nitelikler",{t:"Temel nitelikler (2)",items:["İhtiyaca uygunluk","Gerçeğe uygun sunum"]},{t:"Destekleyici nitelikler (4)",items:["Karşılaştırılabilirlik","Doğrulanabilirlik","Zamanında sunum","Anlaşılabilirlik"]},"Temel nitelikler iki tane: ihtiyaca uygunluk ve gerçeğe uygun sunum. Destekleyici nitelikler dört tane: karşılaştırılabilirlik, doğrulanabilirlik, zamanında sunum ve anlaşılabilirlik."),
 df("İhtiyaca uygunluk","Bilgi kararları etkileme gücüne sahiptir. Bunun için tahminlerde kullanılabilmeli ve teyit edici olmalıdır.","İhtiyaca uygunluk, bilginin karar vermeyi etkileme gücüdür. Bunun için bilgi iki şeyi sağlar: tahminlerde kullanılabilir, yani tahmin değeri taşır ve teyit edicidir, yani geçmiş beklentiyi doğrular ya da düzeltir.",["karar","tahmin","teyit"]),
 df("Gerçeğe uygun sunum","Bilgi tam, tarafsız ve hatasız sunulmalıdır.","Gerçeğe uygun sunum üç şartla anlaşılır: sunum tam olmalı, tarafsız olmalı ve hatasız olmalı. Tahmin ve teyit burada değil, ihtiyaca uygunlukta.",["tam","tarafsız","hatasız"]),
 mt("Niteliği tanımla eşleştir",[["İhtiyaca uygunluk","Tahmin ve teyit değeri"],["Gerçeğe uygun sunum","Tam, tarafsız, hatasız"],["Karşılaştırılabilirlik","Dönemler ve işletmeler arası kıyas"],["Zamanında sunum","Kararı etkileyecek zamanda ulaşma"]],"Şimdi dört niteliği anahtar ifadesiyle eşleştir."),
 mc("Bilginin tahminlerde kullanılabilmesi ve teyit edici olması hangi niteliğin gereğidir?",["Gerçeğe uygun sunum","İhtiyaca uygunluk","Doğrulanabilirlik","Anlaşılabilirlik"],1,"Cevap ihtiyaca uygunluk. Tahmin değeri ve teyit değeri onun şartlarıdır. Gerçeğe uygun sunumun şartları tam, tarafsız ve hatasız olmaktır.","Bilginin tahminlerde kullanılabilmesi ve teyit edici olması hangi niteliğin gereğidir?"),
 ak("Temel ikiyi ve destekleyici dördü say.","Temel: ihtiyaca uygunluk, gerçeğe uygun sunum. Destekleyici: karşılaştırılabilirlik, doğrulanabilirlik, zamanında sunum, anlaşılabilirlik.","Kendi kendine söyle: temel nitelikler hangileri, destekleyici nitelikler hangileri?","İki parça bitti. Temel ikiyi ve destekleyici dördü artık biliyorsun.")
],

3:[
 ti("Dayanaklar ve Tablo Setleri","İki dünya, iki isim","Finansal muhasebe dört dayanak üzerinde durur. Aynı tablolar Türkiye'de iki ayrı adla anılır. Bu parçada hangi tablonun hangi sette ve hangi adla geçtiğini öğreneceksin."),
 li("Dört dayanak",["Muhasebenin temel kavramları","Genel kabul görmüş muhasebe ilkeleri","Türkiye Muhasebe Standartları ve Uluslararası Muhasebe Standartları","Mevzuat: yasa, yönetmelik, tebliğ"],"Finansal muhasebeyi biçimlendiren dört temel var. Birincisi muhasebenin temel kavramları. İkincisi genel kabul görmüş muhasebe ilkeleri. Üçüncüsü Türkiye Muhasebe Standartları ile Uluslararası Muhasebe Standartları. Dördüncüsü de yasa, yönetmelik ve tebliğlerden oluşan mevzuat."),
 cp("THP ve TMS",{t:"Tekdüzen Hesap Planı",items:["Bilanço","Gelir tablosu","Ek tablolar: fon akım, nakit akım, özkaynak değişim, satışların maliyeti, kâr dağıtım","Standart format"]},{t:"TMS / TFRS",items:["Finansal durum tablosu","Kapsamlı gelir tablosu","Nakit akış, özkaynak değişim, dipnotlar","Standart format yok"]},"Solda Tekdüzen Hesap Planı var: temel tablolar bilanço ve gelir tablosu, ek tablolar beş tane. Sağda Türkiye Muhasebe Standartları: aynı tablolar finansal durum tablosu ve kapsamlı gelir tablosu adını alır; nakit akış, özkaynak değişim ve dipnotlar da seti tamamlar. Standartlarda tek tip bir format yoktur."),
 mt("Aynı tablonun iki adı",[["Bilanço","Finansal durum tablosu"],["Gelir tablosu","Kapsamlı gelir tablosu"],["Nakit akım tablosu","Nakit akış tablosu"]],"Aynı tablonun iki adını eşleştir. Akım ve akış farkına dikkat."),
 mc("Aşağıdakilerden hangisi Tekdüzen Hesap Planı'nın ek mali tablolarından biridir?",["Finansal durum tablosu","Kapsamlı gelir tablosu","Kâr dağıtım tablosu","Dipnotlar"],2,"Cevap kâr dağıtım tablosu. Ek tablolar: fon akım, nakit akım, özkaynak değişim, satışların maliyeti ve kâr dağıtım tablosu. Gelir tablosu ek değil, temel tablodur.","Tekdüzen Hesap Planı'nın ek mali tablolarından biri hangisidir?"),
 ak("Tekdüzen Hesap Planı'nın beş ek tablosunu say.","Fon akım, nakit akım, özkaynak değişim, satışların maliyeti, kâr dağıtım.","Dur ve say: ek mali tablolar beş tane. Hangileri?","Fon akım, nakit akım, özkaynak değişim, satışların maliyeti ve kâr dağıtım tablosu. Üçüncü parça bitti.")
],

4:[
 ti("On İki Muhasebe Kavramı","Sıra, anahtar kelime, vaka","On iki kavramın sırasını ve anahtar kelimelerini öğreneceksin. Sınavda ya kitap cümlesini ters çevirirler ya da bir olay anlatıp kavramı sorarlar. Anahtar kelimeyi bilen, çeldiriciyi tanır."),
 fl("Sıra",["Sosyal sorumluluk","Kişilik","Süreklilik","Dönemsellik","Parayla ölçülme","Maliyet esası","Tarafsızlık ve belgelendirme","Tutarlılık","Tam açıklama","İhtiyatlılık","Önemlilik","Özün önceliği"],"Hikâye gibi ezberle: toplum içinde bir kişi yaşar, bu kişi ölmez. Hayatını yıllara böler, her şeyi parayla ölçer, aldığı malı aldığı fiyattan yazar. Yazdığı her şeyin belgesi vardır. Defterini her yıl aynı usulle tutar, hiçbir şeyi saklamaz. Ama temkinlidir, önemliyi küçükten ayırır ve görünüşe değil gerçeğe bakar.",false),
 tb("Kavram ve anahtar kelime, birinci yarı",["Kavram","Anahtar"],[["Sosyal sorumluluk","Tüm toplumun çıkarı; dürüst, tarafsız bilgi"],["Kişilik","İşletme sahibinden ayrı bir kişidir"],["Süreklilik","Süreye bağlı değil; maliyet esasının temeli"],["Dönemsellik","Ömrü dilimle; tahakkuk"],["Parayla ölçülme","Ortak ölçü para; ulusal para"],["Maliyet esası","Edinme maliyeti; para ve alacaklar hariç"]],"Birinci yarıya bakalım. Sosyal sorumlulukta anahtar, tüm toplumun çıkarı. Kişilikte işletme sahibinden ayrı bir kişidir. Süreklilik, süreye bağlı değildir ve maliyet esasının temelidir. Dönemsellik, ömrü dilimler ve tahakkuka dayanır. Parayla ölçülmede ortak ölçü ulusal paradır. Maliyet esasında kayıt edinme maliyetiyledir, para mevcudu ve alacaklar hariç."),
 tb("Kavram ve anahtar kelime, ikinci yarı",["Kavram","Anahtar"],[["Tarafsızlık ve belgelendirme","Objektif belge; önyargısız yöntem"],["Tutarlılık","Politikayı dönemler arası değiştirme"],["Tam açıklama","Yeterli, açık, anlaşılır tablo"],["İhtiyatlılık","Gideri yaz, geliri gerçekleşince yaz"],["Önemlilik","Karar etkileyecek ağırlıkta olan tabloda yer alır"],["Özün önceliği","Biçimden çok öz"]],"İkinci yarı. Tarafsızlık ve belgelendirmede kayıt, objektif belgeye dayanır. Tutarlılıkta politika, dönemler arasında değişmez. Tam açıklamada tablolar yeterli, açık ve anlaşılır olur. İhtiyatlılıkta gideri hemen yaz, geliri gerçekleşince yaz. Önemlilikte kararı etkileyecek ağırlıktaki kalem tabloda yer alır. Özün önceliğinde biçime değil öze bakılır."),
 mc("Sahibin çocuğunun okul ücreti işletme kasasından ödenip gider yazılıyor. Hangi kavram ihlal edilmiştir?",["Tarafsızlık ve belgelendirme","Kişilik","Önemlilik","Özün önceliği"],1,"Kişilik. İşletme, sahibinden ayrı bir kişiliğe sahiptir; sahibin özel gideri işletme gideri olamaz.","Sahibin çocuğunun okul ücreti işletme kasasından ödenip gider yazılıyor. Hangi kavram ihlal edilmiştir?"),
 mc("Aralık kirası Ocak'ta ödenmesine rağmen Aralık gideri yazılıyor. Bu hangi kavramın gereğidir?",["Süreklilik","Maliyet esası","Dönemsellik","Tutarlılık"],2,"Dönemsellik. Gider, ödendiği değil ait olduğu döneme yazılır. Buna tahakkuk esası denir.","Aralık kirası Ocak'ta ödenmesine rağmen Aralık gideri yazılıyor. Bu hangi kavramın gereğidir?"),
 mc("Bir yıl FIFO, ertesi yıl kâr artsın diye başka bir stok yöntemi kullanılıyor. Hangi kavram ihlaldir?",["Dönemsellik","Tutarlılık","Maliyet esası","Tam açıklama"],1,"Tutarlılık. Politikalar birbirini izleyen dönemlerde değiştirilmeden uygulanmalıdır; amaç karşılaştırılabilirliktir.","Bir yıl FIFO, ertesi yıl kâr artsın diye başka bir stok yöntemi kullanılıyor. Hangi kavram ihlaldir?"),
 mc("Henüz gerçekleşmemiş muhtemel bir kâr gelir yazılıyor. Hangi kavram ihlaldir?",["İhtiyatlılık","Kişilik","Parayla ölçülme","Sosyal sorumluluk"],0,"İhtiyatlılık. Muhtemel gelir ve kârlar için gerçekleşme dönemine kadar hiçbir muhasebe işlemi yapılmaz; muhtemel gider için ise karşılık ayrılır.","Henüz gerçekleşmemiş muhtemel bir kâr gelir yazılıyor. Hangi kavram ihlaldir?"),
 mc("Demirbaşın piyasa değeri yükselse de alış maliyetiyle izleniyor. Hangi kavram?",["Maliyet esası","Önemlilik","Dönemsellik","Tam açıklama"],0,"Maliyet esası. Varlıklar edinme maliyetiyle kaydedilir. Para mevcudu ve alacaklar bu kuralın dışındadır.","Demirbaşın piyasa değeri yükselse de alış maliyetiyle izleniyor. Hangi kavram?"),
 mt("Kavramı anahtarla eşleştir",[["Süreklilik","Maliyet esasının temeli"],["Dönemsellik","Tahakkuk esası"],["İhtiyatlılık","Muhtemel gider için karşılık"],["Tutarlılık","Politikaların değiştirilmemesi"],["Özün önceliği","Biçimden çok öz"],["Kişilik","İşletme sahibinden ayrı"]],"Son olarak altı kavramı anahtar ifadesiyle eşleştir."),
 ak("Maliyet esasının temeli hangi kavramdır ve hangi kalemler dışındadır?","Temeli işletmenin sürekliliğidir. Para mevcudu ve alacaklar dışındadır.","Dur ve düşün: maliyet esasının temeli hangi kavram, ve hangi kalemler bu esasın dışında?","Maliyet esasının temeli işletmenin sürekliliğidir. Kapanmayacak bir işletmede varlıklar edinme maliyetiyle izlenir. Para mevcudu ve alacaklar bu esasın dışındadır.")
],

5:[
 ti("Bilanço I","An fotoğrafı","Bilanço, işletmenin belli bir tarihteki fotoğrafıdır. Gelir tablosu bir dönemin filmi, bilanço ise bir andır. Bu parçada eşitliği, aktif ile pasifi ve hesap gruplarını öğreneceksin."),
 eq("Temel bilanço eşitliği",["Varlıklar (Aktif)","Dönen + Duran varlıklar"],["Kaynaklar (Pasif)","KVYK + UVYK + Sermaye"],"Bilançonun sol tarafı aktif, yani varlıklar. Sağ tarafı pasif, yani kaynaklar. Varlıklar dönen ve duran varlıklardan oluşur. Kaynaklar kısa vadeli yabancı kaynaklar, uzun vadeli yabancı kaynaklar ve sermayedir. İki taraf her zaman birbirine eşittir.","Varlıklar − Borçlar = Sermaye"),
 df("Bilanço","İşletmenin belli bir tarihte sahip olduğu varlıklar ile bu varlıkların sağlandığı kaynakları bir düzen içinde gösteren mali tablo.","Bilanço, işletmenin belli bir tarihte sahip olduğu varlıkları ve bu varlıkların hangi kaynaklarla sağlandığını gösteren mali tablodur. Anahtar sözcük belli bir tarih.",["belli bir tarih","varlıklar","kaynaklar"]),
 cp("Sıralama kuralı",{t:"Aktif",items:["Likidite esası","En likitten en az likite","Hazır değerler, menkul kıymetler, ticari alacaklar, stoklar"]},{t:"Pasif",items:["Kaynağın sağlandığı yer","Geri ödeme süresi","KVYK, UVYK, özkaynak"]},"Aktif hesaplar likidite esasına göre, yani paraya dönüşme hızına göre en likitten en az likite sıralanır. Pasif hesaplar ise kaynağın sağlandığı yere ve geri ödeme süresine göre sıralanır."),
 rg("Hesap grupları",[["100-199","Dönen varlıklar"],["200-299","Duran varlıklar"],["300-399","Kısa vadeli yabancı kaynaklar"],["400-499","Uzun vadeli yabancı kaynaklar"],["500-599","Özkaynaklar"]],"Beş aralığı ezberle. Yüzlü hesaplar dönen varlık, ikiyüzlü duran varlık, üçyüzlü kısa vadeli yabancı kaynak, dörtyüzlü uzun vadeli yabancı kaynak, beşyüzlü özkaynak."),
 tb("Düzenleme biçimleri",["Ölçüt","Tür","Özellik"],[["Biçim","Hesap tipi","Aktif solda, pasif sağda, yan yana"],["Biçim","Rapor tipi","Alt alta; çok yıllı karşılaştırma; analize uygun"],["Kapsam","Özet bilanço","Yalnız grup tutarları"],["Kapsam","Ayrıntılı bilanço","Gruplar ve hesap kalemleri"]],"Bilanço biçim ve kapsam olarak ikişer türe ayrılır. Hesap tipinde aktif ve pasif yan yana yazılır. Rapor tipinde alt alta yazılır ve birden çok yılı yan yana göstermeye elverişli olduğu için analize uygundur. Özet bilanço yalnız grup tutarlarını, ayrıntılı bilanço grupların içindeki kalemleri de gösterir."),
 mc("Vadesi 14 ay olan alacak senedi hangi grupta yer alır?",["Dönen varlıklar","Duran varlıklar","Kısa vadeli yabancı kaynaklar","Özkaynaklar"],1,"Duran varlıklar. Vadesi bir yıldan uzun alacaklar duran varlıktır. Ayrıca alacak her zaman varlıktır, yabancı kaynak olamaz.","Vadesi 14 ay olan alacak senedi hangi grupta yer alır?"),
 mc("Alınan avanslar ve gelecek aylara ait gelirler hangi gruptadır?",["Dönen varlıklar","Uzun vadeli yabancı kaynaklar","Kısa vadeli yabancı kaynaklar","Özkaynaklar"],2,"Kısa vadeli yabancı kaynaklar. İkisi de bir yıl içinde karşılığı verilecek yükümlülüklerdir.","Alınan avanslar ve gelecek aylara ait gelirler hangi gruptadır?"),
 li("Bilanço nasıl düzenlenir?",["Her hesabı aktif ya da pasif olarak sınıfla","Aktifi dönen ve duran diye ayır","Pasifi KVYK, UVYK ve özkaynak diye ayır","Likidite ve vadeye göre sırala","İki tarafı topla","Fark dönem kârı ya da zararıdır"],"Bilançoyu altı adımda düzenlersin. Önce her hesabı aktif ya da pasif olarak sınıfla. Aktifi dönen ve duran diye, pasifi kısa vadeli, uzun vadeli ve özkaynak diye ayır. Sonra aktifi likiditeye, pasifi vadeye göre sırala. İki tarafı topla. Eşit değilse fark dönem kârı ya da zararıdır."),
 ak("Bilanço eşitliğini üç farklı biçimde yaz.","Aktif eşittir pasif. Varlıklar eşittir kaynaklar. Dönen artı duran varlıklar eşittir KVYK artı UVYK artı sermaye.","Bilanço eşitliğini üç farklı biçimde söyle. Hazır olunca cevabı göster.","Aktif eşittir pasif. Varlıklar eşittir kaynaklar. Dönen artı duran varlıklar eşittir kısa vadeli artı uzun vadeli yabancı kaynaklar artı sermaye. Varlıklar eksi borçlar da sermayeyi verir.")
],

6:[
 ti("Bilanço II","Finansman ve TMS","Uzun ömürlü varlık, uzun vadeli kaynakla finanse edilir. Bu parçada finansman kurallarını, özkaynağın iç dağılımını ve Türkiye Muhasebe Standartlarına göre bilançoyu öğreneceksin."),
 eq("Finansman dengesi",["Duran varlıklar"],["Özkaynaklar","Uzun vadeli yabancı kaynaklar"],"Duran varlıkların esas finansman yeri özkaynaklardır. Özkaynaklar yetmezse uzun vadeli yabancı kaynaklar da kullanılır. Kısa vadeli yabancı kaynaklar duran varlık finansmanına katılmamalıdır.","KVYK ile duran varlık = net çalışma sermayesi noksanı"),
 df("Net çalışma sermayesi","Dönen varlıklar eksi kısa vadeli yabancı kaynaklar. Kısa vadeli borç, dönen varlıktan büyükse noksan oluşur.","Net çalışma sermayesi, dönen varlıklar eksi kısa vadeli yabancı kaynaklardır. Kısa vadeli borçla duran varlık alırsan net çalışma sermayesi azalır; duran varlıklar özkaynak ve uzun vadeli borç toplamını aşarsa kısa vadeli borç dönen varlıklardan büyük çıkar ve noksan oluşur.",["dönen − KVYK","noksan"]),
 cp("Kaynak politikası",{t:"Özkaynak ağırlıklı",items:["Alacaklılar için nispeten güvenli","Varlıklar üzerinde ortak hakkı fazla"]},{t:"Yabancı kaynak ağırlıklı",items:["Riski yüksek","Amaç: daha az özkaynakla yüksek kârlılık, yüksek hisse başına kâr","Riskler: yeni kaynak bulunamaması, yüksek faiz gideri"]},"Özkaynak ağırlıklı işletmeler alacaklılar için nispeten güvenlidir. Yabancı kaynak ağırlıklı işletmelerin riski yüksektir; borçla finansmanın amacı daha az özkaynakla yüksek kârlılık ve yüksek hisse başına kâr elde etmektir. Riskleri arasında yeni kaynak bulunamaması ve yüksek faiz gideri var."),
 tb("Özkaynağın ideal sırası",["Sıra","Kalem"],[["1","Otofinansman: kâr yedekleri, geçmiş yıllar kârları, dönem net kârı"],["2","Ödenmiş sermaye"],["3","Sermaye yedekleri"],["Son","Zarar kalemleri: hiç olmaması ya da en sonda olması"]],"Özkaynağın içinde ideal büyüklük sırası şöyle: birinci sırada otofinansman, yani kâr yedekleri, geçmiş yıllar kârları ve dönem net kârı. İkinci sırada ödenmiş sermaye. Üçüncü sırada sermaye yedekleri. Zarar kalemlerinin hiç olmaması, varsa en sonda yer alması beklenir."),
 li("TMS'ye göre bilanço",["Adı: finansal durum tablosu","Standart format yok","Asgari kalemler tanımlı: maddi duran varlıklar, stoklar, nakit ve nakit benzerleri, finansal borçlar ...","Sıra ve biçim işletmeye bırakılmış"],"Türkiye Muhasebe Standartlarında bilançonun adı finansal durum tablosudur. Standart bir format verilmemiştir. Standart yalnızca tabloda en az gösterilmesi gereken hesap gruplarını sayar; maddi duran varlıklar, stoklar, nakit ve nakit benzerleri, finansal borçlar gibi. Sıra ve biçim işletmeye bırakılmıştır."),
 mc("Kısa vadeli borçla duran varlık finanse edilirse ne olur?",["Net çalışma sermayesi fazlası","Net çalışma sermayesi noksanı","Otofinansman artar","Aktif pasiften büyük çıkar"],1,"Net çalışma sermayesi noksanı. Kısa vadeli borç dönen varlıkları aşar ve ödeme güçlüğü doğar. Aktif ile pasif ise her zaman eşit kalır.","Kısa vadeli borçla duran varlık finanse edilirse ne olur?"),
 ak("Özkaynağın ideal iç sırasını söyle.","Otofinansman, ödenmiş sermaye, sermaye yedekleri; zarar kalemleri en sonda ya da hiç yok.","Özkaynağın iç sıralamasını kendi kendine söyle.","Otofinansman birinci, ödenmiş sermaye ikinci, sermaye yedekleri üçüncü sırada; zarar kalemleri en sonda ya da hiç yok.")
],

7:[
 ti("Gelir Tablosu","Kâr kademe kademe","Gelir tablosu, belli bir dönemde elde edilen tüm gelirlerle aynı dönemde katlanılan tüm giderleri gösterir. Kâr tek parça değil; adım adım kademelenir. Bu kademeleri sırayla bilmek, hesaplama sorularının anahtarı."),
 fl("Kâr kademeleri",["Brüt satışlar","Satış indirimleri (−)","Net satışlar","Satışların maliyeti (−)","Brüt satış kârı","Faaliyet giderleri (−)","Faaliyet kârı","Diğer gelir (+) gider (−) finansman gideri (−)","Olağan kâr","Olağan dışı (+/−)","Dönem kârı","Vergi karşılığı (−)","Dönem net kârı"],"Önce brüt satışlardan satış indirimlerini çıkarıp net satışları bulursun. Net satışlardan satışların maliyetini çıkarınca brüt satış kârı gelir. Oradan faaliyet giderlerini çıkarınca faaliyet kârı. Diğer faaliyet gelirlerini eklersin, diğer giderleri ve finansman giderlerini çıkarırsın: olağan kâr. Olağan dışı gelir ve giderleri işlersin: dönem kârı. Vergi karşılığını düşünce de dönem net kârı elde edilir.",true),
 df("Gelir ve gider","Gelir: özkaynakları artıran değer girişleri. Gider: özkaynakları azaltan değer çıkışları. Sermaye artırımı gelir değil, temettü ve sermaye azaltımı gider değildir.","Gelir, özkaynakları artıran değer girişidir ama ortakların sermaye artırımı gelir sayılmaz. Gider, özkaynakları azaltan değer çıkışıdır ama temettü ödemesi ve sermaye azaltımı gider sayılmaz. Bu iki istisna sınavda sık sorulur.",["özkaynak artışı","özkaynak azalışı","istisna: sermaye, temettü"]),
 tb("Sayısal örnek",["Kalem","TL"],[["Brüt satışlar","600.000"],["− İadeler ve iskontolar","30.000"],["Net satışlar","570.000"],["− Satışların maliyeti","380.000"],["Brüt satış kârı","190.000"],["− Faaliyet giderleri","90.000"],["Faaliyet kârı","100.000"],["+15.000 −5.000 −20.000","−10.000"],["Olağan kâr","90.000"]],"Bir örnek yapalım. Brüt satış altıyüz bin, iade ve iskonto toplam otuz bin: net satış beşyüz yetmiş bin. Maliyet üçyüz seksen bin: brüt kâr yüz doksan bin. Faaliyet gideri doksan bin: faaliyet kârı yüz bin. On beş bin diğer gelir ekle, beş bin diğer gider ve yirmi bin finansman gideri çıkar: olağan kâr doksan bin."),
 li("TMS kapsamlı gelir tablosu",["Sürdürülen faaliyetler","Durdurulan faaliyetler","Diğer kapsamlı gelirler: yeniden değerleme farkları, kur dönüştürme farkları, menkul kıymet ve türev kazanç-kayıpları","Kapsamlı kâr = dönem net kârı ± diğer gelir ve giderler"],"Türkiye Muhasebe Standartlarında gelir tablosunun adı kapsamlı gelir tablosudur ve üç bölümden oluşur: sürdürülen faaliyetler, durdurulan faaliyetler ve diğer kapsamlı gelirler. Kapsamlı kâr, dönem net kârına diğer kapsamlı gelir ve giderlerin eklenip çıkarılmasıyla bulunur."),
 mc("Brüt satış kârı nasıl hesaplanır?",["Brüt satışlar eksi faaliyet giderleri","Net satışlar eksi satışların maliyeti","Net satışlar eksi faaliyet giderleri","Brüt satışlar eksi satışların maliyeti"],1,"Net satışlar eksi satışların maliyeti. Tuzak: brüt satış değil net satış kullanılır ve faaliyet giderleri bu aşamada çıkmaz.","Brüt satış kârı nasıl hesaplanır?"),
 mc("Borsa İstanbul şirketleri için ara faaliyet dönemi kaç aydır?",["1 ay","3 ay","6 ay","9 ay"],1,"Üç ay. Normal dönem bir yıl, 1 Ocak ile 31 Aralık arasıdır.","Borsa İstanbul şirketleri için ara faaliyet dönemi kaç aydır?"),
 ak("Kâr kademelerini sırayla say.","Net satışlar, brüt kâr, faaliyet kârı, olağan kâr, dönem kârı, dönem net kârı.","Kâr kademelerini baştan sona kendi kendine say.","Net satışlar, brüt satış kârı, faaliyet kârı, olağan kâr, dönem kârı ve dönem net kârı.")
],

8:[
 ti("Eşitlik ve İşlemler","Her olay eşitliği korur","Her olay temel muhasebe eşitliğini bozmadan değiştirir. Bilançoyu bir film gibi izleyeceksin: her işlemde iki taraf da değişir ve eşitlik yeniden kurulur."),
 tb("Dört etki türü",["Tür","Toplamlar","Örnek"],[["Aktif ↔ aktif","Değişmez","Peşin demirbaş, bankaya yatırma, alacak tahsili"],["Pasif ↔ pasif","Değişmez","Satıcı borcunu senede bağlama"],["Aktif ↑ pasif ↑","İkisi artar","Vadeli mal alımı, sermaye koyma, kredi çekme"],["Aktif ↓ pasif ↓","İkisi azalır","Borç ödeme"]],"Bir işlem eşitliği dört şekilde etkiler. Aktif içinde yer değişirse toplam değişmez, örneğin peşin demirbaş alımı. Pasif içinde yer değişirse yine değişmez, örneğin satıcı borcunu senede bağlamak. Aktif ve pasif birlikte artabilir, örneğin vadeli mal alımı. Birlikte azalabilir, örneğin borç ödemesi."),
 tb("Çelik Ticaret: son durum",["Kalem","TL"],[["Kasa","60.000"],["Alıcılar","18.000"],["Ticari mal","20.000"],["Demirbaş","20.000"],["Aktif toplamı","118.000"],["Satıcılar","10.000"],["Sermaye","100.000"],["Dönem kârı","8.000"],["Pasif toplamı","118.000"]],"Hocanın Çelik Ticaret örneğinde yüz bin lira sermayeyle başlanır, yirmi bin liralık demirbaş alınır, elli bin liralık malın yarısı peşin alınır, satıcıya on beş bin ödenir. Sonra maliyeti otuz bin olan mal otuz sekiz bine satılır. Sonuçta aktif yüz on sekiz bin, pasif de satıcılar, sermaye ve sekiz bin liralık kârla yüz on sekiz bindir. Kâr, satış fiyatı eksi maliyettir."),
 mc("Maliyeti 40 bin lira olan mal 55 bin liraya peşin satılırsa aktif toplamı ne kadar değişir?",["55 bin artar","40 bin azalır","15 bin artar","Değişmez"],2,"On beş bin artar. Kasa elli beş bin artar, ticari mal kırk bin azalır; aradaki on beş bin lira kârdır ve pasifte de aynı kadar artış olur.","Maliyeti 40 bin lira olan mal 55 bin liraya peşin satılırsa aktif toplamı ne kadar değişir?"),
 mc("Satıcı borcunun borç senedine bağlanması eşitliği nasıl etkiler?",["Aktif ve pasif artar","Aktif içinde yer değişir","Pasif içinde yer değişir","Aktif ve pasif azalır"],2,"Pasif içinde yer değişir. Satıcılar azalır, borç senetleri artar. Toplam pasif değişmez.","Satıcı borcunun borç senedine bağlanması eşitliği nasıl etkiler?"),
 tb("Hocanın dört hesaplama sorusu",["Veriler","Sonuç"],[["Dönen 35k, YK 40k, pasif 80k","Duran 45k, özkaynak 40k"],["Sermaye 65k, borç 33k, aktif 100k","2k kâr"],["YK 85k, sermaye 115k, aktif 200k, dönen 125k","Duran 75k; kâr da zarar da yok"],["Dönen 68k, duran 82k, KVYK 45k, UVYK 17k, sermaye 95k","Özkaynak 88k; 7k zarar"]],"Hocanın dört sorusunu çözelim. Birincide pasif toplamı seksen bin olduğundan aktif de seksen bindir. Dönen otuz beş bin olduğuna göre duran kırk beş bin olur. Yabancı kaynak kırk bin olduğundan özkaynak da kırk bindir. Her soruda önce aktif toplamını bul, sonra yabancı kaynakları çıkar, özkaynağı bul. Özkaynak sermayeden büyükse kâr, küçükse zarardır."),
 ak("Aktif 150 bin, KVYK 40 bin, UVYK 30 bin, sermaye 70 bin ise dönem sonucu nedir?","Özkaynak 80 bin; sermaye 70 bin olduğundan 10 bin lira kâr.","Hesapla: aktif yüz elli bin, kısa vadeli yabancı kaynak kırk bin, uzun vadeli otuz bin, sermaye yetmiş bin. Dönem sonucu nedir?","Yabancı kaynaklar yetmiş bin. Özkaynak yüz elli eksi yetmiş, seksen bin. Sermaye yetmiş bin olduğundan sonuç on bin lira kârdır.")
],

9:[
 ti("Hesaplar ve Çift Taraflı Kayıt","Borç sol, alacak sağ","Borç ve alacak, günlük dildeki anlamlarıyla ilgisiz iki etikettir: borç sol taraf, alacak sağ taraftır. Kuralları ezberlemeyeceksin; eşitlikten türeteceksin."),
 eq("Kuralın kaynağı",["Aktif solda","artışı BORÇ (sol)"],["Pasif sağda","artışı ALACAK (sağ)"],"Bilançoda aktif solda, pasif sağdadır. Bu yüzden aktif hesapların artışı sol tarafa, yani borca yazılır. Pasif hesapların artışı sağ tarafa, yani alacağa yazılır. Her şey bu iki cümleden türer.","Gelir özkaynağı artırır → alacak. Gider azaltır → borç."),
 tb("Dört grup",["Grup","Artış","Azalış","Normal bakiye"],[["Aktif","Borç","Alacak","Borç"],["Pasif","Alacak","Borç","Alacak"],["Gider","Borç","Alacak","Borç"],["Gelir","Alacak","Borç","Alacak"]],"İşte tam tablo. Aktif hesaplarda artış borç, azalış alacak. Pasif hesaplarda artış alacak, azalış borç. Gider hesaplarında artış borç. Gelir hesaplarında artış alacak. Gelir özkaynağı artırır, özkaynak pasiftir, o yüzden gelir alacağa yazılır. Gider özkaynağı azaltır, o yüzden borca yazılır."),
 tt("Kasa hesabı",[["B","Nakit sermaye",60000],["A","Peşin demirbaş",8000],["A","Peşin mal alımı",30000],["B","Satıştan peşin tahsilat",4000],["A","Bankaya yatırma",12000],["B","Alıcılardan tahsilat",10000],["A","Genel yönetim gideri",3000]],"Kasa hesabını izleyelim. Sermaye girince borç tarafına altmış bin yazılır. Demirbaş, mal alımı, bankaya yatırma ve gider ödemeleri alacak tarafına gider. Satıştan peşin gelen dört bin ve alıcılardan gelen on bin borca eklenir. Sonunda borç toplamı yetmiş dört bin, alacak toplamı elli üç bin; fark yirmi bir bin lira borç bakiyesidir.","Kasa asla alacak bakiyesi vermez."),
 li("Bakiye",["Borç toplamı eşittir alacak toplamı: kapalı hesap","Borç toplamı büyük: borç bakiyesi","Alacak toplamı büyük: alacak bakiyesi","Aktifler borç, pasifler alacak bakiyesi verir"],"Bakiye, büyük toplam eksi küçük toplamdır ve büyük olan tarafa yazılır. Toplamlar eşitse hesap kapalıdır. Aktif hesaplar normalde borç bakiyesi, pasif hesaplar alacak bakiyesi verir. Kasa gibi bir aktif hesap alacak bakiyesi veremez; olmayan para ödenemez."),
 mc("Gider hesaplarının artışı hangi tarafa yazılır?",["Alacak","Borç","Her iki tarafa","Bakiye hanesine"],1,"Borç. Gider özkaynağı azaltır, özkaynak pasiftir, pasifte azalış borçtur.","Gider hesaplarının artışı hangi tarafa yazılır?"),
 mc("Satıcılar hesabında alacak bakiyesi 40 bin; 15 bin vadeli alım, 25 bin ödeme olursa bakiye ne olur?",["30 bin borç","30 bin alacak","50 bin alacak","80 bin alacak"],1,"Otuz bin alacak. Alacak kırk artı on beş eşittir elli beş; ödeme borç yirmi beş; fark otuz bin alacak bakiyesi.","Satıcılar hesabında alacak bakiyesi 40 bin; 15 bin vadeli alım, 25 bin ödeme olursa bakiye ne olur?"),
 mc("Hangi hesap alacak bakiyesi verir?",["Kasa","Alıcılar","Genel yönetim giderleri","Yurt içi satışlar"],3,"Yurt içi satışlar. Gelir hesaplarının artışı alacaktır ve normal bakiyesi alacaktır.","Hangi hesap alacak bakiyesi verir?"),
 ak("Her olayda sorulacak üç soru nedir?","Hangi hesaplar etkilendi? Hangi türden? Artış mı azalış mı, bu yüzden borç mu alacak mı?","Her olayda kendine hangi üç soruyu soracaksın?","Birincisi, hangi hesaplar etkilendi. İkincisi, bu hesaplar aktif mi, pasif mi, gelir mi, gider mi. Üçüncüsü, artış mı azalış mı; tabloya göre borç mu alacak mı. Sonunda borç toplamı alacak toplamına eşit olmalı.")
],

10:[
 ti("Yevmiye, Defter, Fişler","Kaydın yolculuğu","Olay önce yevmiye defterine tarih sırasıyla kaydedilir, sonra büyük defterde hesaplara aktarılır. Bu parçada yazım kuralını, madde türlerini, belgeleri ve fişleri öğreneceksin."),
 tb("Yevmiye maddesi yazımı",["Hesap","Borç","Alacak"],[["Borçlu hesap (satır başından)","tutar",""],["    Alacaklı hesap (içeriden)","","tutar"],["Tarih ve açıklama","",""]],"Yevmiye maddesinde borçlu hesaplar önce ve satır başından yazılır. Alacaklı hesaplar sonra ve biraz içeriden yazılır. Tutarlar da karşılarındaki sütuna konur. Altına tarih ve açıklama eklenir."),
 mt("Maddeyi türüyle eşleştir",[["Kasa / Sermaye","Basit madde"],["Ticari Mallar / Kasa + Satıcılar","Bileşik madde"],["Kasa + Bankalar / Alıcılar + Alacak Senetleri","Karma madde"],["Kasa + Alıcılar / Yurt İçi Satışlar","Bileşik madde"]],"Basit maddede borçta ve alacakta birer hesap vardır. Bileşik maddede bir hesabın karşısında birden fazla hesap vardır. Karma maddede iki tarafta da birden fazla hesap vardır. Şimdi eşleştir."),
 tb("Fişler",["Fiş","Ne zaman","Kasa"],[["Kasa tahsil","Kasaya para girişi","Borçlu"],["Kasa tediye","Kasadan para çıkışı","Alacaklı"],["Mahsup","Nakit olmayan olay","Kullanılmaz"]],"Üç fiş var. Kasaya para girişinde tahsil fişi; kasa borçludur. Kasadan para çıkışında tediye fişi; kasa alacaklıdır. Kasa ile ilgisi olmayan olaylarda mahsup fişi düzenlenir; kasa hesabı kullanılmaz."),
 mc("Bankaya nakit yatırılması için hangi fiş düzenlenir?",["Kasa tahsil fişi","Kasa tediye fişi","Mahsup fişi","Gider pusulası"],1,"Kasa tediye fişi. Bankalar borçlanır, kasa alacaklanır; kasa alacaklı olduğunda tediye fişi düzenlenir.","Bankaya nakit yatırılması için hangi fiş düzenlenir?"),
 mc("Vadeli mal alımı için hangi fiş düzenlenir?",["Kasa tahsil fişi","Kasa tediye fişi","Mahsup fişi","Fiş düzenlenmez"],2,"Mahsup fişi. Kasaya para girmiyor, çıkmıyor.","Vadeli mal alımı için hangi fiş düzenlenir?"),
 mc("Aşağıdakilerden hangisi belgedir, fiş değildir?",["Kasa tediye fişi","Mahsup fişi","Gider pusulası","Kasa tahsil fişi"],2,"Gider pusulası. Belgeler: fatura, perakende satış vesikası, gider pusulası, müstahsil makbuzu, serbest meslek makbuzu ve ücret bordrosu.","Aşağıdakilerden hangisi belgedir, fiş değildir?"),
 ak("Fiş seçme kuralını söyle.","Kasa girerse tahsil, çıkarsa tediye, hiç yoksa mahsup.","Üç fişi tek cümleyle ayırt et.","Kasa girerse tahsil, kasa çıkarsa tediye, kasa hiç yoksa mahsup fişi düzenlenir.")
],

11:[
 ti("Mizan ve Dönemsel Süreç","Kayıtların sağlaması","Mizan, kayıtların doğru işlenip işlenmediğini kontrol eden tablodur. Bu parçada iki kontrolü, üç mizan türünü ve dönemsel sürecin on adımını öğreneceksin."),
 tb("Mizan: AZ İşletmesi",["Hesap","Borç tutar","Alacak tutar","Kalan borç","Kalan alacak"],[["Kasa","74.000","53.000","21.000",""],["Bankalar","12.000","5.000","7.000",""],["Alıcılar","31.000","10.000","21.000",""],["Ticari Mallar","45.000","26.000","19.000",""],["Demirbaşlar","8.000","","8.000",""],["Satıcılar","5.000","15.000","","10.000"],["Sermaye","","60.000","","60.000"],["Yurt İçi Satışlar","","35.000","","35.000"],["STMM","26.000","","26.000",""],["Gen. Yön. Giderleri","3.000","","3.000",""],["TOPLAM","204.000","204.000","105.000","105.000"]],"Mizanda her hesabın borç ve alacak toplamı ve bakiyesi yer alır. İki kontrol vardır: tutar sütunlarının borç ve alacak toplamı eşit olmalı, kalan sütunlarının da eşit olmalı. Bu örnekte tutar toplamı iki yüz dört bin, kalan toplamı yüz beş bindir."),
 cp("Mizan ve bilanço",{t:"Mizan",items:["Tüm hesaplar","Gelir ve gider hesapları dahil","AZ: kalan toplamı 105.000"]},{t:"Bilanço",items:["Varlık ve kaynak hesapları","Gelir-gider yerine net kâr","AZ: toplam 76.000"]},"Mizan ile bilançoyu karıştırma. Mizan gelir ve gider hesaplarını ayrı ayrı içerir. Bilançoya yalnızca varlık ve kaynaklar girer, gelir ve giderin farkı olan net kâr pasifte yer alır. Bu yüzden geçici mizanın kalan toplamı bilanço toplamından büyüktür."),
 tb("Üç mizan",["Mizan","Zaman"],[["Aylık geçici mizan","Her ay sonu"],["Genel geçici mizan","Aralık ayında"],["Kesin mizan","Envanter ve gelir-gider kapatmasından sonra"]],"Aylık geçici mizan her ay sonunda düzenlenir. Genel geçici mizan aralık ayında düzenlenir. Kesin mizan ise envanter işlemlerinden ve gelir ile gider hesapları kapatıldıktan sonra düzenlenir."),

 li("Algoritmalar 1-5",["Bilinmeyeni bulma: aktif toplamı, pasif toplamı, çek","Dönem kârı = özkaynak − sermaye; özkaynak = aktif − yabancı kaynak","Bakiye: büyükten küçüğü çıkar, fark büyük taraftadır","Yevmiye: hesap, tür, artış-azalış, borç = alacak mı","Mizan: tutar toplamı = madde toplamı; kalan = aktif + giderler"],"Birinci algoritma bilinmeyeni bulmak: aktif toplamını yaz, pasif toplamını yaz, eşitle. İkincisi dönem sonucu: özkaynak eksi sermaye. Üçüncüsü bakiye: büyükten küçüğü çıkar. Dördüncüsü yevmiye maddesi: hesapları sırala, türünü bul, artış mı azalış mı diye bak, sonra borç alacak dengesini kontrol et. Beşincisi mizan: tutar toplamı madde tutarları toplamıdır, kalan toplamı aktif artı gider hesaplarıdır."),
 li("Algoritmalar 6-10",["Gelir tablosu: net satış, brüt kâr, faaliyet kârı, olağan kâr, dönem kârı, net kâr","Bilanço düzenleme: sınıfla, yerleştir, topla, farkı kâr yap","İşlem etkisi: aktif-aktif, pasif-pasif, ikisi artar, ikisi azalır","Fiş: kasa girerse tahsil, çıkarsa tediye, yoksa mahsup","Kavram: anahtar kelimeyi bul; değildir köklerinde doğruları ele"],"Altıncı algoritma gelir tablosu kademeleri. Yedincisi bilanço düzenleme. Sekizincisi işlemin etkisi. Dokuzuncusu fiş türü. Onuncusu kavram soruları: anahtar kelimeyi bul; değildir ve yanlıştır köklerinde önce doğru olanları ele."),
 li("Çeldirici tipleri",["Ters çevirme","Ara aşamayı cevap yapma","Eksik kalem: maliyeti unutma","Benzer kavram","Fazla genelleme","Doğru ama soruya cevap değil"],"Çeldiriciler genelde altı tiptir. Ters çevirme, ara aşamayı cevap olarak sunma, eksik kalem bırakma, benzer kavram, fazla genelleme ve doğru ama soruya cevap olmayan şık. Soru kökünü iki kez oku."),

 ak("Sınavda zaman yönetimi için üç kural söyle.","Kolayları önce çöz, hesaplamayı ikinci tura bırak, değildir köklerini daire içine al, emin değilsen iki şıkkı ele.","Sınavda zamanı nasıl yöneteceksin? Kendi kurallarını söyle.","Kolay soruları önce çöz. Hesaplamaları ikinci tura bırak ve ara sonuçları yaz. Değildir ve yanlıştır köklerini işaretle. Emin değilsen en az iki şıkkı ele ve son beş dakikayı boş bırakma.")

/* Seslendirilen metinleri sesli okunuşa çevir: sayılar yazıyla, kısaltmalar açık adıyla */
var ONES=["","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz"],TENS=["","on","yirmi","otuz","kırk","elli","altmış","yetmiş","seksen","doksan"];
function num(n){
  if(n===0)return "sıfır";
  var out=[];
  if(n>=1000){var th=Math.floor(n/1000);out.push((th===1?"":num(th)+" ")+"bin");n%=1000;}
  if(n>=100){var h=Math.floor(n/100);out.push((h===1?"":ONES[h]+" ")+"yüz");n%=100;}
  if(n>=10){out.push(TENS[Math.floor(n/10)]);n%=10;}
  if(n>0)out.push(ONES[n]);
  return out.join(" ");
}
function spoken(t){return t.replace(/FIFO/g,"ilk giren ilk çıkar yöntemi").replace(/\bKDV\b/g,"katma değer vergisi").replace(/\d+/g,function(m){return num(parseInt(m,10));});}
window.spoken=spoken;
Object.keys(window.SCENES).forEach(function(k){window.SCENES[k].forEach(function(s){["say","say2","why"].forEach(function(f){if(s[f])s[f]=spoken(s[f]);});});});
})();

3:["Bilanço, banka hesabının bugünkü bakiyesi gibidir: bir andır.","Gelir tablosu, bir aylık gelir ve harcama raporu gibidir: bir dönemdir.","Aynı olaya iki ad: sınavda “bilanço” ile “finansal durum tablosu” aynı şeydir."],
4:["Kişilik: kantin kasasından kendi kahveni alırsan işletme parasıyla kendi paranı karıştırmış olursun.","Dönemsellik: Aralık elektrik faturası Ocak’ta gelse de Aralık’ın giderdir.","Maliyet esası: dükkânı iki milyona aldın; şimdi daha çok etse de defterde iki milyon yazar.","İhtiyatlılık: arkadaşının ödemeyeceğinden şüphelendiğin alacak için hemen karşılık ayırırsın; ama piyango kazanma ihtimalini kazanmadan gelir saymazsın.","Tutarlılık: her ay harcamanı başka usulle hesaplarsan ayları kıyaslayamazsın."],
5:["Araban 800 bin lira, kredi borcun 500 bin lira ise arabadaki payın 300 bin liradır: varlık eksi borç, özkaynak.","Cüzdanın ve vadesiz hesabın dönen varlıktır; evin ve araban duran varlıktır.","Kredi kartı ekstren bir yıldan kısa vadeli borçtur: kısa vadeli yabancı kaynak."],
6:["Ev, uzun vadeli konut kredisiyle alınır. Ev için kredi kartı borcu kullanırsan her ay ödeme duvarına çarparsın: net çalışma sermayesi noksanı.","Kısa vadeli ihtiyacı kısa vadeli, uzun vadeli yatırımı uzun vadeli kaynakla finanse etmek akıllıca olandır.","Çok borçla çalışmak daha çok kazandırabilir, ama borçlu işletme faiz yüzünden daha kırılgandır."],
7:["Kafede 100 liralık satış yaptın, malzemesi 40 lira: brüt kâr 60 liradır.","Kira ve maaş 30 lira: faaliyet kârı 30. Kredi faizi 5 lira: olağan kâr 25. Vergiden sonra elinde net kâr kalır.","Ortak kafeye para koyarsa bu gelir değildir, kâr da değildir: sermayedir."],
8:["Kredi çekip araba alırsan hem varlığın hem borcun artar: iki taraf birlikte büyür.","Nakitle araba alırsan banka hesabın azalır, araba artar: toplam değişmez.","Bir şeyi maliyetinin üstünde satarsan aradaki fark kârdır: bilançodaki payın büyür."],
9:["Bankanın ekstresinde sana yatan para “alacak” yazar; senin kasanda aynı para “borç”tur. Aynı olayı iki taraf ters yazar.","Borç ve alacak “kimin kime borcu” değildir; sol ve sağ taraftır.","Kasada olmayan parayı ödeyemezsin: kasa alacak bakiyesi veremez."],
10:["Günlük harcama defterin yevmiyedir: olayları tarih sırasıyla yazarsın.","Ay sonunda harcamaları yemek, ulaşım, kira sayfalarına aktarırsan büyük defteri yapmış olursun.","Kasadan para çıkıyorsa tediye, giriyorsa tahsil. Kredi kartıyla alışverişte kasadan para çıkmaz: mahsuptur."],
11:["Ay sonunda defterindeki bakiyeyi banka ekstresiyle karşılaştırırsın; tutmuyorsa hata aranır. Mizan bu kontroldür.","Eşit çıkması kayıtların doğru olduğunu kanıtlamaz: yanlış kategoriye yazdığın harcama toplamı bozmaz.","Yıl sonunda önce kontrol edersin, sonra kapanış yaparsın: yıllık bütçeni kapatmak gibi."],
12:["Bakkalda bir satışta iki şey olur: kasaya para girer, raftan ürün çıkar. Bu yüzden satış iki kayıttır.","Veresiye defteri alıcılar hesabıdır; senin veresiye borçlarının defteri de satıcılardır.","Senet, borcun kâğıda yazılmış hâlidir: sana verilen alacak senedi, senin verdiğin borç senedidir."],
13:["Kütüphane rafı gibi: kodu bilince hesabı hemen bulursun. Bir ile başlayan dönen, iki ile başlayan duran varlıktır.","Üç yüz kısa vadeli, dört yüz uzun vadeli kredi: kodun ilk rakamı borcun vadesini söyler.","İlk iki hane grubu, üç hane hesabı verir: on iki ticari alacaklar, yüz yirmi alıcılar."],
14:["Marketten aldığın üründeki KDV’yi sen ödersin; işletme ise ödediği KDV’yi sattığı mala yüklediği KDV’den mahsup eder.","Arabanın değeri yıllar içinde düşer; muhasebe bu yıpranmayı amortisman olarak her yıl gidere yazar.","İade, satışı geri almaktır: mal geri gelir, para geri gider."],
15:["Alışveriş bütçesi yaparken önce toplamı bulur, sonra eksiği çıkarırsın: bilinmeyeni bulmak aynı mantıktır.","Hesap makinesi gibi: adım adım ilerle, her adımı yaz.","Sınav zamanını bütçe gibi yönet: kolay sorular önce, hesaplamalar ikinci tur."],
16:["Bir sözleşmede tek kelime anlamı değiştirir; sınav sorusunda da öyle: “değildir” ve “yanlıştır” kelimelerini daire içine al.","Hata yaptığın soru, hata defterinde senin en değerli kaynağındır.","Sınavdan önce tuzak listesini yüksek sesle oku: kulağın da hatırlar."]
};

window.CATS = ["Kavramlar ve nitelikler","Muhasebe, işlevler, tablolar","Bilanço","Gelir tablosu","Eşitlik ve hesaplama","Hesap, yevmiye, fiş","Mizan ve süreç","Hesap planı ve kayıtlar"];

/* a: doğru şıkkın dizini (0=A). Şıklar uygulamada karıştırılır. */
window.QUIZ = [
{c:0,q:"Bir ticari işletme, 2025'te stok değerlemesinde bir yöntemi kullanmış; 2026'da yalnızca kârın yüksek görünmesi için yöntemi değiştirmiştir. Bu durum hangi muhasebe kavramının ihlalidir?",o:["Dönemsellik","Maliyet esası","Tutarlılık","Tam açıklama","İhtiyatlılık"],a:2,e:"Politikalar birbirini izleyen dönemlerde değiştirilmeden uygulanır; amaç karşılaştırılabilirliktir. Soru 'yöntemi değiştirme' diyor → tutarlılık. Dönemsellik gelir-gideri dönemlere ayırır, maliyet esası değerlemedir, ihtiyatlılık temkindir, tam açıklama tabloların yeterliliğidir."},
{c:0,q:"Aşağıdakilerden hangisi ihtiyatlılık kavramının bir sonucu DEĞİLDİR?",o:["Şüpheli alacaklar için karşılık ayrılması","Değeri düşen mallar için karşılık ayrılması","Hisse senedi değerlemesinde değer düşüklüğü karşılığı ayrılması","Kıdem tazminatı karşılığı ayrılması","Gerçekleşmesi muhtemel bir kârın, gerçekleşmeden önce gelir olarak kayda alınması"],a:4,e:"İhtiyatlılık, muhtemel gelir ve kârlar için gerçekleşme dönemine kadar hiçbir işlem yapılmamasını ister. E bunun tersini söylüyor. A-D slayttaki ihtiyatlılık örnekleridir."},
{c:0,q:"İşletme sahibi, çocuğunun özel okul ücretini işletme kasasından ödemiş ve bunu işletme gideri olarak kaydetmiştir. Hangi kavram en açık biçimde ihlal edilmiştir?",o:["Tarafsızlık ve belgelendirme","Kişilik","Önemlilik","Parayla ölçülme","Özün önceliği"],a:1,e:"İşletme, sahibinden ayrı bir kişiliğe sahiptir. Sahibin özel gideri işletme gideri olamaz. Tarafsızlık ve belgelendirme belge ve yöntem tarafsızlığıdır, sahip-işletme ayrımı değil."},
{c:0,q:"“İşletmenin faaliyetlerini bir süreye bağlı olmaksızın sürdüreceğini, sahip veya hissedarların yaşam süreleriyle bağlı olmadığını ifade eden; maliyet esasının da temelini oluşturan” kavram hangisidir?",o:["Dönemsellik","Tutarlılık","Sosyal sorumluluk","İşletmenin sürekliliği","Parayla ölçülme"],a:3,e:"Süreye bağlı olmama, sahibin ömründen bağımsızlık ve maliyet esasının temeli olma, sürekliliğin tanımıdır. Dönemsellik sürekliliğin sonucudur (ömrü dilimlemek); 'maliyet esasının temeli' ifadesi sürekliliğe aittir."},
{c:0,q:"Bir işlemin hukuki biçimi satış gibi görünmekle birlikte, ekonomik olarak işletmenin risk ve yararları hâlâ üstlendiği anlaşılmakta ve işlem buna göre kayda alınmaktadır. Bu uygulama hangi kavrama dayanır?",o:["Özün önceliği","Tam açıklama","İhtiyatlılık","Tarafsızlık ve belgelendirme","Önemlilik"],a:0,e:"İşlemlerin biçimlerinden çok özlerinin esas alınması özün önceliği kavramıdır. Tarafsızlık ve belgelendirme belge-yöntem; ihtiyatlılık gider-gelir temkinidir."},
{c:0,q:"Aralık ayına ait ofis kirası 5 Ocak'ta ödenmiş olmasına rağmen Aralık ayının gideri olarak kaydedilmiştir. Bu işlem hangi kavramın gereğidir?",o:["İşletmenin sürekliliği","Maliyet esası","Dönemsellik","Önemlilik","Tutarlılık"],a:2,e:"Gider, ödendiği değil ait olduğu döneme yazılır (tahakkuk esası). Bu dönemsellik kavramının gereğidir."},
{c:0,q:"Aşağıdaki kavram–açıklama eşleştirmelerinden hangisi YANLIŞTIR?",o:["Sosyal sorumluluk: Belli kişi ve grupların değil, tüm toplumun çıkarlarının gözetilmesi","Parayla ölçülme: Muhasebe işlemlerinin ulusal para cinsinden yürütülmesi","Tam açıklama: Mali tabloların karar vermeye yardımcı olacak ölçüde yeterli, açık ve anlaşılır olması","Maliyet esası: Para mevcudu ve alacaklar dâhil, tüm kalemlerin edinme maliyetiyle izlenmesi","Tarafsızlık ve belgelendirme: Kayıtların objektif belgelere dayandırılması"],a:3,e:"Maliyet esasında para mevcudu ve alacaklar HARİÇTİR (ve maliyeti belirlenemeyen diğer kalemler). 'Dâhil' ifadesi yanlış. Diğer şıklar slayt cümleleriyle uyumludur."},
{c:0,q:"TMS/TFRS Kavramsal Çerçeve'ye göre aşağıdakilerden hangisi faydalı finansal bilginin DESTEKLEYİCİ niteliksel özelliklerinden biri DEĞİLDİR?",o:["Karşılaştırılabilirlik","Doğrulanabilirlik","Zamanında sunum","Anlaşılabilirlik","İhtiyaca uygunluk"],a:4,e:"İhtiyaca uygunluk temel özelliktir. Destekleyiciler: karşılaştırılabilirlik, doğrulanabilirlik, zamanında sunum, anlaşılabilirlik."},
{c:0,q:"Finansal bilginin tahminlerde kullanılabilmesi ve teyit edici özellik taşıması hangi niteliksel özelliğin gereğidir?",o:["Gerçeğe uygun sunum","İhtiyaca uygunluk","Doğrulanabilirlik","Karşılaştırılabilirlik","Anlaşılabilirlik"],a:1,e:"Tahmin değeri ve teyit değeri ihtiyaca uygunluğun parçasıdır. Gerçeğe uygun sunum: tam, tarafsız, hatasız. Doğrulanabilirlik destekleyicidir."},
{c:1,q:"Muhasebenin işlevleri ile bu işlevlerin gerçekleştirildiği araçlar eşleştirilirken hangisi YANLIŞ yapılmıştır?",o:["Kaydetme – Yevmiye Defteri","Sınıflandırma – Defter-i Kebir","Raporlama – Temel mali tablolar","Analiz ve yorum – Finansal analiz teknikleri","Sınıflandırma – Yevmiye Defteri"],a:4,e:"Yevmiye kaydeder; sınıflandırma defter-i kebirde yapılır. E, aynı işlevi yevmiyeye vermiş."},
{c:1,q:"Tekdüzen Hesap Planı'na göre aşağıdakilerden hangisi ek mali tablolardan biri DEĞİLDİR?",o:["Fon akım tablosu","Nakit akım tablosu","Özkaynak değişim tablosu","Gelir tablosu","Kâr dağıtım tablosu"],a:3,e:"THP'de temel mali tablolar bilanço ve gelir tablosudur. Ek tablolar: fon akım, nakit akım, özkaynak değişim, satışların maliyeti, kâr dağıtım."},
{c:2,q:"Bilançolara ilişkin aşağıdaki ifadelerden hangisi DOĞRUDUR?",o:["Bilanço, işletmenin bir dönemdeki faaliyet sonuçlarını gösterir.","Hesap tipi bilançoda aktif ve pasif kalemler alt alta yazılır.","Rapor tipi bilanço, birden fazla yılın verilerini yan yana göstermeye elverişli olduğu için analiz amacıyla daha uygundur.","Özet bilanço, her hesap grubunda yer alan tüm hesap kalemlerini gösterir.","Pasifteki hesaplar, aktifte olduğu gibi likidite esasına göre sıralanır."],a:2,e:"A: bilanço bir andır, dönem sonucu gelir tablosunda. B: alt alta rapor tipidir. D: kalemleri ayrıntılı bilanço gösterir. E: pasif kaynak ve geri ödeme süresine göre sıralanır."},
{c:2,q:"Bilançonun aktifinde yer alan aşağıdaki kalemler, en likit olandan en az likit olana doğru nasıl sıralanır?",o:["Stoklar – Ticari alacaklar – Menkul kıymetler – Hazır değerler","Hazır değerler – Menkul kıymetler – Ticari alacaklar – Stoklar","Hazır değerler – Ticari alacaklar – Menkul kıymetler – Stoklar","Menkul kıymetler – Hazır değerler – Ticari alacaklar – Stoklar","Hazır değerler – Menkul kıymetler – Stoklar – Ticari alacaklar"],a:1,e:"Tablo 1.1 sırası: hazır değerler → menkul kıymetler → ticari alacaklar → stoklar. Stok, satılıp tahsil edilmeden paraya dönmediği için en az likit dönen varlıktır."},
{c:2,q:"Aşağıdaki sınıflandırmalardan hangisi YANLIŞTIR?",o:["Vadesi 8 ay olan ticari alacak – Dönen varlık","Vadesi 3 yıl olan banka kredisi – Uzun vadeli yabancı kaynak","Bir yıldan uzun süre kullanılmak üzere alınan demirbaş – Duran varlık","Vadesi 1 yıldan kısa alınan avanslar – Kısa vadeli yabancı kaynak","Gelecek aylara ait gelirler – Uzun vadeli yabancı kaynak"],a:4,e:"Gelecek aylara ait gelirler KVYK'dır (slayt 44). A (8 ay < 1 yıl), B (3 yıl > 1 yıl), C ve D doğrudur."},
{c:2,q:"Aşağıdaki hesap–grup eşleştirmelerinden hangisi DOĞRUDUR?",o:["120 Alıcılar – Duran varlıklar","255 Demirbaşlar – Dönen varlıklar","320 Satıcılar – Uzun vadeli yabancı kaynaklar","400 Banka Kredileri – Uzun vadeli yabancı kaynaklar","500 Sermaye – Kısa vadeli yabancı kaynaklar"],a:3,e:"400-499 UVYK. 120 Alıcılar dönen, 255 Demirbaşlar duran, 320 Satıcılar KVYK, 500 Sermaye özkaynak grubundadır."},
{c:2,q:"Bir işletmenin özkaynaklarının güven verici bir iç dağılımı için aşağıdakilerden hangisi beklenir?",o:["Otofinansman kalemlerinin tutarca en büyük payı alması","Sermaye yedeklerinin tutarca ilk sırada yer alması","Ödenmiş sermayenin tutarca en büyük pay alması","Dönem net zararı ve geçmiş yıllar zararlarının ikinci sırada yer alması","Geçmiş yıllar kârlarının hiç bulunmaması"],a:0,e:"İdeal sıra: otofinansman (kâr yedekleri, geçmiş yıllar kârları, dönem net kârı) > ödenmiş sermaye > sermaye yedekleri; zarar kalemleri hiç olmamalı ya da son sırada olmalı. E tuzaktır: geçmiş yıl kârları otofinansmandır."},
{c:2,q:"Bir işletmede kısa vadeli yabancı kaynaklar duran varlıkların finansmanında kullanılmış ve bunun sonucunda KVYK tutarı dönen varlıkları aşmıştır. Bu durum neye yol açar?",o:["Net çalışma sermayesi fazlasına","Otofinansman artışına","Net çalışma sermayesi noksanına","Aktif toplamının pasif toplamından büyük çıkmasına","Özkaynakların artmasına"],a:2,e:"Net çalışma sermayesi = dönen varlıklar − KVYK. KVYK dönen varlıklardan büyükse noksan oluşur. Aktif toplamı her zaman pasif toplamına eşittir."},
{c:2,q:"Yabancı kaynak ağırlıklı ve özkaynak ağırlıklı çalışan işletmeler karşılaştırıldığında hangisi DOĞRUDUR?",o:["Yabancı kaynak ağırlıklı işletmeler alacaklılar açısından daha güvenli sayılır.","Borçla finansmanın nedeni, daha az özkaynakla yüksek kârlılık ve yüksek hisse başına kâr elde etmektir.","Faiz giderleri özkaynak ağırlıklı işletmelerde daha yüksektir.","Özkaynak ağırlıklı işletmelerin riski daha yüksektir.","Yabancı kaynak ağırlıklı işletmeler yeni kaynak bulmakta hiç zorluk yaşamaz."],a:1,e:"Borçla finansman: daha az özkaynakla yüksek kârlılık ve yüksek hisse başına kâr. A ve D tersine; C'de faiz gideri yabancı kaynak ağırlıklı işletmede yüksektir; E'de yeni kaynak bulunamama riski vardır."},
{c:2,q:"Türkiye Muhasebe Standartları (TMS) kapsamındaki finansal tablolarla ilgili hangisi DOĞRUDUR?",o:["TMS, bilanço için tek tip (tekdüze) bir format zorunlu kılar.","Kapsamlı gelir tablosu iki bölümden oluşur.","Finansal durum tablosunda hesap gruplarının sırası standartla sabitlenmiştir.","Borsa İstanbul şirketleri için ara faaliyet dönemi 6 aydır.","Bilançonun adı finansal durum tablosu, gelir tablosunun adı kapsamlı gelir tablosu olmuştur."],a:4,e:"A: standart format verilmemiştir. B: üç bölüm vardır. C: sıra ve biçim işletmeye bırakılmıştır. D: BIST ara dönemi 3 aydır."},
{c:3,q:"Bir işletmenin verileri: Brüt satışlar 600.000 TL; satıştan iadeler 20.000 TL; satış iskontoları 10.000 TL; satışların maliyeti 380.000 TL; faaliyet giderleri 90.000 TL; diğer faaliyetlerden olağan gelir ve kârlar 15.000 TL; diğer faaliyetlerden olağan gider ve zararlar 5.000 TL; finansman giderleri 20.000 TL. Olağan dışı kalem ve vergi yoktur. Dönem kârı kaç TL'dir?",o:["90.000","100.000","110.000","120.000","190.000"],a:0,e:"Net satış 570.000 → brüt kâr 190.000 → faaliyet kârı 100.000 → olağan kâr = 100.000 + 15.000 − 5.000 − 20.000 = 90.000. Tuzaklar: 190.000 brüt kâr; 100.000 faaliyet kârı; 110.000 finansman gideri unutulmuş; 120.000 diğer gider ters işaretli."},
{c:3,q:"Aşağıdakilerden hangisi gelir tablosunun kullanılan adlarından biri DEĞİLDİR?",o:["Finansal performans tablosu","Kâr veya zarar tablosu","Kapsamlı gelir tablosu","Finansal durum tablosu","Gelir tablosu"],a:3,e:"Finansal durum tablosu bilançonun TMS adıdır. Diğerleri gelir tablosunun adlarıdır (slayt 62)."},
{c:3,q:"Bir işletme dönemde 100.000 TL gelir, 80.000 TL gider elde etmiştir. Aynı dönemde ortaklara 10.000 TL temettü ödenmiş ve ortaklar 20.000 TL nakit sermaye artırımı yapmıştır. Gelir ve gider tanımlarına göre dönem kârı kaç TL'dir?",o:["10.000","40.000","20.000","30.000","0"],a:2,e:"Dönem kârı = 100.000 − 80.000 = 20.000. Sermaye artırımı gelir değildir; temettü gider değildir. Tuzaklar: 10.000 (temettü düşülmüş), 40.000 (sermaye eklenmiş), 30.000 (karışık)."},
{c:4,q:"Dönen varlıkları 72.000 TL, duran varlıkları 108.000 TL, KVYK 64.000 TL, UVYK 36.000 TL ve sermayesi 90.000 TL olan işletmenin özkaynaklar toplamı ve dönem sonucu hangisidir?",o:["90.000 TL; 10.000 TL kâr","80.000 TL; 10.000 TL zarar","80.000 TL; 10.000 TL kâr","90.000 TL; 10.000 TL zarar","100.000 TL; sonuç yok"],a:1,e:"Aktif 180.000; yabancı kaynak 100.000 → özkaynak 80.000. Sermaye 90.000 → 80.000 − 90.000 = 10.000 zarar. D'de özkaynak sermayeye eşit sanılmış."},
{c:4,q:"Aşağıdaki işlemlerden hangisi aktif toplamını ve pasif toplamını aynı anda artırır?",o:["Alıcılardan nakit tahsilat yapılması","Peşin demirbaş satın alınması","Satıcılara nakit borç ödenmesi","Vadeli ticari mal satın alınması","Bankaya nakit yatırılması"],a:3,e:"Vadeli mal alımında mal (aktif) ve satıcılar (pasif) birlikte artar. A, B, E aktif ↔ aktif işlemidir; C iki toplamı da azaltır."},
{c:4,q:"Çelik Ticaret: 100.000 TL sermayeyle kuruluyor; 20.000 TL peşin demirbaş; 50.000 TL'lik mal, yarısı peşin yarısı vadeli alınıyor; satıcıya 15.000 TL ödeniyor; maliyeti 30.000 TL olan mal 38.000 TL'ye satılıyor (20.000 TL peşin, kalanı 2 ay vadeli). Son durumda aktif toplamı kaç TL'dir?",o:["100.000","110.000","118.000","126.000","130.000"],a:2,e:"Kasa 60.000 + Alıcılar 18.000 + Ticari mal 20.000 + Demirbaş 20.000 = 118.000 = Satıcılar 10.000 + Sermaye 100.000 + Kâr 8.000. 110.000 satış öncesi durumdur."},
{c:5,q:"Hesapların çalışma kurallarına ilişkin hangisi YANLIŞTIR?",o:["Aktif hesaplarda artışlar borç tarafına yazılır.","Pasif hesaplarda artışlar alacak tarafına yazılır.","Gider hesaplarında artışlar borç tarafına yazılır.","Gelir hesaplarında artışlar alacak tarafına yazılır.","Pasif hesaplarda azalışlar alacak tarafına yazılır."],a:4,e:"Pasif hesaplarda azalış borç tarafına yazılır. Pasifte artış alacak, azalış borçtur."},
{c:5,q:"Satıcılar hesabı mart başında 40.000 TL alacak bakiyesi vermektedir. Mart ayında 15.000 TL vadeli ticari mal alınmış, 25.000 TL satıcılara nakit ödenmiştir. Mart sonunda hesabın bakiyesi nedir?",o:["30.000 TL borç bakiyesi","30.000 TL alacak bakiyesi","50.000 TL alacak bakiyesi","80.000 TL alacak bakiyesi","Hesap kapalıdır"],a:1,e:"Alacak: 40.000 + 15.000 = 55.000; borç: 25.000; bakiye 30.000 alacak. 50.000 işaretlerin ters kullanılmasıyla çıkar (40 − 15 + 25)."},
{c:5,q:"Aşağıdaki hesaplardan hangisi alacak bakiyesi verir?",o:["Kasa","Alıcılar","Demirbaşlar","Genel yönetim giderleri","Yurt içi satışlar"],a:4,e:"Gelir hesabı: artış alacak, normal bakiye alacak. Kasa, alıcılar, demirbaşlar aktif; genel yönetim giderleri gider hesabıdır, hepsi borç bakiyesi verir."},
{c:5,q:"Aşağıdaki yevmiye maddelerinden hangisi karma maddedir?",o:["Kasa 10.000 + Bankalar 20.000 / Alıcılar 25.000 + Alacak senetleri 5.000","Kasa / Sermaye","Ticari mallar / Kasa + Satıcılar","Kasa + Alıcılar / Yurt içi satışlar","Demirbaşlar / Bankalar"],a:0,e:"Karma madde, hem borçta hem alacakta birden fazla hesap içerir. C ve D bileşik; B ve E basit maddedir."},
{c:5,q:"Yevmiye maddesinin yazımına ilişkin hangisi DOĞRUDUR?",o:["Alacaklı hesaplar önce ve satır başından yazılır.","Borçlu ve alacaklı hesaplar aynı hizadan yazılır.","Borçlu hesaplar sonra ve içeriden yazılır.","Borçlu hesaplar önce ve satır başından, alacaklı hesaplar sonra ve biraz içeriden yazılır.","Tutarlar açıklama sütununa yazılır."],a:3,e:"Borç önce ve satır başından; alacak sonra ve biraz içeriden. Tutarlar borç ve alacak sütunlarına konur."},
{c:5,q:"Aşağıdaki işlemlerden hangisi için mahsup fişi düzenlenir?",o:["Ortağın işletmeye nakit sermaye koyması","Alıcıdan nakit tahsilat yapılması","Vadeli ticari mal satın alınması","Satıcıya nakit ödeme yapılması","Peşin demirbaş satın alınması"],a:2,e:"Vadeli mal alımında kasa girmiyor, çıkmıyor → mahsup. A ve B kasa girişi → tahsil; D ve E kasa çıkışı → tediye."},
{c:6,q:"Mizana ilişkin hangisi YANLIŞTIR?",o:["Tutar sütunlarında borç toplamı, alacak toplamına eşittir.","Kalan (bakiye) sütunlarında borç toplamı, alacak toplamına eşittir.","Genel geçici mizan, aralık ayında düzenlenir.","Kesin mizan, envanter işlemlerinden ve gelir-gider hesapları kapatıldıktan sonra düzenlenir.","Aylık geçici mizan, yalnızca dönem sonunda, envanter işlemlerinden sonra düzenlenir."],a:4,e:"Aylık geçici mizan her ay sonu düzenlenir. Envanterden sonra düzenlenen kesin mizandır."},
{c:6,q:"KALE İşletmesi: 36.000 nakit + 34.000 ticari mal = 70.000 sermaye; bankaya 13.000; maliyeti 30.000 olan mal 40.000'e yarı peşin yarı vadeli satış; 44.000'lik mal alımı (20.000 nakit, kalanı vadeli); 6.000 genel yönetim gideri; 5.000 peşin demirbaş; satıcılara 12.000; alıcılardan 15.000 tahsilat. Geçici mizanda kalan (bakiye) sütunları borç toplamı kaç TL'dir?",o:["86.000","108.000","122.000","157.000","235.000"],a:2,e:"Kalan borç: Kasa 15.000 + Ticari mallar 48.000 + Bankalar 13.000 + Alıcılar 5.000 + Demirbaş 5.000 + STMM 30.000 + GYG 6.000 = 122.000. 86.000 bilanço toplamıdır (gelir-gider hesapları yok); 235.000 tutar sütunu toplamıdır."},
{c:6,q:"Aynı KALE İşletmesi'nin mizanında Ticari Mallar hesabının satırı hangisidir?",o:["Borç tutar 78.000; alacak tutar 30.000; kalan borç 48.000","Borç tutar 78.000; alacak tutar 30.000; kalan alacak 48.000","Borç tutar 34.000; alacak tutar 30.000; kalan borç 4.000","Borç tutar 44.000; alacak tutar 30.000; kalan borç 14.000","Borç tutar 78.000; alacak tutar 30.000; kalan borç 108.000"],a:0,e:"Borç: 34.000 (sermaye) + 44.000 (alım) = 78.000. Alacak: 30.000 (satılan malın maliyeti). Kalan: 78.000 − 30.000 = 48.000 borç."},
{c:6,q:"Muhasebenin dönemsel sürecinde doğru sıralama hangisidir? (I. Geçici mizan, II. Envanter işlemleri, III. Gelir ve gider hesaplarının kapatılması, IV. Kesin mizan, V. Kapanış kaydı)",o:["I – II – III – IV – V","II – I – III – IV – V","I – III – II – IV – V","I – II – IV – III – V","I – II – III – V – IV"],a:0,e:"Geçici mizan → envanter → gelir-gider kapatma → kesin mizan → kapanış kaydı. Bilanço ve gelir tablosu kesin mizandan sonra, kapanıştan önce düzenlenir."},
{c:4,q:"AZ İşletmesi: 60.000 TL nakit sermaye; 8.000 TL peşin demirbaş; 45.000 TL'lik mal (30.000 nakit, kalanı açık hesap); maliyeti 26.000 TL olan mal 35.000 TL'ye satılmış (4.000 nakit, kalanı açık hesap); bankaya 12.000 TL yatırılmış; alıcılardan 10.000 TL nakit tahsilat; 3.000 TL genel yönetim gideri; satıcılara 5.000 TL bankadan havale. Aktif toplamı kaç TL'dir?",o:["70.000","76.000","79.000","102.000","115.000"],a:1,e:"Kasa 21.000 + Bankalar 7.000 + Alıcılar 21.000 + Ticari mallar 19.000 + Demirbaş 8.000 = 76.000. 79.000: gider ödenmemiş sayılmış. 102.000: satılan malın maliyeti stoktan düşülmemiş."},
{c:4,q:"AN İşletmesi: 25.000 nakit + 40.000 ticari mal + 10.000 demirbaş = 75.000 sermaye; bankaya 10.000; maliyeti 25.000 olan mal 34.000'e satılıyor (10.000 nakit, kalanı vadeli); 40.000'lik mal alınıyor (15.000 nakit, kalanı vadeli); 4.000 kırtasiye gideri; alıcılardan 8.000 tahsilat; satıcılara 10.000 ödeme. Aktif toplamı ve dönem kârı nedir?",o:["95.000 TL; 9.000 TL","90.000 TL; 5.000 TL","99.000 TL; 5.000 TL","95.000 TL; 5.000 TL","94.000 TL; 4.000 TL"],a:3,e:"Kasa 4.000 + Bankalar 10.000 + Alıcılar 16.000 + Ticari mallar 55.000 + Demirbaş 10.000 = 95.000. Kâr = 34.000 − 25.000 − 4.000 = 5.000. 9.000 brüt kârdır; gider düşülmemiş."},
{c:4,q:"75.000 TL sermayeyle kurulan bir işletmenin dönem sonunda varlıkları toplamı 95.000 TL, satıcılara borcu (tek yabancı kaynak) 15.000 TL'dir. Özkaynaklar toplamı kaç TL'dir?",o:["75.000","70.000","80.000","84.000","95.000"],a:2,e:"Özkaynak = Aktif − yabancı kaynak = 95.000 − 15.000 = 80.000 (75.000 sermaye + 5.000 dönem kârı). 75.000 yalnız sermayedir."},
{c:1,q:"Aşağıdakilerden hangisi bir muhasebe fişidir, belge DEĞİLDİR?",o:["Gider pusulası","Müstahsil makbuzu","Serbest meslek makbuzu","Ücret bordrosu","Kasa tediye fişi"],a:4,e:"A-D belgedir. Muhasebe fişleri: kasa tahsil, kasa tediye, mahsup."},
{c:2,q:"Dönem net zararı bilançoda hangi biçimle yer alır?",o:["Aktifte, dönen varlıklar içinde","Pasifte, özkaynaklar içinde eksi (düşürücü) kalem olarak","Pasifte, kısa vadeli yabancı kaynaklar içinde","Aktifte, duran varlıklar içinde","Bilançoda hiç yer almaz"],a:1,e:"Zarar kalemleri (dönem net zararı, geçmiş yıllar zararları) özkaynaklar içinde düşürücü kalemdir (slayt 49)."}
];

{id:17,l:4,f:"Dönemsellik: iki gereği",b:"Gelir-giderlerin tahakkuk esasıyla kaydı; gelirlerin aynı dönemin maliyet ve giderleriyle karşılaştırılması."},
{id:18,l:4,f:"Kişilik kavramı nedir?",b:"İşletme, sahip ve yöneticilerden ayrı bir kişiliğe sahiptir; bu kişilik adına yürütülür."},
{id:19,l:4,f:"Özün önceliği nedir?",b:"İşlemlerde biçimden çok öz (ekonomik gerçek) esas alınır."},
{id:20,l:5,f:"Bilanço eşitliğinin üç yazılışı",b:"Aktif = Pasif · Varlıklar = Kaynaklar · Dönen + Duran = KVYK + UVYK + Sermaye (Varlıklar − Borçlar = Sermaye)."},

{id:24,l:5,f:"Hesap tipi ve rapor tipi bilanço farkı",b:"Hesap tipi: aktif sol, pasif sağ. Rapor tipi: alt alta; birden çok yılı yan yana verir, analize uygundur."},

{id:27,l:5,f:"Gelecek aylara ait gelirler hangi grupta?",b:"KVYK (pasif). Alınan avanslar da KVYK."},

{id:29,l:6,f:"Duran varlıkların esas finansman yeri",b:"Özkaynaklar; yetmezse özkaynak + UVYK."},
{id:30,l:6,f:"Özkaynağın ideal iç sırası",b:"Otofinansman > ödenmiş sermaye > sermaye yedekleri; zarar kalemleri hiç yok ya da en sonda."},
{id:31,l:6,f:"Borçla finansmanın amacı ve riski",b:"Daha az özkaynakla yüksek kârlılık, yüksek hisse başına kâr. Risk: faaliyet aksaması, yeni kaynak bulunamaması, yüksek faiz gideri."},
{id:32,l:6,f:"TMS finansal durum tablosunda format",b:"Standart format yok; asgari kalemler tanımlı, sıra ve biçim işletmeye bırakılmış."},
{id:33,l:7,f:"Kâr kademeleri (sırayla)",b:"Brüt satışlar → net satışlar → brüt kâr → faaliyet kârı → olağan kâr → dönem kârı → dönem net kârı."},

{id:35,l:7,f:"Olağan kâr formülü",b:"Faaliyet kârı + diğer faaliyet gelirleri − diğer faaliyet giderleri − finansman giderleri."},
{id:36,l:7,f:"Gider tanımında hariç kalemler",b:"Sermaye azaltımı ve temettü ödemeleri."},
{id:37,l:7,f:"BIST şirketlerinde ara dönem",b:"3 ay."},
{id:38,l:7,f:"Kapsamlı gelir tablosunun 3 bölümü",b:"Sürdürülen faaliyetler, durdurulan faaliyetler, diğer kapsamlı gelirler."},
{id:39,l:8,f:"Vadeli mal alımının eşitliğe etkisi",b:"Mal (aktif) ↑ ve satıcılar (pasif) ↑: iki toplam artar."},
{id:40,l:8,f:"Aktif ↔ aktif işlem örnekleri",b:"Peşin demirbaş alımı, bankaya yatırma, alacak tahsili. Toplam değişmez."},
{id:41,l:9,f:"Gider artışı hangi tarafa yazılır, neden?",b:"Borç. Gider özkaynağı azaltır; pasif azalışı borçtur."},
{id:42,l:9,f:"Dört hesap grubunun artış tarafı",b:"Aktif: borç · Pasif: alacak · Gider: borç · Gelir: alacak."},
{id:43,l:9,f:"Borç ve alacak ne demektir?",b:"Borç = sol taraf, alacak = sağ taraf (günlük dildeki anlamı yok)."},
{id:44,l:9,f:"Bakiye türleri",b:"Borç = alacak: kapalı hesap · Borç > alacak: borç bakiyesi · Borç < alacak: alacak bakiyesi."},
{id:45,l:10,f:"Yevmiye yazım düzeni",b:"Borçlu hesaplar önce ve satır başından; alacaklı hesaplar sonra ve biraz içeriden."},
{id:46,l:10,f:"Basit, bileşik, karma madde",b:"Basit: birer hesap. Bileşik: bir hesabın karşısında çok hesap. Karma: iki tarafta da çok hesap."},
{id:47,l:10,f:"Fiş seçme kuralı",b:"Kasa girerse tahsil, çıkarsa tediye, hiç yoksa mahsup."},
{id:48,l:10,f:"Muhasebe belgeleri",b:"Fatura, perakende satış vesikası, gider pusulası, müstahsil makbuzu, serbest meslek makbuzu, ücret bordrosu."},
{id:49,l:11,f:"Mizanın iki kontrolü",b:"Tutar sütunları borç = alacak; kalan sütunları borç = alacak."},
{id:50,l:11,f:"Üç mizan türü",b:"Aylık geçici (her ay sonu) · Genel geçici (Aralık) · Kesin (envanter ve kapatmadan sonra)."},
{id:51,l:11,f:"Dönemsel sürecin 10 adımı",b:"Açılış kaydı, dönem içi işlemler, geçici mizan, envanter, gelir-gider kapatma, kâr netleştirme, kesin mizan, bilanço-gelir tablosu, kapanış kaydı, envanter defterine yazma."},
{id:52,l:12,f:"Mizan toplamı ile bilanço toplamı neden farklı?",b:"Mizan gelir ve gider hesaplarını ayrı ayrı içerir; bilançoda yalnız net kâr yer alır (KALE: 122.000 ↔ 86.000)."}
];

/* Soru üreticileri: hesaplama soruları, ifade kombinasyonları, eşleştirmeler.

(function(){
var NF=function(n){return Math.round(n).toLocaleString("tr-TR");};
var TL=function(n){return NF(n)+" TL";};
function RNG(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function API(rnd){return {
  n:function(lo,hi,st){st=st||1;return lo+Math.floor(rnd()*(Math.floor((hi-lo)/st)+1))*st;},
  pick:function(a){return a[Math.floor(rnd()*a.length)];},
  mix:function(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}};}
function finish(c,q,right,wrongs,e,r){
  var seen={};seen[right]=1;var w=[];
  r.mix(wrongs).forEach(function(x){if(x!==null&&x!==undefined&&!seen[x]){seen[x]=1;w.push(x);}});
  return w.length>=4?{c:c,q:q,o:[right].concat(w.slice(0,4)),a:0,e:e}:null;
}
function pos(n){return n>0;}
var STEMS={};
/* aynı kökü paylaşan eşleştirme soruları şıklarıyla ayrışır; diğerlerinde aynı kök bir kez */
function key(q){return /eşleştirmelerden/.test(q.q)?q.q+"|"+q.o.slice().sort().join("|"):q.q;}
function build(fn,base,count){
  var out=[];
  for(var i=0;i<count;i++){
    var q=null;
    for(var att=0;att<80&&!q;att++){var r=API(RNG(base+i*131+att*7919));q=fn(r);if(q&&STEMS[key(q)])q=null;}
    if(q){STEMS[key(q)]=1;out.push(q);}
  }
  return out;
}

/* --- Eşitlik ve hesaplama (c4) --- */
function gEq1(r){

  return finish(4,"Bir işletmenin dönen varlıkları "+TL(D)+", duran varlıkları "+TL(U)+", kısa vadeli yabancı kaynakları "+TL(K)+", uzun vadeli yabancı kaynakları "+TL(Y)+" ve sermayesi "+TL(S)+"'dir. Özkaynaklar toplamı ve dönem sonucu nedir?",
   f(OK,res),[f(S,res),f(OK,-res),f(D+U-K,(D+U-K)-S),f(D+U-Y,(D+U-Y)-S),f(D+U,(D+U)-S)],
   "Aktif = "+NF(D)+" + "+NF(U)+" = "+NF(D+U)+"; yabancı kaynak = "+NF(K+Y)+"; özkaynak = "+NF(OK)+". Sermaye "+NF(S)+" olduğundan sonuç = "+NF(OK)+" − "+NF(S)+" = "+NF(res)+" ("+SIGN(res)+"). Tuzak: özkaynağı sermayeye eşitlemek ya da UVYK'yı unutmak.",r);
}

function gSatis(r){

/* çok adımlı eşitlik simülasyonu */
function gCok(r){
  var st={Kasa:0,Alici:0,Mal:0,Dem:0,Sat:0,Ser:0,Kar:0};
  var S=r.n(80,200,10)*1000;st.Kasa=S;st.Ser=S;
  var texts=["İşletme "+TL(S)+" nakit sermaye ile kurulmuştur."],amts=[];

    var t=r.pick(["dem","vmal","pmal","ode","pssat","vsat","tah"]);
    if(t==="dem"){var d=r.n(5,40,5)*1000;if(st.Kasa<d)continue;st.Kasa-=d;st.Dem+=d;texts.push(TL(d)+"'lik demirbaş peşin satın alınmıştır.");amts.push(d);k++;}
    else if(t==="vmal"){var m=r.n(10,60,5)*1000;st.Mal+=m;st.Sat+=m;texts.push(TL(m)+"'lik ticari mal vadeli satın alınmıştır.");amts.push(m);k++;}
    else if(t==="pmal"){var p=r.n(10,50,5)*1000;if(st.Kasa<p)continue;st.Kasa-=p;st.Mal+=p;texts.push(TL(p)+"'lik ticari mal peşin satın alınmıştır.");amts.push(p);k++;}
    else if(t==="ode"){if(st.Sat<5000||st.Kasa<5000)continue;var o=r.n(5,Math.min(st.Sat,st.Kasa)/1000,5)*1000;st.Sat-=o;st.Kasa-=o;texts.push("Satıcılara "+TL(o)+" nakit ödenmiştir.");amts.push(o);k++;}
    else if(t==="pssat"||t==="vsat"){if(st.Mal<10000)continue;var c=r.n(5,st.Mal/1000,5)*1000,pr=c+r.pick([5,8,10,12])*1000;
      st.Mal-=c;st.Kar+=pr-c;if(t==="pssat"){st.Kasa+=pr;texts.push("Maliyeti "+TL(c)+" olan mallar "+TL(pr)+"'ye peşin satılmıştır.");}else{st.Alici+=pr;texts.push("Maliyeti "+TL(c)+" olan mallar "+TL(pr)+"'ye vadeli satılmıştır.");}
      amts.push(pr);k++;}
    else if(t==="tah"){if(st.Alici<5000)continue;var h=r.n(5,st.Alici/1000,5)*1000;st.Alici-=h;st.Kasa+=h;texts.push("Alıcılardan "+TL(h)+" tahsil edilmiştir.");amts.push(h);k++;}
  }
  if(k<4)return null;
  var A=st.Kasa+st.Alici+st.Mal+st.Dem;
  var ask=r.pick(["Kasa","Aktif","Kar","Sat","Alici"]);
  var lab={Kasa:"kasa hesabının bakiyesi",Aktif:"aktif toplamı",Kar:"dönem kârı",Sat:"satıcılar hesabının bakiyesi",Alici:"alıcılar hesabının bakiyesi"}[ask];
  var val={Kasa:st.Kasa,Aktif:A,Kar:st.Kar,Sat:st.Sat,Alici:st.Alici}[ask];
  if(val<=0)return null;
  var a0=r.pick(amts),a1=r.pick(amts),a2=r.pick(amts);
  var wr=[val+a0,val-a0,val+a1,val-a1,val+a2,val+Math.round(a0/2)];
  var wrongs=wr.filter(function(v){return v>0&&v!==val;}).map(TL);
  var ex="Eşitlik tablosu: Kasa "+NF(st.Kasa)+", Alıcılar "+NF(st.Alici)+", Ticari mal "+NF(st.Mal)+", Demirbaş "+NF(st.Dem)+" = Aktif "+NF(A)+"; Satıcılar "+NF(st.Sat)+", Sermaye "+NF(st.Ser)+", Kâr "+NF(st.Kar)+" = Pasif "+NF(st.Sat+st.Ser+st.Kar)+". Satışta maliyet stoktan çıkar, fark kârdır.";
  return finish(4,texts.join(" ")+" Bu işlemlerin sonunda "+lab+" kaç TL'dir?",TL(val),wrongs,ex,r);
}

function gBak(r){

function gGt(r){
  var B=r.n(400,900,10)*1000,i1=r.n(5,25,5)*1000,i2=r.n(3,15,1)*1000,net=B-i1-i2,c=Math.round(net*r.pick([.55,.6,.65,.7])/1000)*1000,f=Math.round(net*r.pick([.08,.1,.12,.15])/1000)*1000;

function playPack(pk,onFail){

/* ---------- Sözlük ---------- */
/* Arama: büyük-küçük harf ve Türkçe karakter farkı gözetmez ("borc" → borç) */
function fold(s){return String(s||"").toLocaleLowerCase("tr").replace(/[çğıöşüâîû]/g,function(c){return {"ç":"c","ğ":"g","ı":"i","ö":"o","ş":"s","ü":"u","â":"a","î":"i","û":"u"}[c];}).replace(/\s+/g," ").trim();}
var LTEXT=null;
function lessonText(){if(!LTEXT)LTEXT=L.map(function(l){var t=String(l.html).replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/\s+/g," ").trim();return {l:l,t:t,f:fold(t)};});return LTEXT;}
function snippet(t,f,q){var i=f.indexOf(q);if(i<0)return "";var a=Math.max(0,i-60),b=Math.min(t.length,i+q.length+80);return (a>0?"…":"")+esc(t.slice(a,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length,b))+(b<t.length?"…":"");}
function glossHtml(q){
  q=fold(q);
  var items=GLOSS.filter(function(g){return !q||fold(g[0]).indexOf(q)>=0||fold(g[1]).indexOf(q)>=0;});
  if(q)items.sort(function(a,b){return (fold(a[0]).indexOf(q)<0)-(fold(b[0]).indexOf(q)<0);});
  var h=items.length?items.map(function(g){return '<div class="term"><b>'+esc(g[0])+'</b><br>'+esc(g[1])+'</div>';}).join(""):(q?'<div class="empty">Sözlükte eşleşen terim yok.</div>':'');
  if(q.length>=2){
    var hits=lessonText().filter(function(x){return x.f.indexOf(q)>=0||fold(x.l.t).indexOf(q)>=0;});
    h+='<h3 style="margin:18px 0 8px">Derslerde geçtiği yerler'+(hits.length?' ('+hits.length+')':'')+'</h3>';
    h+=hits.length?hits.map(function(x){return '<div class="term"><div class="row sp"><b>Parça '+x.l.id+' · '+esc(x.l.t)+'</b><button class="btn sm ghost" data-act="lesson" data-id="'+x.l.id+'">Aç</button></div><small class="sub">'+snippet(x.t,x.f,q)+'</small></div>';}).join(""):'<div class="empty">Derslerde de geçmiyor. Farklı bir kelime dene.</div>';
  }
  return h;
}
function viewGloss(){
  return '<div class="card"><div class="ssticky"><label class="sub" for="gq">Terim ya da konu ara (örn. mizan, borc, amortisman). Sözlükte ve derslerin içinde arar.</label><input id="gq" class="search" data-bind="gq" placeholder="Ara…" value="'+esc(T.gq)+'" type="search" autocomplete="off" style="margin:8px 0 12px"></div><div id="glist">'+glossHtml(T.gq)+'</div></div>';

/* ---------- Atölye ---------- */
function atBal(k,upto){
  var m={};ACCS.forEach(function(a){m[a.n]={b:0,a:0,t:a.t};});
  AT[k].steps.slice(0,upto).forEach(function(s){s[1].forEach(function(l){if(l[1]==="B")m[l[0]].b+=l[2];else m[l[0]].a+=l[2];});});
  return m;
}
function atSummary(m){
  var ak=0,ps=0,ge=0,gi=0;
  ACCS.forEach(function(a){var x=m[a.n];if(a.t==="A")ak+=x.b-x.a;else if(a.t==="P")ps+=x.a-x.b;else if(a.t==="G")ge+=x.a-x.b;else gi+=x.b-x.a;});
  return {ak:ak,ps:ps,ge:ge,gi:gi,kar:ge-gi};
}
function atLedger(k,upto){
  var m=atBal(k,upto),rows="",tb=0,ta=0,kb=0,ka=0;
  ACCS.forEach(function(a){var x=m[a.n];if(!x.b&&!x.a)return;var kal=x.b-x.a;tb+=x.b;ta+=x.a;if(kal>0)kb+=kal;else ka+=-kal;rows+='<tr><td>'+a.n+'</td><td class="n">'+money(x.b)+'</td><td class="n">'+money(x.a)+'</td><td class="n">'+(kal>0?money(kal):'')+'</td><td class="n">'+(kal<0?money(-kal):'')+'</td></tr>';});
  if(!rows)return "";
  var sm=atSummary(m);
  var h='<div class="tw ledger"><table><tr><th>Hesap</th><th class="n">Borç tutar</th><th class="n">Alacak tutar</th><th class="n">Kalan borç</th><th class="n">Kalan alacak</th></tr>'+rows+'<tr class="tot"><td>TOPLAM</td><td class="n">'+money(tb)+'</td><td class="n">'+money(ta)+'</td><td class="n">'+money(kb)+'</td><td class="n">'+money(ka)+'</td></tr></table></div>';

function parseAmt(s){var d=String(s).replace(/[^\d]/g,"");return d?parseInt(d,10):0;}
function entryText(lines){return lines.map(function(l){return (l[1]==="B"?"Borç":"Alacak")+": "+l[0]+" "+money(l[2]);}).join(" · ");}
function atCheck(){
  var a=T.at,st=AT[a.k].steps[a.step],right=st[1];
  var u={},c={},ub=0,ua=0;
  a.rows.forEach(function(r){var v=parseAmt(r.v);if(!r.a||!v)return;var key=r.a+"|"+r.s;u[key]=(u[key]||0)+v;if(r.s==="B")ub+=v;else ua+=v;});
  right.forEach(function(l){c[l[0]+"|"+l[1]]=l[2];});
  var same=Object.keys(c).length===Object.keys(u).length&&Object.keys(c).every(function(k){return u[k]===c[k];});
  if(same){a.fb={t:"ok",m:"<b>Doğru.</b> "+entryText(right)};return;}
  var hints=[];
  if(!Object.keys(u).length)hints.push("Henüz hesap ve tutar girmedin.");
  else{
    if(ub!==ua)hints.push("Borç toplamı ("+money(ub)+") ile alacak toplamı ("+money(ua)+") eşit değil: çift taraflı kayıt dengede olmalı.");
    var cacc={};right.forEach(function(l){cacc[l[0]]=l;});
    Object.keys(u).forEach(function(k){var p=k.split("|"),acc=p[0],side=p[1];
      if(!cacc[acc])hints.push("“"+acc+"” bu olayda etkilenmiyor.");
      else if(cacc[acc][1]!==side)hints.push("“"+acc+"” hesabının tarafını gözden geçir (artış mı azalış mı?).");
      else if(cacc[acc][2]!==u[k])hints.push("“"+acc+"” için tutarı kontrol et.");});
    var miss=right.filter(function(l){return !Object.keys(u).some(function(k){return k.split("|")[0]===l[0];});}).length;
    if(miss)hints.push(miss+" etkilenen hesap eksik.");
  }
  a.fb={t:"bad",m:"<b>Henüz değil.</b><ul>"+hints.map(function(x){return "<li>"+x+"</li>";}).join("")+"</ul>"};
}

function stopTimer(){if(T.timer){clearInterval(T.timer);T.timer=null;}}
function startTest(ids,mode,inline){
  var qs=inline?inline.map(function(q){return {q:q,order:shuffle([0,1,2,3,4]),pick:null,struck:[]};}):ids.map(function(id){return {id:id,order:shuffle([0,1,2,3,4]),pick:null,struck:[]};});
  if(!qs.length){toast("Bu seçimde soru yok.");return;}
  T.test={qs:qs,i:0,mode:mode,start:Date.now(),limit:mode==="sinav"?Math.round(qs.length*90):0,done:false,fresh:!!inline};
  stopTimer();T.timer=setInterval(tick,1000);T.scroll=true;S.view="test";render();
}
function mmss(s){return pad(Math.floor(s/60))+":"+pad(s%60);}
function tick(){
  var t=T.test,el=document.getElementById("timer");if(!t||t.done){stopTimer();return;}
  var es=Math.floor((Date.now()-t.start)/1000);
  if(t.limit){var rem=t.limit-es;if(rem<=0){finishTest();return;}if(el){el.textContent=mmss(rem);el.classList.toggle("low",rem<300);}}
  else if(el)el.textContent=mmss(es);
}
function finishTest(){
  var t=T.test;if(!t||t.done)return;
  stopTimer();t.done=true;t.secs=Math.floor((Date.now()-t.start)/1000);
  var ok=0,byCat={};
  t.qs.forEach(function(it){var q=getQ(it),right=it.pick===q.a;if(right)ok++;
    var c=S.cat[q.c]||{ok:0,n:0};c.n++;if(right)c.ok++;S.cat[q.c]=c;
    byCat[q.c]=byCat[q.c]||{ok:0,n:0};byCat[q.c].n++;if(right)byCat[q.c].ok++;
    if(it.id!==undefined){if(right){if(S.wrong[it.id])delete S.wrong[it.id];}else S.wrong[it.id]=(S.wrong[it.id]||0)+1;}});
  t.ok=ok;t.byCat=byCat;t.score=Math.round(ok/t.qs.length*100);
  S.tests.push({d:today(),score:t.score,n:t.qs.length,mode:t.mode});if(S.tests.length>30)S.tests.shift();
  touch();save();render();
}

  var msg=t.score>=85?"Tam puana yakınsın.":t.score>=70?"İyi gidiyorsun; kalan boşlukları kapat.":t.score>=50?"Temel var; zayıf konulara bir tur daha.":"Konuyu yeniden çalışmak gerek; hata defteri seni yönlendirir.";
  h+='<div class="card"><div class="row sp" style="align-items:flex-end"><div><div class="score">%'+t.score+'</div><p class="sub">'+t.ok+' doğru / '+n+' soru. '+msg+'</p></div><div class="row"><button class="btn gold" data-act="test-wrong">Yanlışları yeniden çöz</button><button class="btn ghost" data-act="test-new">Yeni test</button></div></div></div>';
  h+='<h2 style="margin:22px 0 10px">Konu bazında</h2><div class="card"><div class="cats">'+Object.keys(t.byCat).map(function(c){var s=t.byCat[c],p=Math.round(s.ok/s.n*100);return '<div class="c"><span>'+CATS[c]+'</span><div class="bar '+(p>=70?'ok':'')+'"><i style="width:'+p+'%"></i></div><span class="pill '+(p>=70?'ok':p>=50?'gold':'bad')+'">'+s.ok+'/'+s.n+'</span></div>';}).join("")+'</div></div>';
  h+='<h2 style="margin:22px 0 10px">Soru soru inceleme</h2>';
  t.qs.forEach(function(it,i){var q=getQ(it),right=it.pick===q.a,p=plain(q.q);
    h+='<details class="card qa" style="margin-top:10px"><summary style="cursor:pointer;font-weight:600"><span class="pill '+(right?'ok':'bad')+'">'+(right?'Doğru':it.pick===null?'Boş':'Yanlış')+'</span> '+(i+1)+'. '+esc(p.length>120?p.slice(0,120)+"…":p)+'</summary><div style="margin-top:10px"><p>'+q.q+'</p><p><b>Doğru cevap:</b> '+q.o[q.a]+'</p>'+(right?'':'<p><b>Senin cevabın:</b> '+(it.pick===null?'boş bırakıldı':q.o[it.pick])+'</p>')+'<div class="fb hint">'+q.e+'</div></div></details>';});
  return h;
}
function viewTest(){return T.test?viewTestRun():viewTestSetup();}

/* ---------- render ---------- */
function render(){
  var v=S.view,c;
  if(v==="pano")c=viewPano();
  else if(v==="ders")c=T.lesson?viewLesson():viewDersList();
  else if(v==="tekrar")c=viewTekrar();
  else if(v==="atolye")c=viewAtolye();
  else c=viewTest();
  var ae=document.activeElement,keep=ae&&ae.getAttribute&&ae.getAttribute("data-bind")?[ae.getAttribute("data-bind"),ae.getAttribute("data-i")]:null;
